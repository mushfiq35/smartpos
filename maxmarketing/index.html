<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" defer crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" defer crossorigin="anonymous"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --paper:#FAF6EC; --paper-card:#F1EAD8; --ink:#2B2620; --ink-soft:#6b6255;
  --line:#D8CDB4; --amber:#C1772E; --amber-deep:#8f5720;
  --green:#3F7D58; --green-bg:#E4EEE6; --red:#B4423A; --red-bg:#F6E4E2;
  --blue:#3E6B8A; --blue-bg:#E2ECF2; --gold:#C9992F; --gold-bg:#F7EEDA;
  --sidebar-w:230px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;overflow-x:hidden;}
.app{display:flex;min-height:100vh;max-width:100vw;overflow-x:hidden;}

/* Sidebar */
.sidebar{
  width:var(--sidebar-w);background:var(--ink);color:var(--paper);
  position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:40;
  transition:transform 0.25s ease;
}
.sidebar .logo{padding:20px 18px 14px;border-bottom:1px solid rgba(250,246,236,0.12);}
.sidebar .logo h1{font-family:'Roboto Slab',serif;font-size:19px;margin:0;color:var(--paper);}
.sidebar .logo p{margin:2px 0 0;font-size:11px;color:rgba(250,246,236,0.55);}
.newsale-btn{
  margin:14px 18px;padding:9px 0;text-align:center;background:var(--amber);color:#fff;
  border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;width:calc(100% - 36px);
}
.nav{padding:6px 10px 20px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;
  color:rgba(250,246,236,0.75);font-size:14px;font-weight:500;cursor:pointer;
  border-left:3px solid transparent;margin-bottom:2px;
}
.nav-item:hover{background:rgba(250,246,236,0.06);}
.nav-item.active{background:rgba(193,119,46,0.18);color:#fff;border-left-color:var(--amber);}
.nav-item .ic{font-size:16px;width:18px;text-align:center;}
.nav-item .badge{
  margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-family:'IBM Plex Mono';
  padding:1px 6px;border-radius:10px;
}

.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:35;}

/* Main */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;overflow-x:hidden;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;border-bottom:1px solid var(--line);background:var(--paper);
  position:sticky;top:0;z-index:20;
}
.topbar .page-title{font-family:'Roboto Slab',serif;font-size:22px;font-weight:700;}
.topbar .crumb{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.hamburger{display:none;background:none;border:1px solid var(--line);border-radius:6px;width:36px;height:36px;font-size:16px;cursor:pointer;}
.content{padding:22px 24px 80px;}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.dashboard-2col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
@media (max-width:900px){
  .dashboard-2col{grid-template-columns:1fr;}
}
.stat-card{
  border-radius:10px;padding:16px 18px;color:#fff;box-shadow:0 1px 0 rgba(43,38,32,0.06);
}
.stat-card .val{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;line-height:1.1;}
.stat-card .lbl{font-size:12px;opacity:0.9;margin-top:4px;}
.stat-card.c1{background:var(--blue);} .stat-card.c2{background:var(--ink-soft);}
.stat-card.c3{background:#4a8a90;} .stat-card.c4{background:var(--green);}
.stat-card.c5{background:var(--green);opacity:0.85;} .stat-card.c6{background:var(--blue);opacity:0.85;}
.stat-card.c7{background:var(--red);} .stat-card.c8{background:var(--gold);color:var(--ink);}

.panel{background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;overflow-x:auto;}
.panel h3{font-family:'Roboto Slab',serif;margin:0 0 14px;font-size:16px;}

/* Toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.toolbar input, .toolbar select{
  font-family:'Inter';font-size:14px;padding:9px 12px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink);
}
.toolbar input[type="text"]{flex:1;min-width:160px;}
.btn{font-family:'Inter';font-weight:600;font-size:14px;padding:9px 16px;border-radius:6px;border:none;cursor:pointer;background:var(--ink);color:var(--paper);}
.btn.amber{background:var(--amber);color:#fff;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.small{padding:6px 10px;font-size:12px;}

/* Table */
#pgTableWrap{overflow-x:auto;}
#instPageList{overflow-x:auto;}
#returnsPageList{overflow-x:auto;}
#custReportList{overflow-x:auto;}
#suppReportList{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:14px;}
table.data th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line);}
table.data td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
table.data th{white-space:nowrap;}
table.data tr.low td{background:var(--red-bg);}
table.data tr:hover td{background:rgba(193,119,46,0.06);}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.pill.green{background:var(--green-bg);color:var(--green);}
.pill.red{background:var(--red-bg);color:var(--red);}
.actions-cell{display:flex;gap:6px;flex-wrap:nowrap;white-space:nowrap;align-items:center;}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{border-color:var(--ink);}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:10px;}
.pagination-row{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  padding:14px 4px 4px;font-size:13px;color:var(--ink-soft);
}
.pagination-btns{display:flex;align-items:center;gap:10px;}
.pagination-page{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);}
.pagination-btns .btn:disabled{opacity:0.4;cursor:not-allowed;}
.report-print-table{display:none;}
@media print{
  .report-screen-table{display:none !important;}
  .report-print-table{display:block !important;}
}
.empty .big{font-family:'Roboto Slab',serif;font-size:18px;color:var(--ink);margin-bottom:6px;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(43,38,32,0.4);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--paper);border-radius:10px;padding:24px;width:100%;max-width:420px;border:1px solid var(--line);max-height:90vh;overflow-y:auto;overflow-x:auto;}
.modal h2{font-family:'Roboto Slab',serif;margin:0 0 16px;font-size:19px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em;}
.field input, .field select, .field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-family:'Inter';font-size:14px;background:#fff;color:var(--ink);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.field-hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

.loading{text-align:center;padding:60px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.app-footer{
  text-align:center;padding:16px 24px 24px;font-size:12px;color:var(--ink-soft);
  border-top:1px solid var(--line);margin-top:20px;
}

/* Storage status banner */
.storage-banner{
  padding:10px 24px;font-size:13px;display:flex;align-items:center;gap:8px;
}
.storage-banner.warn{background:var(--gold-bg);color:var(--amber-deep);border-bottom:1px solid var(--line);}
.storage-banner.ok{background:var(--green-bg);color:var(--green);border-bottom:1px solid var(--line);}
.storage-banner a{color:inherit;font-weight:600;}

/* Toast */
.toast{
  position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;opacity:0;
  transition:opacity 0.3s ease;pointer-events:none;
}
.toast.show{opacity:1;}

/* Reports mini bars */
.rbar-row{display:grid;grid-template-columns:90px 1fr 90px;gap:10px;align-items:center;padding:6px 0;font-size:13px;}
.rbar-track{background:var(--line);border-radius:4px;height:10px;overflow:hidden;}
.rbar-fill{height:100%;background:var(--amber);}

@media (max-width:900px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop.open{display:block;}
  .main{margin-left:0;}
  .hamburger{display:block;}
}

/* Logo + language switcher */
.logo-row{display:flex;align-items:center;gap:10px;}
.logo-img{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#fff;flex-shrink:0;}
.logo-placeholder{width:36px;height:36px;border-radius:6px;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Roboto Slab',serif;font-weight:700;font-size:16px;flex-shrink:0;}
.logo-upload-btn{font-size:10px;color:rgba(250,246,236,0.55);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;margin-top:2px;}
.lang-switch{
  margin:0 18px 10px;display:flex;border:1px solid rgba(250,246,236,0.2);border-radius:6px;overflow:hidden;
}
.lang-switch button{
  flex:1;background:none;border:none;color:rgba(250,246,236,0.6);font-size:12px;font-weight:600;
  padding:6px 0;cursor:pointer;
}
.lang-switch button.active{background:var(--amber);color:#fff;}

.select-row{display:flex;gap:6px;}
.select-row select{flex:1;}
.qa-btn{
  flex-shrink:0;width:38px;border:1px solid var(--line);background:var(--amber);color:#fff;
  border-radius:6px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;
}
.qa-btn:hover{background:var(--amber-deep);}
.overlay.top{z-index:80;}

@media print{
  .sidebar, .topbar, #storageBanner, .toast, #backdrop, .toolbar button, .actions-cell, .no-print{display:none !important;}
  .main{margin-left:0 !important;}
  body{background:#fff;}
  .panel, table.data{border-color:#ccc;}
  .overlay.open{position:static !important;background:none !important;padding:0 !important;}
  .overlay.open .modal{max-width:100% !important;border:none !important;box-shadow:none !important;padding:0 !important;}
  body:has(.overlay.open) .content{display:none !important;}
  .app{min-height:0 !important;display:block !important;}
  .main{min-height:0 !important;}
}

.print-header{display:none;}
@media print{
  .print-header{display:flex !important;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #2B2620;}
  .print-header img{width:44px;height:44px;object-fit:cover;border-radius:6px;}
  .print-header .ph-name{font-family:'Roboto Slab',serif;font-weight:700;font-size:20px;color:#2B2620;}
  .print-header .ph-contact{font-size:11px;color:#6b6255;line-height:1.5;margin-top:2px;}
}

.tabs-sub{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.sub-tab{background:none;border:none;padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;}
.sub-tab.active{color:var(--ink);border-bottom-color:var(--amber);}
.pick-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.pick-item{background:var(--paper-card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Inter';}
.pick-item.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.pick-item .pill{margin-left:2px;}

.ms-row{
  display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end;
  background:var(--paper-card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;
}
.ms-row .field{margin-bottom:0;}
.ms-row .ms-remove{
  background:var(--red-bg);color:var(--red);border:none;border-radius:6px;width:34px;height:34px;
  cursor:pointer;font-size:14px;
}
.ms-add-row{
  display:flex;align-items:center;gap:6px;background:none;border:1px dashed var(--line);color:var(--ink);
  border-radius:8px;padding:9px;width:100%;justify-content:center;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:14px;
}
.ms-add-row:hover{border-color:var(--amber);color:var(--amber);}
.ms-product-results{
  position:absolute;top:100%;left:0;right:38px;background:#fff;border:1px solid var(--line);
  border-radius:6px;max-height:180px;overflow-y:auto;z-index:60;box-shadow:0 4px 10px rgba(0,0,0,0.1);
  display:none;margin-top:2px;
}
.ms-product-results.open{display:block;}
.ms-product-result-item{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);}
.ms-product-result-item:last-child{border-bottom:none;}
.ms-product-result-item:hover{background:var(--paper-card);}
.ms-grand-total{
  display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
  background:var(--gold-bg);border-radius:8px;font-weight:700;margin-bottom:14px;
}
@media (max-width:640px){
  .ms-row{grid-template-columns:1fr 1fr;}
  .ms-row .ms-remove{grid-column:span 2;width:100%;}
}

/* Login Screen */
.login-screen{
  position:fixed;inset:0;background:var(--paper);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.login-screen.open{display:flex;}
.login-box{
  background:var(--paper-card);border:1px solid var(--line);border-radius:12px;
  padding:32px 28px;width:100%;max-width:340px;box-shadow:0 4px 20px rgba(43,38,32,0.08);
}
.login-box h1{font-family:'Roboto Slab',serif;font-size:24px;margin:0 0 4px;text-align:center;}
.login-box p{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
.login-box .field{margin-bottom:14px;}
.login-box .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em;}
.login-box input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:'Inter';font-size:14px;background:#fff;}
.login-box .btn{width:100%;margin-top:6px;padding:11px 0;}
.login-error{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:16px;}
.logout-row{padding:12px 18px;border-top:1px solid rgba(250,246,236,0.12);}
.logout-row button{
  width:100%;background:none;border:1px solid rgba(250,246,236,0.25);color:rgba(250,246,236,0.8);
  padding:8px 0;border-radius:6px;font-size:13px;cursor:pointer;font-family:'Inter';font-weight:600;
}
.logout-row button:hover{background:rgba(250,246,236,0.08);}
.backup-row{padding:12px 18px 0;display:flex;gap:8px;}
.backup-row button{
  flex:1;background:none;border:1px solid rgba(250,246,236,0.25);color:rgba(250,246,236,0.8);
  padding:8px 4px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Inter';font-weight:600;
}
.backup-row button:hover{background:rgba(250,246,236,0.08);}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1 id="loginTitle"></h1>
    <p id="loginSubtitle">Please log in to continue</p>
    <div class="field">
      <label id="loginEmailLabel">Email</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="field">
      <label id="loginPasswordLabel">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn amber" id="loginBtn">Login</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
<div class="app" id="appRoot" style="display:none;">
  <div class="sidebar-backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-row">
        <div id="logoWrap"><div class="logo-placeholder">M</div></div>
        <div>
          <h1 id="brandName"></h1>
          <p id="brandSub">Business Management</p>
        </div>
      </div>
      <button class="logo-upload-btn" id="logoUploadBtn">লোগো পরিবর্তন / Change logo</button>
      <input type="file" id="logoFileInput" accept="image/*" style="display:none;">
    </div>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="bn">বাংলা</button>
      <button data-lang="en">English</button>
    </div>
    <button class="newsale-btn" id="quickSaleBtn">+ New Sale</button>
    <nav class="nav" id="navList"></nav>
    <div class="backup-row" id="backupRow" style="display:none;">
      <button id="backupBtn">☁️ Backup</button>
      <button id="restoreBtn">♻️ Restore</button>
    </div>
    <div class="backup-row">
      <button id="clearAllBtn" style="border-color:rgba(180,66,58,0.5);color:#e6a29c;">🗑️ Clear All Data</button>
    </div>
    <div class="logout-row" id="logoutRow" style="display:none;">
      <button id="logoutBtn">Logout</button>
    </div>
  </aside>

  <div class="main">
    <div class="print-header" id="printHeader"></div>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <div>
          <div class="page-title" id="pageTitle">Dashboard</div>
          <div class="crumb" id="pageCrumb">Dashboard</div>
        </div>
      </div>
    </div>
    <div id="storageBanner"></div>
    <div class="content" id="content"><div class="loading">লোড হচ্ছে...</div></div>
    <div class="app-footer no-print">© <span id="footerYear"></span> Take Expert. All rights reserved.</div>
  </div>
</div>

<!-- Generic Form Modal -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <h2 id="formTitle">Form</h2>
    <div id="formFields"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="formCancelBtn">বাতিল</button>
      <button class="btn amber" id="formSaveBtn">সংরক্ষণ করুন</button>
    </div>
  </div>
</div>

<!-- Customer History Modal -->
<div class="overlay" id="historyOverlay">
  <div class="modal" style="max-width:700px;width:95%;">
    <h2 id="historyTitle">History</h2>
    <div id="historyBody"></div>
    <div class="modal-actions no-print">
      <button class="btn ghost" id="historyCloseBtn">বন্ধ করুন</button>
      <button class="btn amber" id="historyPrintBtn">🖨</button>
    </div>
  </div>
</div>

<!-- Pay Due Modal -->
<div class="overlay" id="payDueOverlay">
  <div class="modal" style="max-width:360px;">
    <h2 id="payDueTitle">Pay Due</h2>
    <div id="payDueBody"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="payDueCancelBtn">Cancel</button>
      <button class="btn amber" id="payDueSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Return Modal -->
<div class="overlay top" id="returnOverlay">
  <div class="modal" style="max-width:650px;width:90%;">
    <h2 id="returnTitle">New Return</h2>
    <div class="field-hint" id="returnLineInfo" style="margin-bottom:12px;"></div>
    <div class="field"><label id="returnQtyLabel">Return Qty</label><input type="number" id="returnQtyInput" min="1"></div>
    <div class="field"><label id="returnDateLabel">Date</label><input type="date" id="returnDateInput"></div>
    <div class="field"><label id="returnNoteLabel">Reason/Note</label>
      <input type="text" id="returnNoteInput" list="dl-return-note" autocomplete="off">
      <datalist id="dl-return-note"></datalist>
    </div>
    <div class="field-hint" id="returnCalcInfo" style="margin:10px 0;"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="returnCancelBtn">Cancel</button>
      <button class="btn amber" id="returnConfirmBtn">Confirm Return</button>
    </div>
  </div>
</div>

<!-- Sale View Modal -->
<div class="overlay" id="saleViewOverlay">
  <div class="modal" style="max-width:800px;width:95%;">

<!-- Pay Due Modal -->
<div class="overlay" id="dueOverlay">

      <button class="btn amber" id="dueConfirmBtn">Confirm</button>

</div>

</div>

   বসান — না বসালে Backup/Restore বাটন কাজ করবে না। */
const googleClientId = "828265788753-3jihsgrb36s6nanln1e7v1lv7d02e3ov.apps.googleusercontent.com";
let gisTokenClient = null;
let gisAccessToken = null;
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

function initGoogleDrive(retriesLeft){
  try{
    retriesLeft = retriesLeft === undefined ? 20 : retriesLeft;
    const configured = googleClientId && googleClientId !== "YOUR_GOOGLE_CLIENT_ID";
    const row = document.getElementById('backupRow');
    if(!configured){
      if(row) row.style.display = 'none';
      return;
    }
    if(!window.google || !google.accounts || !google.accounts.oauth2){
      if(retriesLeft > 0) setTimeout(() => initGoogleDrive(retriesLeft-1), 250);
      return;
    }
    gisTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: googleClientId,
      scope: DRIVE_SCOPE,
      callback: ''
    });
    if(row) row.style.display = 'flex';
  }catch(e){
    console.error('Google Drive init failed (non-fatal)', e);
  }
}

function requestDriveToken(onReady){
  if(!gisTokenClient) return;
  gisTokenClient.callback = (resp) => {
    if(resp.error){ console.error('drive auth failed', resp); showToast(t('drive_auth_failed')); return; }
    gisAccessToken = resp.access_token;
    onReady();
  };
  gisTokenClient.requestAccessToken({ prompt: gisAccessToken ? '' : 'consent' });
}

async function backupToDrive(){
  requestDriveToken(async () => {
    try{
      const payload = JSON.stringify({
        exportedAt: new Date().toISOString(),
        customers: db.customers, suppliers: db.suppliers, products: db.products,
        purchases: db.purchases, sales: db.sales, expenses: db.expenses
      }, null, 2);
      const fileName = `${SHOP_NAME}-backup-${todayStr()}-${Date.now()}.json`;
      const metadata = { name: fileName, mimeType: 'application/json' };
      const boundary = 'maxbackupboundary';
      const body =
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n` +
        `--${boundary}--`;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + gisAccessToken,
          'Content-Type': `multipart/related; boundary="${boundary}"`
        },
        body
      });
      if(!res.ok) throw new Error('upload failed: ' + res.status);
      showToast(t('backup_success'));
    }catch(e){
      console.error('backup failed', e);
      showToast(t('backup_failed'));
    }
  });
}

async function restoreFromDrive(){
  requestDriveToken(async () => {
    try{
      const q = encodeURIComponent(`name contains '${SHOP_NAME}-backup-' and mimeType='application/json' and trashed=false`);
      const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime desc&fields=files(id,name,createdTime)`, {
        headers: { 'Authorization': 'Bearer ' + gisAccessToken }
      });
      const listData = await listRes.json();
      const files = listData.files || [];
      if(files.length===0){ alert(t('no_backups_found')); return; }
      const options = files.map((f,i)=>`${i+1}. ${f.name}`).join('\n');
      const choice = prompt(t('choose_backup_prompt') + '\n' + options, '1');
      const idx = Number(choice)-1;
      if(isNaN(idx) || idx<0 || idx>=files.length) return;
      const fileId = files[idx].id;
      const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { 'Authorization': 'Bearer ' + gisAccessToken }
      });
      const backupData = await fileRes.json();
      if(!confirm(t('confirm_restore'))) return;
      for(const [rid, rec] of Object.entries(backupData.customers||{})){ db.customers[rid]=rec; await safePut('customers', rid, rec); }
      for(const [rid, rec] of Object.entries(backupData.suppliers||{})){ db.suppliers[rid]=rec; await safePut('suppliers', rid, rec); }
      for(const [rid, rec] of Object.entries(backupData.products||{})){ db.products[rid]=rec; await safePut('products', rid, rec); }
      for(const rec of (backupData.purchases||[])) await safePut('purchases', rec.id, rec);
      for(const rec of (backupData.sales||[])) await safePut('sales', rec.id, rec);
      for(const rec of (backupData.expenses||[])) await safePut('expenses', rec.id, rec);
      await loadAll();
      showToast(t('restore_success'));
    }catch(e){
      console.error('restore failed', e);
      showToast(t('restore_failed'));
    }
  });
}

/* ---------- Firestore via plain REST API ----------
   The Firestore SDK uses a long-lived streaming connection (WebChannel) that
   some mobile networks/devices silently block, even though normal HTTPS
   requests (like Firebase Auth) go through fine. To sidestep that entirely,
   all Firestore reads/writes here use plain fetch() calls to the Firestore
   REST API instead of the SDK — the same simple request/response style Auth
   already uses successfully. */
async function firestoreRest(method, path, body){
  const user = currentAuthUser || (firebase.auth && firebase.auth().currentUser);
  if(!user) throw new Error('No authenticated user available for Firestore REST call');
  const token = await user.getIdToken();
  const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/${path}`;
  const res = await fetch(url, {
    method,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    const errText = await res.text().catch(()=>'');
    const err = new Error(`Firestore REST ${method} ${path} failed: ${res.status} ${errText}`);
    err.status = res.status;
    throw err;
  }
  if(res.status===204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function toFirestoreValue(v){
  if(v===null || v===undefined) return {nullValue: null};
  if(typeof v === 'string') return {stringValue: v};
  if(typeof v === 'boolean') return {booleanValue: v};
  if(typeof v === 'number') return Number.isInteger(v) ? {integerValue: String(v)} : {doubleValue: v};
  if(Array.isArray(v)) return {arrayValue: {values: v.map(toFirestoreValue)}};
  if(typeof v === 'object') return {mapValue: {fields: toFirestoreFields(v)}};
  return {stringValue: String(v)};
}
function toFirestoreFields(obj){
  const fields = {};
  for(const [k,val] of Object.entries(obj||{})) fields[k] = toFirestoreValue(val);
  return fields;
}
function fromFirestoreValue(v){
  if(!v) return null;
  if(v.nullValue !== undefined) return null;
  if(v.stringValue !== undefined) return v.stringValue;
  if(v.booleanValue !== undefined) return v.booleanValue;
  if(v.integerValue !== undefined) return Number(v.integerValue);
  if(v.doubleValue !== undefined) return v.doubleValue;
  if(v.arrayValue !== undefined) return (v.arrayValue.values||[]).map(fromFirestoreValue);
  if(v.mapValue !== undefined) return fromFirestoreFields(v.mapValue.fields||{});
  return null;
}
function fromFirestoreFields(fields){
  const obj = {};
  for(const [k,val] of Object.entries(fields||{})) obj[k] = fromFirestoreValue(val);
  return obj;
}

async function storageGet(key){
  if(useFirebase){
    try{
      const data = await withTimeout(firestoreRest('GET', `shopdata/${key}`), 15000);
      return data && data.fields && data.fields.value ? fromFirestoreValue(data.fields.value) : null;
    }catch(e){
      if(e.status===404) return null;
      throw e;
    }
  }
  return localStorage.getItem(key);
}
async function storageSet(key, value){
  if(useFirebase){
    await withTimeout(firestoreRest('PATCH', `shopdata/${key}`, { fields: { value: toFirestoreValue(value) } }), 15000);
  } else {
    localStorage.setItem(key, value);
  }
}

/* Per-record collection storage: each customer/product/sale etc. is its own
   document, so two people saving different records at the same time can
   never silently overwrite each other's data. */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

async function fetchCollection(name){
  if(useFirebase){
    const out = {};
    let pageToken;
    do{
      const qs = pageToken ? `?pageSize=300&pageToken=${encodeURIComponent(pageToken)}` : `?pageSize=300`;
      const data = await withTimeout(firestoreRest('GET', `${name}${qs}`), 15000);
      (data && data.documents || []).forEach(doc => {
        const id = doc.name.split('/').pop();
        out[id] = fromFirestoreFields(doc.fields||{});
      });
      pageToken = data && data.nextPageToken;
    } while(pageToken);
    return out;
  }
  const raw = localStorage.getItem('col_'+name);
  return raw ? JSON.parse(raw) : {};
}
async function putRecord(name, id, data){
  if(useFirebase){
    await withTimeout(firestoreRest('PATCH', `${name}/${id}`, { fields: toFirestoreFields(data) }), 15000);
  } else {
    const raw = localStorage.getItem('col_'+name);
    const obj = raw ? JSON.parse(raw) : {};
    obj[id] = data;
    localStorage.setItem('col_'+name, JSON.stringify(obj));
  }
}
async function removeRecord(name, id){
  if(useFirebase){
    await withTimeout(firestoreRest('DELETE', `${name}/${id}`), 15000);
  } else {
    const raw = localStorage.getItem('col_'+name);
    const obj = raw ? JSON.parse(raw) : {};
    delete obj[id];
    localStorage.setItem('col_'+name, JSON.stringify(obj));
  }
}
async function safePut(name, id, data){
  try{ await putRecord(name, id, data); }
  catch(e){ console.error('save failed', name, id, e); showToast(t('save_failed_toast')); }
}
async function safeRemove(name, id){
  try{ await removeRecord(name, id); }
  catch(e){ console.error('delete failed', name, id, e); showToast(t('save_failed_toast')); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove('show'), 2500);
}

function setupOverlayBackdropClose(overlayId, onClose){
  const el = document.getElementById(overlayId);
  if(!el) return;
  let downOnBackdrop = false;
  el.addEventListener('mousedown', (e) => { downOnBackdrop = (e.target.id===overlayId); });
  el.addEventListener('touchstart', (e) => { downOnBackdrop = (e.target.id===overlayId); }, {passive:true});
  el.addEventListener('click', (e) => {
    if(downOnBackdrop && e.target.id===overlayId){
      el.classList.remove('open');
      if(onClose) onClose();
    }
    downOnBackdrop = false;
  });
}

function saleReturnedQty(saleId){
  return db.returns.filter(r=>r.saleId===saleId && !r.cancelled).reduce((s,r)=>s+Number(r.qty),0);
}
function saleGrossProfit(sale){
  return (Number(sale.unitPrice)-Number(sale.unitCost||0))*Number(sale.qty) - Number(sale.discount||0);
}
function saleReturnedProfitAmount(sale){
  if(!sale || !Number(sale.qty)) return 0;
  const perUnitProfit = saleGrossProfit(sale) / Number(sale.qty);
  return perUnitProfit * saleReturnedQty(sale.id);
}
function saleNetProfit(sale){
  return saleGrossProfit(sale) - saleReturnedProfitAmount(sale);
}
function money(n){ return Number(n||0).toLocaleString('en-US', {maximumFractionDigits:2}); }
function formatDateDMY(dateStr){
  if(!dateStr) return '—';
  const parts = String(dateStr).slice(0,10).split('-');
  if(parts.length!==3) return dateStr;
  const [y,m,d] = parts;
  return `${d}/${m}/${y}`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  if(v==='bank') return 'payment_bank';

  return 'payment_cash';
}

  for(const key of [...objTabs, ...arrTabs]){

/* ---------- Dashboard ---------- */
function computeTotalBalance(){
  const fromStr = SUMMARY_START_DATE;
  const toStr = todayStr();
  const inRange = (dateStr) => dateStr>=fromStr && dateStr<=toStr;
  let dp = 0, de = 0;
  db.sales.forEach(s => { if(inRange(s.date) && !s.isOldEntry) dp += Number(s.initialPaid!==undefined ? s.initialPaid : s.paid); });
  db.installments.forEach(i => { if(inRange(i.date) && !i.isOldEntry) dp += Number(i.amount)+Number(i.discount||0); });
  db.expenses.forEach(e => { if(inRange(e.date) && !e.isOldEntry) de += Number(e.amount); });
  db.returns.forEach(r => { if(!r.cancelled && inRange(r.date)) de += Number(r.excessRefund||0); });
  return dp - de;
}

let reportsSubTab = 'overview';

let reportsSuppQuery = '';

let overviewRange = 'last14';
let overviewFrom = '';

function pad2(n){ return String(n).padStart(2,'0'); }
function toISODate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function getEarliestDate(){
  const allDates = [...db.sales, ...db.purchases, ...db.expenses].map(x=>x.date).filter(Boolean).sort();
  return allDates.length ? allDates[0] : todayStr();
}

function resolveRange(rangeKey, customFrom, customTo){
  const today = new Date();
  let from, to;
  if(rangeKey==='last14'){
    to = new Date(today); from = new Date(today); from.setDate(from.getDate()-13);
  } else if(rangeKey==='thisMonth'){
    from = new Date(today.getFullYear(), today.getMonth(), 1); to = today;
  } else if(rangeKey==='thisYear'){
    from = new Date(today.getFullYear(), 0, 1); to = today;
  } else if(rangeKey==='allTime'){
    from = new Date(getEarliestDate()); to = today;
  } else {
    from = customFrom ? new Date(customFrom) : new Date(today);
    to = customTo ? new Date(customTo) : new Date(today);
  }
  return { fromStr: toISODate(from), toStr: toISODate(to) };
}

function aggregatePeriod(fromStr, toStr){
  const from = new Date(fromStr), to = new Date(toStr);
  const spanDays = Math.max(1, Math.round((to-from)/(24*3600*1000))+1);
  const groupByMonth = spanDays > 31;
  const buckets = {};
  if(!groupByMonth){
    for(let d=new Date(from); d<=to; d.setDate(d.getDate()+1)){
      buckets[toISODate(d)] = {s:0,p:0,e:0};
    }
  } else {
    let d = new Date(from.getFullYear(), from.getMonth(), 1);
    const last = new Date(to.getFullYear(), to.getMonth(), 1);
    while(d<=last){
      buckets[`${d.getFullYear()}-${pad2(d.getMonth()+1)}`] = {s:0,p:0,e:0};
      d.setMonth(d.getMonth()+1);
    }
  }
  const bucketKey = (dateStr) => groupByMonth ? dateStr.slice(0,7) : dateStr;
  const inRange = (dateStr) => dateStr >= fromStr && dateStr <= toStr;
  db.sales.forEach(x => { if(inRange(x.date)){ const k=bucketKey(x.date); if(buckets[k]) buckets[k].s += Number(x.total); } });
  db.purchases.forEach(x => { if(inRange(x.date)){ const k=bucketKey(x.date); if(buckets[k]) buckets[k].p += Number(x.total); } });
  db.expenses.forEach(x => { if(inRange(x.date)){ const k=bucketKey(x.date); if(buckets[k]) buckets[k].e += Number(x.amount); } });
  const rows = Object.entries(buckets).map(([k,v]) => ({ d:k, s:v.s, p:v.p, e:v.e, net:v.s-v.p-v.e })).sort((a,b)=>b.d.localeCompare(a.d));
  const totals = rows.reduce((a,r)=>({s:a.s+r.s,p:a.p+r.p,e:a.e+r.e,net:a.net+r.net}), {s:0,p:0,e:0,net:0});
  return { rows, totals, groupByMonth };
}

function getAvailableYears(){
  const dates = [...db.sales, ...db.purchases].map(x=>x.date).filter(Boolean);
  const years = [...new Set(dates.map(d=>d.slice(0,4)))].sort((a,b)=>b.localeCompare(a));
  return years;
}
function monthName(m){
  try{
    return new Date(2000, m-1, 1).toLocaleString(currentLang==='bn' ? 'bn-BD' : 'en-US', {month:'long'});
  }catch(e){ return String(m); }
}
function matchesYearMonth(dateStr, year, month){
  if(!dateStr) return false;
  if(year!=='all' && dateStr.slice(0,4)!==year) return false;
  if(month!=='all' && Number(dateStr.slice(5,7))!==Number(month)) return false;
  return true;
}

let instPageQuery = '';

function renderInstallmentsPage(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="toolbar">
      <input type="text" id="instPageSearch" placeholder="${t('search_placeholder')}" value="${escapeHtml(instPageQuery)}">
    </div>
    <div id="instPageList"></div>
  `;
  document.getElementById('instPageSearch').addEventListener('input', (e) => {
    instPageQuery = e.target.value;
    pageNum['installments'] = 1;
    renderInstList();
  });

  function renderInstList(){
    const q = instPageQuery.trim().toLowerCase();
    const historyIds = new Set(db.installments.map(i=>i.customerId));
    const planIds = new Set(db.installmentPlans.map(p=>p.customerId));
    function accountNumbersFor(custId){
      return [...new Set(db.sales.filter(s=>s.customerId===custId && s.voucherNo).map(s=>s.voucherNo))];
    }
    const entries = Object.entries(db.customers).filter(([id,cust]) => {
      if(!(Number(cust.due)>0 || historyIds.has(id) || planIds.has(id))) return false;
      if(!q) return true;
      if(cust.name.toLowerCase().includes(q)) return true;
      if(String(cust.displayId||'').includes(q)) return true;
      if(cust.phone && cust.phone.toLowerCase().includes(q)) return true;
      if(accountNumbersFor(id).some(v=>v.toLowerCase().includes(q))) return true;
      return false;
    });
    const listEl = document.getElementById('instPageList');
    if(entries.length===0){
      listEl.innerHTML = `<div class="empty"><div class="big">${t('no_active_installments')}</div></div>`;
      return;
    }
    const totalPages = Math.max(1, Math.ceil(entries.length/PAGE_SIZE));

let summaryRange = 'last14';
let summaryFrom = '';
let summaryTo = '';

function renderSummaryReport(body){
  body.innerHTML = `
    <div class="toolbar no-print">
      <select id="summaryRangeSelect">
        <option value="last14">${t('range_last14')}</option>
        <option value="thisMonth">${t('range_this_month')}</option>
        <option value="thisYear">${t('range_this_year')}</option>
        <option value="allTime">${t('range_all_time')}</option>
        <option value="custom">${t('range_custom')}</option>
      </select>
      <input type="date" id="summaryFromDate" min="${SUMMARY_START_DATE}" style="display:none;">
      <input type="date" id="summaryToDate" style="display:none;">
      <button class="btn ghost" id="summaryPrintBtn" style="margin-left:auto;">${t('print_report')}</button>
    </div>
    <div id="summaryBody"></div>
  `;
  const rangeSelect = document.getElementById('summaryRangeSelect');
  const fromInput = document.getElementById('summaryFromDate');
  const toInput = document.getElementById('summaryToDate');
  rangeSelect.value = summaryRange;
  fromInput.value = summaryFrom || SUMMARY_START_DATE;
  toInput.value = summaryTo || todayStr();
  fromInput.style.display = summaryRange==='custom' ? '' : 'none';
  toInput.style.display = summaryRange==='custom' ? '' : 'none';

  function refresh(){
    let { fromStr, toStr } = resolveRange(summaryRange, summaryFrom || fromInput.value, summaryTo || toInput.value);
    if(fromStr < SUMMARY_START_DATE) fromStr = SUMMARY_START_DATE;
    if(toStr < fromStr) toStr = fromStr;
    const from = new Date(fromStr), to = new Date(toStr);
    const buckets = {};
    for(let d=new Date(from); d<=to; d.setDate(d.getDate()+1)) buckets[toISODate(d)] = {dp:0, de:0};
    const bucketKey = (dateStr) => dateStr;
    const inRange = (dateStr) => dateStr>=fromStr && dateStr<=toStr;
    db.sales.forEach(s => { if(inRange(s.date) && !s.isOldEntry){ const k=bucketKey(s.date); if(buckets[k]) buckets[k].dp += Number(s.initialPaid!==undefined ? s.initialPaid : s.paid); } });
    db.installments.forEach(i => { if(inRange(i.date) && !i.isOldEntry){ const k=bucketKey(i.date); if(buckets[k]) buckets[k].dp += Number(i.amount)+Number(i.discount||0); } });
    db.expenses.forEach(e => { if(inRange(e.date) && !e.isOldEntry){ const k=bucketKey(e.date); if(buckets[k]) buckets[k].de += Number(e.amount); } });
    db.returns.forEach(r => { if(!r.cancelled && inRange(r.date)){ const k=bucketKey(r.date); if(buckets[k]) buckets[k].de += Number(r.excessRefund||0); } });
    let running = 0;
    const rows = Object.entries(buckets).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v]) => {
      running += v.dp - v.de;
      return { d:k, dp:v.dp, de:v.de, s:running };
    });
    const periodColLabel = t('col_date');
    const finalSummary = rows.length ? rows[rows.length-1].s : 0;
    document.getElementById('summaryBody').innerHTML = `
      <div class="stat-grid no-print" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px;">
        <div class="stat-card c4"><div class="val">৳${money(rows.reduce((s,r)=>s+r.dp,0))}</div><div class="lbl">${t('summary_dp')} (${t('totals_label')})</div></div>
        <div class="stat-card c7"><div class="val">৳${money(rows.reduce((s,r)=>s+r.de,0))}</div><div class="lbl">${t('summary_de')} (${t('totals_label')})</div></div>
        <div class="stat-card c8"><div class="val">৳${money(finalSummary)}</div><div class="lbl">${t('summary_final')}</div></div>
      </div>
      <div class="panel">
        <h3>${t('reports_summary_tab')}</h3>
        <table class="data">
          <thead><tr><th>${periodColLabel}</th><th>${t('summary_dp')}</th><th>${t('summary_de')}</th><th>${t('summary_s')}</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${formatDateDMY(r.d)}</td><td>৳${money(r.dp)}</td><td>৳${money(r.de)}</td><td style="font-weight:700;">৳${money(r.s)}</td></tr>`).join('')}
          </tbody>
          <tfoot>
            <tr style="font-weight:700;"><td>${t('totals_label')}</td><td>৳${money(rows.reduce((s,r)=>s+r.dp,0))}</td><td>৳${money(rows.reduce((s,r)=>s+r.de,0))}</td><td>৳${money(finalSummary)}</td></tr>
          </tfoot>
        </table>
      </div>
    `;
  }

  rangeSelect.addEventListener('change', () => {
    summaryRange = rangeSelect.value;
    fromInput.style.display = summaryRange==='custom' ? '' : 'none';
    toInput.style.display = summaryRange==='custom' ? '' : 'none';
    if(summaryRange==='custom'){ summaryFrom = fromInput.value; summaryTo = toInput.value; }
    refresh();
  });
  fromInput.addEventListener('change', () => { summaryFrom = fromInput.value; refresh(); });
  toInput.addEventListener('change', () => { summaryTo = toInput.value; refresh(); });
  document.getElementById('summaryPrintBtn').addEventListener('click', () => window.print());
  refresh();
}

function buildRangeToolbar(prefix, state){
  return `
    <div class="toolbar no-print">
      <select id="${prefix}RangeSelect">
        <option value="last14">${t('range_last14')}</option>
        <option value="thisMonth">${t('range_this_month')}</option>
        <option value="thisYear">${t('range_this_year')}</option>
        <option value="allTime">${t('range_all_time')}</option>
        <option value="custom">${t('range_custom')}</option>
      </select>
      <input type="date" id="${prefix}FromDate" style="display:none;">
      <input type="date" id="${prefix}ToDate" style="display:none;">
      <button class="btn ghost" id="${prefix}PrintBtn" style="margin-left:auto;">${t('print_report')}</button>
    </div>
    <div id="${prefix}Body"></div>
  `;
}
function wireRangeToolbar(prefix, getState, setState, refresh){
  const rangeSelect = document.getElementById(`${prefix}RangeSelect`);
  const fromInput = document.getElementById(`${prefix}FromDate`);
  const toInput = document.getElementById(`${prefix}ToDate`);
  const st = getState();
  rangeSelect.value = st.range;
  fromInput.value = st.from || getEarliestDate();
  toInput.value = st.to || todayStr();
  fromInput.style.display = st.range==='custom' ? '' : 'none';
  toInput.style.display = st.range==='custom' ? '' : 'none';
  rangeSelect.addEventListener('change', () => {
    const s = getState(); s.range = rangeSelect.value;
    fromInput.style.display = s.range==='custom' ? '' : 'none';
    toInput.style.display = s.range==='custom' ? '' : 'none';
    if(s.range==='custom'){ s.from = fromInput.value; s.to = toInput.value; }
    setState(s); refresh();
  });
  fromInput.addEventListener('change', () => { const s=getState(); s.from=fromInput.value; setState(s); refresh(); });
  toInput.addEventListener('change', () => { const s=getState(); s.to=toInput.value; setState(s); refresh(); });
  document.getElementById(`${prefix}PrintBtn`).addEventListener('click', () => window.print());
}

const REPORT_PAGE_SIZE = 50;
function renderReportTableWithPagination(prefix, rows, theadHtml, rowFn, footHtml){
  const totalPages = Math.max(1, Math.ceil(rows.length/REPORT_PAGE_SIZE));
  if(!pageNum[prefix] || pageNum[prefix]>totalPages) pageNum[prefix] = 1;
  const cur = pageNum[prefix];
  const pageRows = rows.slice((cur-1)*REPORT_PAGE_SIZE, cur*REPORT_PAGE_SIZE);
  return `
    <div class="report-screen-table">
      <table class="data">
        <thead>${theadHtml}</thead>
        <tbody>${pageRows.map(rowFn).join('')}</tbody>
        ${footHtml||''}
      </table>
      ${renderPaginationHtml(cur, totalPages, rows.length)}
    </div>
    <div class="report-print-table">
      <table class="data">
        <thead>${theadHtml}</thead>
        <tbody>${rows.map(rowFn).join('')}</tbody>
        ${footHtml||''}
      </table>
    </div>
  `;
}

  const rangeSelect = document.getElementById('ovRangeSelect');

        <div class="stat-card c6"><div class="val">৳${money(totals.p)}</div><div class="lbl">${t('rep_col_purchase')} (${t('totals_label')})</div></div>
        <div class="stat-card c7"><div class="val">৳${money(totals.e)}</div><div class="lbl">${t('rep_col_expense')} (${t('totals_label')})</div></div>
        <div class="stat-card c8"><div class="val">৳${money(totals.net)}</div><div class="lbl">${t('rep_col_net')} (${t('totals_label')})</div></div>
      </div>
      <div class="panel">
        <h3>${t('reports_summary')}</h3>
        <table class="data">
          <thead><tr><th>${periodColLabel}</th><th>${t('rep_col_sales')}</th><th>${t('rep_col_purchase')}</th><th>${t('rep_col_expense')}</th><th>${t('rep_col_net')}</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${r.d}</td><td>৳${money(r.s)}</td><td>৳${money(r.p)}</td><td>৳${money(r.e)}</td><td>৳${money(r.net)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="panel">
        <h3>${t('reports_trend')}</h3>
        ${rows.slice().reverse().map(r => `
          <div class="rbar-row">
            <div>${groupByMonth ? r.d : r.d.slice(5)}</div>
            <div class="rbar-track"><div class="rbar-fill" style="width:${(r.s/maxVal*100).toFixed(0)}%"></div></div>
            <div style="text-align:right;">৳${money(r.s)}</div>
          </div>`).join('')}
      </div>
    `;
  }

  rangeSelect.addEventListener('change', () => {
    overviewRange = rangeSelect.value;
    fromInput.style.display = overviewRange==='custom' ? '' : 'none';
    toInput.style.display = overviewRange==='custom' ? '' : 'none';
    if(overviewRange==='custom'){ overviewFrom = fromInput.value; overviewTo = toInput.value; }
    refresh();
  });
  fromInput.addEventListener('change', () => { overviewFrom = fromInput.value; refresh(); });
  toInput.addEventListener('change', () => { overviewTo = toInput.value; refresh(); });
  document.getElementById('printReportBtn').addEventListener('click', () => window.print());
  refresh();
}

function groupSalesForDisplay(rawItems){
  // rawItems: [id, saleRecord][] — merge records sharing the same invoiceId into one display row
  const seen = new Set();
  const out = [];
  rawItems.forEach(([id, item]) => {
    if(seen.has(id)) return;
    if(!item.invoiceId){
      out.push([id, item]);
      return;
    }
    const group = rawItems.filter(([,x]) => x.invoiceId===item.invoiceId);
    group.forEach(([gid]) => seen.add(gid));
    const names = group.map(([,x]) => x.productName).join(', ');
    const merged = {
      ...item,
      productName: names,
      qty: t('items_count')(group.length),
      total: group.reduce((s,[,x])=>s+Number(x.total),0),
      discount: group.reduce((s,[,x])=>s+Number(x.discount||0),0),
      paid: group.reduce((s,[,x])=>s+Number(x.paid),0),
      due: group.reduce((s,[,x])=>s+Number(x.due),0),
      _groupIds: group.map(([gid])=>gid),
    };
    out.push([id, merged]);
  });
  return out;
}

let pageNum = {};
const PAGE_SIZE = 20;

function renderTable(tab, items, search){
  const cfg = CONFIG[tab];
  let filtered = items;
  if(search){
    filtered = items.filter(([id,item]) => JSON.stringify(item).toLowerCase().includes(search));
  }
  const wrap = document.getElementById('pgTableWrap');
  if(filtered.length===0){
    wrap.innerHTML = `<div class="empty"><div class="big">${t('no_data')}</div>${t('no_data_hint')}</div>`;
    return;
  }
  const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  if(!pageNum[tab] || pageNum[tab]>totalPages) pageNum[tab] = 1;
  const cur = pageNum[tab];
  const pageItems = filtered.slice((cur-1)*PAGE_SIZE, cur*PAGE_SIZE);
  wrap.innerHTML = `
    <table class="data">
      <thead><tr>${cfg.columns.map(c=>`<th>${t(c.hKey)}</th>`).join('')}<th></th></tr></thead>
      <tbody>
        ${pageItems.map(([id,item]) => {
          const isLow = cfg.isLow && cfg.isLow(item);
          const isGroup = !!item._groupIds;
          return `<tr class="${isLow?'low':''}">
            ${cfg.columns.map(c => `<td>${c.fmt ? c.fmt(item[c.k], item) : escapeHtml(item[c.k]==null?'—':item[c.k])}</td>`).join('')}
            <td class="actions-cell">
              ${cfg.extraRowActions ? cfg.extraRowActions(id,item) : ''}
              ${!cfg.noEdit ? `<button class="icon-btn" title="${t('edit_title')}" onclick="${isGroup ? `openMultiSale('${item.invoiceId}')` : `openForm('${tab}','${id}')`}">✏️</button>` : ''}
              <button class="icon-btn" title="${t('delete_title')}" onclick="${isGroup ? `deleteInvoiceGroup('${id}')` : `deleteItem('${tab}','${id}')`}">🗑️</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    ${renderPaginationHtml(cur, totalPages, filtered.length)}
  `;
  wirePaginationEvents(tab, () => renderTable(tab, items, search));
}

function renderPaginationHtml(cur, totalPages, totalCount){
  if(totalPages<=1) return '';
  const start = (cur-1)*PAGE_SIZE + 1;
  const end = Math.min(cur*PAGE_SIZE, totalCount);
  return `
    <div class="pagination-row no-print">
      <span class="pagination-info">${t('pagination_showing')(start, end, totalCount)}</span>
      <div class="pagination-btns">
        <button class="btn ghost small" id="pgPrevBtn" ${cur<=1?'disabled':''}>‹ ${t('pagination_prev')}</button>
        <span class="pagination-page">${cur} / ${totalPages}</span>
        <button class="btn ghost small" id="pgNextBtn" ${cur>=totalPages?'disabled':''}>${t('pagination_next')} ›</button>
      </div>
    </div>
  `;
}
function wirePaginationEvents(tab, rerender){
  const prevBtn = document.getElementById('pgPrevBtn');
  const nextBtn = document.getElementById('pgNextBtn');
  if(prevBtn) prevBtn.addEventListener('click', () => { pageNum[tab] = Math.max(1, (pageNum[tab]||1)-1); rerender(); });
  if(nextBtn) nextBtn.addEventListener('click', () => { pageNum[tab] = (pageNum[tab]||1)+1; rerender(); });
}

      const selectHtml = `<select data-key="${f.key}">

      </div>`;
    }
    return `<div class="field"><label>${t(f.labelKey)}</label><input type="${f.type}" data-key="${f.key}" value="${escapeHtml(val)}"></div>`;

document.getElementById('formSaveBtn').addEventListener('click', async () => {

async function handleSave(tab, id, values){
  if(tab==='customers' || tab==='suppliers' || tab==='categories'){
    const key = id || uid();
    const existing = db[tab][key] || {};
    const record = {...existing, ...values};
    if(tab==='customers' || tab==='suppliers') record.due = existing.due || 0;
    if(tab==='customers' && !id && !record.displayId){
      record.displayId = nextCustomerDisplayId();
    }
    db[tab][key] = record;
    await safePut(tab, key, record);
  }
  else if(tab==='products'){
    const key = id || uid();
    const record = {...(db.products[key]||{}), ...values};
    db.products[key] = record;
    await safePut('products', key, record);
  }
  else if(tab==='purchases'){
    const supplier = db.suppliers[values.supplierId];
    const product = db.products[values.productId];
    if(!product){ alert(t('product_not_found')); return; }
    const total = Number(values.qty) * Number(values.unitCost);
    product.qty = Number(product.qty) + Number(values.qty);
    product.cost = Number(values.unitCost);
    const record = {
      id: uid(), supplierId: values.supplierId, supplierName: supplier?supplier.name:'—',
      productId: values.productId, productName: product.name,
      qty: Number(values.qty), unitCost: Number(values.unitCost), total, date: values.date, ts: Date.now()
    };
    db.purchases.push(record);
    await safePut('products', values.productId, product);
    await safePut('purchases', record.id, record);
  }
  else if(tab==='sales'){
    let existing = null;
    const touchedCustomers = new Set();
    const touchedProducts = new Set();
    if(id){
      existing = db.sales.find(x=>x.id===id);
      if(existing){
        // reverse previous effects before applying the edited values
        const prevProduct = db.products[existing.productId];
        if(prevProduct){ prevProduct.qty = Number(prevProduct.qty) + Number(existing.qty); touchedProducts.add(existing.productId); }
        if(existing.customerId && db.customers[existing.customerId]){
          db.customers[existing.customerId].due = Math.max(0, Number(db.customers[existing.customerId].due||0) - Number(existing.due||0));
          touchedCustomers.add(existing.customerId);
        }
      }
    }
    const product = db.products[values.productId];
    if(!product){ alert(t('product_not_found')); return; }
    if(Number(values.qty) > Number(product.qty)){
      if(!confirm(t('low_stock_more'))) return;
    }
    const rawTotal = Number(values.qty) * Number(values.unitPrice);
    const discount = Number(values.discount)||0;
    const total = Math.max(0, rawTotal - discount);
    const paid = values.paid===''||values.paid===undefined ? total : Number(values.paid);
    const due = Math.max(0, total - paid);
    product.qty = Math.max(0, Number(product.qty) - Number(values.qty));
    touchedProducts.add(values.productId);
    let customerName = '';
    if(values.customerId){
      const cust = db.customers[values.customerId];
      if(cust){ customerName = cust.name; cust.due = Number(cust.due||0) + due; touchedCustomers.add(values.customerId); }
    }
    const record = {
      id: id || uid(), invoiceId: existing ? existing.invoiceId : null,
      invoiceNo: existing ? (existing.invoiceNo || nextInvoiceNo()) : nextInvoiceNo(),
      voucherNo: existing ? existing.voucherNo : '', voucherTag: existing ? existing.voucherTag : '',
      paymentSystem: existing ? existing.paymentSystem : 'cash', isOldEntry: existing ? existing.isOldEntry : false,
      customerId: values.customerId||null, customerName,
      productId: values.productId, productName: product.name,
      qty: Number(values.qty), unitPrice: Number(values.unitPrice), unitCost: Number(product.cost||0), discount,
      total, paid, due, initialPaid: existing ? (existing.initialPaid!==undefined ? existing.initialPaid : paid) : paid,
      date: values.date, ts: existing ? existing.ts : Date.now()
    };
    if(existing){
      const idx = db.sales.findIndex(x=>x.id===id);
      db.sales[idx] = record;
    } else {
      db.sales.push(record);
    }
    for(const pid of touchedProducts) await safePut('products', pid, db.products[pid]);
    await safePut('sales', record.id, record);
    for(const cid of touchedCustomers) await safePut('customers', cid, db.customers[cid]);

    const instCount = Number(values.installmentCount)||0;
    if(!existing && due>0 && instCount>=2){
      const perAmount = Math.floor(due / instCount);
      const items = [];
      for(let i=0;i<instCount;i++){
        const amt = (i===instCount-1) ? (due - perAmount*(instCount-1)) : perAmount;
        items.push({ idx: i+1, amount: amt, status:'pending', paidDate:null });
      }
      const plan = {
        id: uid(), saleId: record.id, customerId: values.customerId||null, customerName,
        productName: product.name, totalDue: due, count: instCount, perAmount,
        items, createdDate: values.date, ts: Date.now()
      };
      db.installmentPlans.push(plan);
      await safePut('installmentPlans', plan.id, plan);
    }
    else if(existing){
      // if this sale already has an installment plan, keep it in sync with any due change
      // (e.g. adding/increasing a discount on edit) by adjusting the last pending installment
      const plan = db.installmentPlans.find(p=>p.saleId===record.id);
      if(plan){
        const deltaDue = due - Number(existing.due||0);
        if(deltaDue !== 0){
          for(let i=plan.items.length-1;i>=0;i--){
            if(plan.items[i].status==='pending'){
              plan.items[i].amount = Math.max(0, Number(plan.items[i].amount) + deltaDue);
              break;
            }
          }
          plan.totalDue = Math.max(0, Number(plan.totalDue) + deltaDue);
          plan.customerName = customerName || plan.customerName;
          await safePut('installmentPlans', plan.id, plan);
        }
      }
    }
  }
  else if(tab==='expenses'){
    const record = { id: uid(), category: values.category, amount: Number(values.amount), note: values.note, date: values.date, isOldEntry: !!values.isOldEntry, ts: Date.now() };
    db.expenses.push(record);
    await safePut('expenses', record.id, record);
  }
}

async function deleteInvoiceGroup(repId){
  const rep = db.sales.find(s=>s.id===repId);
  if(!rep) return;
  if(!confirm(t('confirm_delete'))) return;
  const groupIds = db.sales.filter(s=>s.invoiceId===rep.invoiceId).map(s=>s.id);
  for(const gid of groupIds){
    db.sales = db.sales.filter(s=>s.id!==gid);
    await safeRemove('sales', gid);
  }
  const plan = db.installmentPlans.find(p=>p.invoiceId===rep.invoiceId);
  if(plan){
    db.installmentPlans = db.installmentPlans.filter(p=>p.id!==plan.id);
    await safeRemove('installmentPlans', plan.id);
  }
  renderNav(); renderPage();
}

async function deleteItem(tab, id){
  if(!confirm(t('confirm_delete'))) return;
  const cfg = CONFIG[tab];
  if(cfg.isObj) delete db[tab][id];
  else db[tab] = db[tab].filter(x=>x.id!==id);
  await safeRemove(tab, id);
  renderNav(); renderPage();
}

  } else {
    let selectEl = document.getElementById(fieldKey);
    if(!selectEl || selectEl.tagName!=='SELECT'){
      selectEl = document.querySelector(`#formFields select[data-key="${fieldKey}"]`);
    }
    if(selectEl){
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = name;
      selectEl.appendChild(opt);
      selectEl.value = key;
      selectEl.dispatchEvent(new Event('change'));
    }
  }
  renderNav();
});

async function markInstallmentPaid(planId, idx){
  const plan = db.installmentPlans.find(p=>p.id===planId);
  if(!plan) return;
  const item = plan.items.find(it=>it.idx===idx);
  if(!item || item.status==='paid') return;
  item.status = 'paid';
  item.paidDate = todayStr();
  await safePut('installmentPlans', plan.id, plan);

  // keep the sale record(s) own paid/due fields in sync with installment payments.
  // for multi-product invoices, distribute this installment amount across all
  // line items proportionally to their remaining due.
  const groupSales = plan.invoiceId
    ? db.sales.filter(s=>s.invoiceId===plan.invoiceId)
    : db.sales.filter(s=>s.id===plan.saleId);
  const groupDueTotal = groupSales.reduce((s,x)=>s+Number(x.due||0),0);
  let remainingToApply = Number(item.amount);
  groupSales.forEach((sale, i) => {
    const isLast = i===groupSales.length-1;
    const share = groupDueTotal>0 ? Number(sale.due||0)/groupDueTotal : (isLast?1:0);
    const applyAmt = isLast ? remainingToApply : Math.min(Number(sale.due||0), Math.round(Number(item.amount)*share));
    remainingToApply -= applyAmt;
    sale.paid = Number(sale.paid||0) + applyAmt;
    sale.due = Math.max(0, Number(sale.due||0) - applyAmt);
  });
  for(const sale of groupSales) await safePut('sales', sale.id, sale);

  if(plan.customerId && db.customers[plan.customerId]){
    const cust = db.customers[plan.customerId];
    const previousDue = Number(cust.due);
    cust.due = Math.max(0, previousDue - Number(item.amount));
    await safePut('customers', plan.customerId, cust);
    const instRecord = {
      id: uid(), receiptNo: nextReceiptNo(), customerId: plan.customerId, customerName: plan.customerName,
      amount: Number(item.amount), discount: 0, previousDue, newDue: cust.due,
      date: todayStr(), ts: Date.now(), planId: plan.id, installmentNo: idx
    };
    db.installments.push(instRecord);
    await safePut('installments', instRecord.id, instRecord);
    openInstallmentReceipt(instRecord);
  }
  renderPage();
  // refresh whichever view is currently showing this plan
  if(document.getElementById('saleViewOverlay').classList.contains('open')) openSaleView(plan.saleId);
  if(document.getElementById('instHistoryOverlay').classList.contains('open') && plan.customerId) openInstallmentHistory(plan.customerId);
  if(currentTab==='installments') renderInstallmentsPage();
}

function invoiceDueTotal(sale){
  const group = sale.invoiceId ? db.sales.filter(s=>s.invoiceId===sale.invoiceId) : [sale];
  return group.reduce((s,x)=>s+Number(x.due),0);
}
function updateReturnCalcInfo(){
  if(!returnCtx) return;
  const sale = db.sales.find(s=>s.id===returnCtx);
  if(!sale) return;
  const qty = Number(document.getElementById('returnQtyInput').value)||0;
  const perUnitValue = Number(sale.qty)>0 ? Number(sale.total)/Number(sale.qty) : 0;
  const returnValue = qty*perUnitValue;
  const dueAdjust = Math.min(returnValue, invoiceDueTotal(sale));
  const excessRefund = Math.max(0, returnValue - dueAdjust);
  document.getElementById('returnCalcInfo').innerHTML = `
    ${t('return_value')}: ৳${money(returnValue)}<br>
    ${t('return_due_adjust')}: ৳${money(dueAdjust)}<br>
    ${t('return_excess_refund')}: ৳${money(excessRefund)}
  `;
}

});

document.getElementById('returnConfirmBtn').addEventListener('click', async () => {
  if(!returnCtx) return;
  const sale = db.sales.find(s=>s.id===returnCtx);
  if(!sale) return;
  const qty = Number(document.getElementById('returnQtyInput').value)||0;
  const alreadyReturned = saleReturnedQty(returnCtx);
  const remaining = Number(sale.qty) - alreadyReturned;
  if(qty<=0 || qty>remaining){ alert(t('return_qty_invalid')); return; }
  const date = document.getElementById('returnDateInput').value || todayStr();
  const note = document.getElementById('returnNoteInput').value.trim();

  const perUnitValue = Number(sale.qty)>0 ? Number(sale.total)/Number(sale.qty) : 0;
  const returnValue = qty*perUnitValue;
  const groupSales = sale.invoiceId ? db.sales.filter(s=>s.invoiceId===sale.invoiceId) : [sale];
  const invoiceDue = groupSales.reduce((s,x)=>s+Number(x.due),0);
  const dueAdjust = Math.min(returnValue, invoiceDue);
  const excessRefund = Math.max(0, returnValue - dueAdjust);

  const product = db.products[sale.productId];
  if(product){ product.qty = Number(product.qty) + qty; await safePut('products', sale.productId, product); }

  // distribute the due reduction across the invoice: the returned line first, then other lines
  let remainingAdjust = dueAdjust;
  const adjustments = [];
  const ownReduce = Math.min(Number(sale.due), remainingAdjust);
  if(ownReduce>0){ sale.due = Number(sale.due) - ownReduce; remainingAdjust -= ownReduce; adjustments.push({saleId: sale.id, amount: ownReduce}); }
  await safePut('sales', sale.id, sale);
  for(const otherSale of groupSales){
    if(remainingAdjust<=0) break;
    if(otherSale.id===sale.id) continue;
    const reduce = Math.min(Number(otherSale.due), remainingAdjust);
    if(reduce>0){
      otherSale.due = Number(otherSale.due) - reduce;
      remainingAdjust -= reduce;
      adjustments.push({saleId: otherSale.id, amount: reduce});
      await safePut('sales', otherSale.id, otherSale);
    }
  }

  if(sale.customerId && db.customers[sale.customerId]){
    const cust = db.customers[sale.customerId];
    cust.due = Math.max(0, Number(cust.due) - dueAdjust);
    cust.refundOwed = Number(cust.refundOwed||0) + excessRefund;
    await safePut('customers', sale.customerId, cust);
  }

  const record = {
    id: uid(), returnNo: nextReturnNo(), saleId: sale.id, invoiceId: sale.invoiceId||null,
    productId: sale.productId, productName: sale.productName,
    customerId: sale.customerId||null, customerName: sale.customerName||'',
    qty, unitValue: perUnitValue, value: returnValue, dueAdjust, excessRefund, adjustments,
    date, note, cancelled:false, ts: Date.now()
  };
  db.returns.push(record);
  await safePut('returns', record.id, record);

  document.getElementById('returnOverlay').classList.remove('open');
  returnCtx = null;
  renderNav();
  renderPage();
  if(document.getElementById('saleViewOverlay').classList.contains('open')) openSaleView(sale.id);
});

async function cancelReturn(returnId){
  const rec = db.returns.find(r=>r.id===returnId);
  if(!rec || rec.cancelled) return;
  if(!confirm(t('return_confirm_cancel'))) return;
  rec.cancelled = true;
  await safePut('returns', rec.id, rec);

  const product = db.products[rec.productId];
  if(product){ product.qty = Math.max(0, Number(product.qty) - rec.qty); await safePut('products', rec.productId, product); }

  const adjustments = rec.adjustments && rec.adjustments.length ? rec.adjustments : [{saleId: rec.saleId, amount: rec.dueAdjust}];
  for(const adj of adjustments){
    const s = db.sales.find(x=>x.id===adj.saleId);
    if(s){ s.due = Number(s.due) + Number(adj.amount); await safePut('sales', s.id, s); }
  }
  const sale = db.sales.find(s=>s.id===rec.saleId);
  if(sale && sale.customerId && db.customers[sale.customerId]){
    const cust = db.customers[sale.customerId];
    cust.due = Number(cust.due) + Number(rec.dueAdjust);
    cust.refundOwed = Math.max(0, Number(cust.refundOwed||0) - Number(rec.excessRefund));
    await safePut('customers', sale.customerId, cust);
  }
  renderNav();
  renderPage();
  if(document.getElementById('saleViewOverlay').classList.contains('open') && sale) openSaleView(sale.id);
}

async function deleteReturn(returnId){
  const rec = db.returns.find(r=>r.id===returnId);
  if(!rec) return;
  if(!confirm(t('confirm_delete'))) return;

  if(!rec.cancelled){
    // still active — reverse its stock/due effects first, same as cancelling
    const product = db.products[rec.productId];
    if(product){ product.qty = Math.max(0, Number(product.qty) - rec.qty); await safePut('products', rec.productId, product); }

    const adjustments = rec.adjustments && rec.adjustments.length ? rec.adjustments : [{saleId: rec.saleId, amount: rec.dueAdjust}];
    for(const adj of adjustments){
      const s = db.sales.find(x=>x.id===adj.saleId);
      if(s){ s.due = Number(s.due) + Number(adj.amount); await safePut('sales', s.id, s); }
    }
    const sale = db.sales.find(s=>s.id===rec.saleId);
    if(sale && sale.customerId && db.customers[sale.customerId]){
      const cust = db.customers[sale.customerId];
      cust.due = Number(cust.due) + Number(rec.dueAdjust);
      cust.refundOwed = Math.max(0, Number(cust.refundOwed||0) - Number(rec.excessRefund));
      await safePut('customers', sale.customerId, cust);
    }
  }

  db.returns = db.returns.filter(r=>r.id!==returnId);
  await safeRemove('returns', returnId);
  renderNav();
  renderPage();
  if(document.getElementById('saleViewOverlay').classList.contains('open')){
    const sale = db.sales.find(s=>s.id===rec.saleId);
    if(sale) openSaleView(sale.id);
  }
}

        msEditInvoiceId = null;
      } else {
        const first = groupSales[0];

        selectMsCustomer(first.customerId || '');

        document.getElementById('msVoucher').value = first.voucherNo || '';
        document.getElementById('msVoucherTag').value = first.voucherTag || '';
        document.getElementById('msPaymentSystem').value = first.paymentSystem || 'cash';

        document.getElementById('msPaid').value = groupSales.reduce((s,x)=>s+Number(x.paid),0);
        document.getElementById('msInstCount').value = plan ? plan.count : '';
        groupSales.forEach(sale => addMultiSaleRow(sale));
        document.getElementById('multiSaleOverlay').classList.add('open');
        return;
      }
    }
  }
  msEditInvoiceNo = null;
  document.getElementById('msPaid').value = 0;
  document.getElementById('msInstCount').value = '';
  document.getElementById('msDate').value = todayStr();
  document.getElementById('msVoucher').value = '';

  document.getElementById('msIsOldEntry').checked = false;

  document.getElementById('multiSaleOverlay').classList.add('open');
}

function recalcMultiSaleTotal(){
  let grand = 0;
  msRows.forEach(rowId => {
    const qtyEl = document.getElementById(`ms-qty-${rowId}`);
    const priceEl = document.getElementById(`ms-price-${rowId}`);
    const discEl = document.getElementById(`ms-discount-${rowId}`);
    if(!qtyEl || !priceEl) return;
    const qty = Number(qtyEl.value)||0;
    const price = Number(priceEl.value)||0;
    const disc = discEl ? (Number(discEl.value)||0) : 0;
    grand += Math.max(0, qty*price - disc);
  });
  document.getElementById('msGrandValue').textContent = '৳' + money(grand);
  return grand;
}

document.getElementById('msSaveBtn').addEventListener('click', async () => {
  const customerId = document.getElementById('msCustomerId').value || null;
  const cust = customerId ? db.customers[customerId] : null;
  const customerName = cust ? cust.name : '';
  const date = document.getElementById('msDate').value || todayStr();
  const voucherNo = document.getElementById('msVoucher').value.trim();
  const voucherTag = document.getElementById('msVoucherTag').value.trim();
  const paymentSystem = document.getElementById('msPaymentSystem').value;
  const isOldEntry = document.getElementById('msIsOldEntry').checked;
  const instCount = Number(document.getElementById('msInstCount').value)||0;

  const rowsData = [];
  for(const rowId of msRows){
    const pid = document.getElementById(`ms-productid-${rowId}`).value;
    if(!pid) continue;
    const product = db.products[pid];
    if(!product) continue;
    const qty = Number(document.getElementById(`ms-qty-${rowId}`).value)||0;
    const price = Number(document.getElementById(`ms-price-${rowId}`).value)||0;
    const disc = Number(document.getElementById(`ms-discount-${rowId}`).value)||0;
    if(qty<=0) continue;
    if(qty > Number(product.qty)){
      if(!confirm(t('low_stock_more'))) return;
    }
    rowsData.push({ pid, product, qty, price, disc, rowTotal: Math.max(0, qty*price - disc) });
  }
  if(rowsData.length===0){ alert(t('product_not_found')); return; }

  // if editing, first reverse the old invoice's stock/due effects
  if(msEditInvoiceId){
    const oldSales = db.sales.filter(s=>s.invoiceId===msEditInvoiceId);
    const oldDueTotal = oldSales.reduce((s,x)=>s+Number(x.due||0),0);
    for(const old of oldSales){
      const p = db.products[old.productId];
      if(p){ p.qty = Number(p.qty) + Number(old.qty); await safePut('products', old.productId, p); }
      db.sales = db.sales.filter(s=>s.id!==old.id);
      await safeRemove('sales', old.id);
    }
    const oldPlan = db.installmentPlans.find(p=>p.invoiceId===msEditInvoiceId);
    if(oldPlan){
      db.installmentPlans = db.installmentPlans.filter(p=>p.id!==oldPlan.id);
      await safeRemove('installmentPlans', oldPlan.id);
    }
    if(oldSales[0] && oldSales[0].customerId && db.customers[oldSales[0].customerId]){
      const oldCust = db.customers[oldSales[0].customerId];
      oldCust.due = Math.max(0, Number(oldCust.due) - oldDueTotal);
      await safePut('customers', oldSales[0].customerId, oldCust);
    }
  }

  const grandTotal = rowsData.reduce((s,r)=>s+r.rowTotal,0);
  const paidInput = document.getElementById('msPaid').value;
  const overallPaid = paidInput===''? grandTotal : Math.min(grandTotal, Number(paidInput)||0);
  const overallDue = Math.max(0, grandTotal - overallPaid);

  const invoiceId = rowsData.length>1 ? (msEditInvoiceId || uid()) : null;
  const invoiceNo = msEditInvoiceNo || nextInvoiceNo();
  const saleRecords = [];
  let remainingPaid = overallPaid;
  let remainingDue = overallDue;

  rowsData.forEach((r, i) => {
    const isLast = i===rowsData.length-1;
    const share = grandTotal>0 ? r.rowTotal/grandTotal : 0;
    const rowPaid = isLast ? remainingPaid : Math.min(r.rowTotal, Math.round(overallPaid*share));
    const rowDue = isLast ? remainingDue : Math.max(0, r.rowTotal - rowPaid);
    remainingPaid -= rowPaid;
    remainingDue -= rowDue;
    const saleId = uid();
    const record = {
      id: saleId, invoiceId, invoiceNo, voucherNo, voucherTag, paymentSystem, isOldEntry, customerId, customerName,
      productId: r.pid, productName: r.product.name,
      qty: r.qty, unitPrice: r.price, unitCost: Number(r.product.cost||0), discount: r.disc,
      total: r.rowTotal, paid: rowPaid, due: rowDue, initialPaid: rowPaid, date, ts: Date.now()
    };
    saleRecords.push(record);
    r.product.qty = Math.max(0, Number(r.product.qty) - r.qty);
  });

  for(const r of rowsData) await safePut('products', r.pid, r.product);
  for(const rec of saleRecords){ db.sales.push(rec); await safePut('sales', rec.id, rec); }
  if(customerId && cust){
    cust.due = Number(cust.due||0) + overallDue;
    await safePut('customers', customerId, cust);
  }

  if(overallDue>0 && instCount>=2){
    const perAmount = Math.floor(overallDue / instCount);
    const items = [];
    for(let i=0;i<instCount;i++){
      const amt = (i===instCount-1) ? (overallDue - perAmount*(instCount-1)) : perAmount;
      items.push({ idx: i+1, amount: amt, status:'pending', paidDate:null });
    }
    const productNames = rowsData.map(r=>r.product.name).join(', ');
    const plan = {
      id: uid(), saleId: saleRecords[0].id, invoiceId, customerId, customerName,
      productName: productNames, totalDue: overallDue, count: instCount, perAmount,
      items, createdDate: date, ts: Date.now()
    };
    db.installmentPlans.push(plan);
    await safePut('installmentPlans', plan.id, plan);
  }

  document.getElementById('multiSaleOverlay').classList.remove('open');
  msEditInvoiceId = null;
  msEditInvoiceNo = null;
  renderNav();
  renderPage();
});

document.getElementById('dueConfirmBtn').addEventListener('click', async () => {
  if(!dueCtx) return;
  const cust = db.customers[dueCtx];
  if(!cust) return;
  const paid = Number(document.getElementById('duePaidInput').value)||0;
  const discount = Number(document.getElementById('dueDiscountInput').value)||0;
  const payDate = document.getElementById('dueDateInput').value || todayStr();
  const note = document.getElementById('dueNoteInput').value.trim();
  const isOldEntry = document.getElementById('dueIsOldEntry').checked;
  if(paid<=0 && discount<=0) return;
  const previousDue = Number(cust.due);
  const newDue = Math.max(0, previousDue - (paid+discount));
  cust.due = newDue;
  await safePut('customers', dueCtx, cust);

  // distribute this payment across the customer's outstanding sales (oldest first)
  // so each sale's own paid/due fields stay accurate too
  let toApply = paid + discount;
  const openSales = db.sales.filter(s=>s.customerId===dueCtx && Number(s.due)>0).sort((a,b)=>a.ts-b.ts);
  for(const sale of openSales){
    if(toApply<=0) break;
    const applyAmt = Math.min(Number(sale.due), toApply);
    sale.paid = Number(sale.paid||0) + applyAmt;
    sale.due = Math.max(0, Number(sale.due) - applyAmt);
    toApply -= applyAmt;
    await safePut('sales', sale.id, sale);
  }

  const instRecord = {
    id: uid(), receiptNo: nextReceiptNo(), customerId: dueCtx, customerName: cust.name,
    amount: paid, discount, previousDue, newDue, note, isOldEntry,
    date: payDate, ts: new Date(payDate).getTime() || Date.now()
  };
  db.installments.push(instRecord);
  await safePut('installments', instRecord.id, instRecord);
  document.getElementById('dueOverlay').classList.remove('open');
  dueCtx = null;
  renderPage();
  openInstallmentReceipt(instRecord);
});

function safeShowAppOrLogin(){
  if(useFirebase && !currentAuthUser){
    showLoginScreen();
  } else {
    showApp();
    loadAll();
  }
}

window.addEventListener('error', (ev) => {
  console.error('uncaught error', ev.error || ev.message);
  const appRoot = document.getElementById('appRoot');
  const loginScreen = document.getElementById('loginScreen');
  const stillBlank = appRoot && appRoot.style.display === 'none' && loginScreen && !loginScreen.classList.contains('open');
  if(stillBlank){
    console.warn('Recovering from blank screen after uncaught error');
    try{ safeShowAppOrLogin(); }catch(e){ /* nothing more we can do */ }
  }
});
window.addEventListener('unhandledrejection', (ev) => {
  console.error('unhandled promise rejection', ev.reason);
});

function bootstrapApp(){
  try{
    initStorage();
    initGoogleDrive();
    renderLangSwitch();
    renderBrandTexts();
    if(useFirebase && window.firebase && firebase.auth){
      firebase.auth().onAuthStateChanged(user => {
        currentAuthUser = user;
        try{
          if(user){ showApp(); loadAll(); }
          else { showLoginScreen(); }
        }catch(innerErr){
          console.error('post-auth render failed', innerErr);
          safeShowAppOrLogin();
        }
      }, (authErr) => {
        console.error('auth state listener error', authErr);
        currentAuthUser = null;
        showLoginScreen();
      });
    } else {
      // No Firebase configured — can't gate access without a backend, so just show the app.
      showApp();
      loadAll();
    }
  }catch(e){
    console.error('bootstrap failed', e);
    try{ safeShowAppOrLogin(); }catch(e2){ console.error('fallback also failed', e2); }
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', () => { bootstrapApp(); });
} else {
  bootstrapApp();
}
</script>
</body>
</html>
