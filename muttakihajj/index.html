<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হজ্জ এজেন্সি ম্যানেজমেন্ট সিস্টেম</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" defer crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" defer crossorigin="anonymous"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  /* হজ্জ থিম — সবুজ + সোনালি + সাদা */
  --paper:#F4F9F4; --paper-card:#E8F4E8; --ink:#1A2E1A; --ink-soft:#4a6741;
  --line:#C3DEC3; --amber:#1B6B3A; --amber-deep:#144d2a;
  --green:#1B6B3A; --green-bg:#D6EDDA; --red:#B4423A; --red-bg:#F6E4E2;
  --blue:#2E6B8A; --blue-bg:#E2EEF2; --gold:#C49A2F; --gold-bg:#FDF3D6;
  /* হজ্জ বিশেষ রং */
  --hajj-green:#1B6B3A; --hajj-gold:#C49A2F; --hajj-green-dark:#144d2a;
  --hajj-green-light:#D6EDDA; --hajj-gold-light:#FDF3D6;
  --sidebar-w:235px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;overflow-x:hidden;}
.app{display:flex;min-height:100vh;max-width:100vw;overflow-x:hidden;}

/* Sidebar */
.sidebar{
  width:var(--sidebar-w);background:linear-gradient(180deg,#0f3d20 0%,#1B6B3A 100%);color:var(--paper);
  position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:40;
  transition:transform 0.25s ease;
}
.sidebar .logo{padding:20px 18px 14px;border-bottom:1px solid rgba(250,246,236,0.12);}
.sidebar .logo h1{font-family:'Roboto Slab',serif;font-size:19px;margin:0;color:var(--paper);}
.sidebar .logo p{margin:2px 0 0;font-size:11px;color:rgba(250,246,236,0.55);}
.newsale-btn{
  margin:14px 18px;padding:9px 0;text-align:center;background:var(--hajj-gold);color:#fff;
  border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;width:calc(100% - 36px);
}
.nav{padding:6px 10px 20px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;
  color:rgba(250,246,236,0.75);font-size:14px;font-weight:500;cursor:pointer;
  border-left:3px solid transparent;margin-bottom:2px;
}
.nav-item:hover{background:rgba(250,246,236,0.06);}
.nav-item.active{background:rgba(196,154,47,0.25);color:#fff;border-left-color:var(--hajj-gold);}
.nav-item .ic{font-size:16px;width:18px;text-align:center;}
.nav-item .badge{
  margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-family:'IBM Plex Mono';
  padding:1px 6px;border-radius:10px;
}

.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:35;}

/* Main */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;overflow-x:hidden;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;border-bottom:1px solid var(--line);background:var(--paper);
  position:sticky;top:0;z-index:20;
}
.topbar .page-title{font-family:'Roboto Slab',serif;font-size:22px;font-weight:700;}
.topbar .crumb{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.hamburger{display:none;background:none;border:1px solid var(--line);border-radius:6px;width:36px;height:36px;font-size:16px;cursor:pointer;}
.content{padding:22px 24px 80px;}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{
  border-radius:10px;padding:16px 18px;color:#fff;box-shadow:0 1px 0 rgba(43,38,32,0.06);
}
.stat-card .val{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;line-height:1.1;}
.stat-card .lbl{font-size:12px;opacity:0.9;margin-top:4px;}
.stat-card.c1{background:#1B6B3A;} .stat-card.c2{background:#2E6B8A;}
.stat-card.c3{background:#144d2a;} .stat-card.c4{background:#C49A2F;color:#1A2E1A;}
.stat-card.c5{background:#1B6B3A;} .stat-card.c6{background:#2E6B8A;}
.stat-card.c7{background:var(--red);} .stat-card.c8{background:#4a6741;}
.stat-card.hajj-gold{background:var(--hajj-gold);color:#1A2E1A;}
.stat-card.hajj-green{background:var(--hajj-green);}
.stat-card.hajj-dark{background:var(--hajj-green-dark);}
.stat-card.hajj-blue{background:#2E6B8A;}

.panel{background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;overflow-x:auto;}
.panel h3{font-family:'Roboto Slab',serif;margin:0 0 14px;font-size:16px;}

/* Toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.toolbar input, .toolbar select{
  font-family:'Inter';font-size:14px;padding:9px 12px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink);
}
.toolbar input[type="text"]{flex:1;min-width:160px;}
.btn{font-family:'Inter';font-weight:600;font-size:14px;padding:9px 16px;border-radius:6px;border:none;cursor:pointer;background:var(--ink);color:var(--paper);}
.btn.amber{background:var(--hajj-gold);color:#fff;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.small{padding:6px 10px;font-size:12px;}

/* Table */
#pgTableWrap{overflow-x:auto;}
#instPageList{overflow-x:auto;}
#returnsPageList{overflow-x:auto;}
#custReportList{overflow-x:auto;}
#suppReportList{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:14px;}
table.data th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line);}
table.data td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
table.data th{white-space:nowrap;}
table.data tr.low td{background:var(--red-bg);}
table.data tr:hover td{background:rgba(27,107,58,0.06);}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.pill.green{background:var(--green-bg);color:var(--green);}
.pill.red{background:var(--red-bg);color:var(--red);}
.actions-cell{display:flex;gap:6px;flex-wrap:nowrap;white-space:nowrap;align-items:center;}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{border-color:var(--ink);}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:10px;}
.empty .big{font-family:'Roboto Slab',serif;font-size:18px;color:var(--ink);margin-bottom:6px;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(43,38,32,0.4);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--paper);border-radius:10px;padding:24px;width:100%;max-width:420px;border:1px solid var(--line);max-height:90vh;overflow-y:auto;overflow-x:auto;}
.modal h2{font-family:'Roboto Slab',serif;margin:0 0 16px;font-size:19px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em;}
.field input, .field select, .field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-family:'Inter';font-size:14px;background:#fff;color:var(--ink);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.field-hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

.loading{text-align:center;padding:60px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.app-footer{
  text-align:center;padding:16px 24px 24px;font-size:12px;color:var(--ink-soft);
  border-top:1px solid var(--line);margin-top:20px;
}

/* Storage status banner */
.storage-banner{
  padding:10px 24px;font-size:13px;display:flex;align-items:center;gap:8px;
}
.storage-banner.warn{background:var(--gold-bg);color:var(--amber-deep);border-bottom:1px solid var(--line);}
.storage-banner.ok{background:var(--green-bg);color:var(--green);border-bottom:1px solid var(--line);}
.storage-banner a{color:inherit;font-weight:600;}

/* Toast */
.toast{
  position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;opacity:0;
  transition:opacity 0.3s ease;pointer-events:none;
}
.toast.show{opacity:1;}

/* Reports mini bars */
.rbar-row{display:grid;grid-template-columns:90px 1fr 90px;gap:10px;align-items:center;padding:6px 0;font-size:13px;}
.rbar-track{background:var(--line);border-radius:4px;height:10px;overflow:hidden;}
.rbar-fill{height:100%;background:var(--hajj-gold);}

@media (max-width:900px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop.open{display:block;}
  .main{margin-left:0;}
  .hamburger{display:block;}
}

/* Logo + language switcher */
.logo-row{display:flex;align-items:center;gap:10px;}
.logo-img{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#fff;flex-shrink:0;}
.logo-placeholder{width:36px;height:36px;border-radius:6px;background:var(--hajj-gold);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Roboto Slab',serif;font-weight:700;font-size:16px;flex-shrink:0;}
.logo-upload-btn{font-size:10px;color:rgba(250,246,236,0.55);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;margin-top:2px;}
.lang-switch{
  margin:0 18px 10px;display:flex;border:1px solid rgba(250,246,236,0.2);border-radius:6px;overflow:hidden;
}
.lang-switch button{
  flex:1;background:none;border:none;color:rgba(250,246,236,0.6);font-size:12px;font-weight:600;
  padding:6px 0;cursor:pointer;
}
.lang-switch button.active{background:var(--hajj-gold);color:#fff;}

.select-row{display:flex;gap:6px;}
.select-row select{flex:1;}
.qa-btn{
  flex-shrink:0;width:38px;border:1px solid var(--line);background:var(--hajj-gold);color:#fff;
  border-radius:6px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;
}
.qa-btn:hover{background:#a07a1a;}
.overlay.top{z-index:80;}

@media print{
  .sidebar, .topbar, #storageBanner, .toast, #backdrop, .toolbar button, .actions-cell, .no-print{display:none !important;}
  .main{margin-left:0 !important;}
  body{background:#fff;}
  .panel, table.data{border-color:#ccc;}
  .overlay.open{position:static !important;background:none !important;padding:0 !important;}
  .overlay.open .modal{max-width:100% !important;border:none !important;box-shadow:none !important;padding:0 !important;}
  body:has(.overlay.open) .content{display:none !important;}
  .app{min-height:0 !important;display:block !important;}
  .main{min-height:0 !important;}
}

.print-header{display:none;}
@media print{
  .print-header{display:flex !important;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #2B2620;}
  .print-header img{width:44px;height:44px;object-fit:cover;border-radius:6px;}
  .print-header .ph-name{font-family:'Roboto Slab',serif;font-weight:700;font-size:20px;color:#2B2620;}
  .print-header .ph-contact{font-size:11px;color:#6b6255;line-height:1.5;margin-top:2px;}
}

.tabs-sub{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.sub-tab{background:none;border:none;padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;}
.sub-tab.active{color:var(--ink);border-bottom-color:var(--hajj-gold);}
.pick-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.pick-item{background:var(--paper-card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Inter';}
.pick-item.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.pick-item .pill{margin-left:2px;}

.ms-row{
  display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end;
  background:var(--paper-card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;
}
.ms-row .field{margin-bottom:0;}
.ms-row .ms-remove{
  background:var(--red-bg);color:var(--red);border:none;border-radius:6px;width:34px;height:34px;
  cursor:pointer;font-size:14px;
}
.ms-add-row{
  display:flex;align-items:center;gap:6px;background:none;border:1px dashed var(--line);color:var(--ink);
  border-radius:8px;padding:9px;width:100%;justify-content:center;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:14px;
}
.ms-add-row:hover{border-color:var(--amber);color:var(--amber);}
.ms-product-results{
  position:absolute;top:100%;left:0;right:38px;background:#fff;border:1px solid var(--line);
  border-radius:6px;max-height:180px;overflow-y:auto;z-index:60;box-shadow:0 4px 10px rgba(0,0,0,0.1);
  display:none;margin-top:2px;
}
.ms-product-results.open{display:block;}
.ms-product-result-item{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);}
.ms-product-result-item:last-child{border-bottom:none;}
.ms-product-result-item:hover{background:var(--paper-card);}
.ms-grand-total{
  display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
  background:var(--gold-bg);border-radius:8px;font-weight:700;margin-bottom:14px;
}
@media (max-width:640px){
  .ms-row{grid-template-columns:1fr 1fr;}
  .ms-row .ms-remove{grid-column:span 2;width:100%;}
}

/* Login Screen */
.login-screen{
  position:fixed;inset:0;background:var(--paper);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.login-screen.open{display:flex;}
.login-box{
  background:var(--paper-card);border:1px solid var(--line);border-radius:12px;
  padding:32px 28px;width:100%;max-width:340px;box-shadow:0 4px 20px rgba(43,38,32,0.08);
}
.login-box h1{font-family:'Roboto Slab',serif;font-size:24px;margin:0 0 4px;text-align:center;}
.login-box p{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
.login-box .field{margin-bottom:14px;}
.login-box .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em;}
.login-box input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:'Inter';font-size:14px;background:#fff;}
.login-box .btn{width:100%;margin-top:6px;padding:11px 0;}
.login-error{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:16px;}
.logout-row{padding:12px 18px;border-top:1px solid rgba(250,246,236,0.12);}
.logout-row button{
  width:100%;background:none;border:1px solid rgba(250,246,236,0.25);color:rgba(250,246,236,0.8);
  padding:8px 0;border-radius:6px;font-size:13px;cursor:pointer;font-family:'Inter';font-weight:600;
}
.logout-row button:hover{background:rgba(250,246,236,0.08);}
.backup-row{padding:12px 18px 0;display:flex;gap:8px;}
.backup-row button{
  flex:1;background:none;border:1px solid rgba(250,246,236,0.25);color:rgba(250,246,236,0.8);
  padding:8px 4px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Inter';font-weight:600;
}
.backup-row button:hover{background:rgba(250,246,236,0.08);}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1 id="loginTitle"></h1>
    <p id="loginSubtitle">Please log in to continue</p>
    <div class="field">
      <label id="loginEmailLabel">Email</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="field">
      <label id="loginPasswordLabel">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn amber" id="loginBtn">Login</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
<div class="app" id="appRoot" style="display:none;">
  <div class="sidebar-backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-row">
        <div id="logoWrap"><div class="logo-placeholder">হ</div></div>
        <div>
          <h1 id="brandName"></h1>
          <p id="brandSub">হজ্জ এজেন্সি ম্যানেজমেন্ট</p>
        </div>
      </div>
      <button class="logo-upload-btn" id="logoUploadBtn">লোগো পরিবর্তন / Change logo</button>
      <input type="file" id="logoFileInput" accept="image/*" style="display:none;">
    </div>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="bn">বাংলা</button>
      <button data-lang="en">English</button>
    </div>
    <button class="newsale-btn" id="quickSaleBtn">+ নতুন বুকিং</button>
    <nav class="nav" id="navList"></nav>
    <div class="backup-row" id="backupRow" style="display:none;">
      <button id="backupBtn">☁️ Backup</button>
      <button id="restoreBtn">♻️ Restore</button>
    </div>
    <div class="backup-row">
      <button id="clearAllBtn" style="border-color:rgba(180,66,58,0.5);color:#e6a29c;">🗑️ Clear All Data</button>
    </div>
    <div class="logout-row" id="logoutRow" style="display:none;">
      <button id="logoutBtn">Logout</button>
    </div>
  </aside>

  <div class="main">
    <div class="print-header" id="printHeader"></div>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <div>
          <div class="page-title" id="pageTitle">Dashboard</div>
          <div class="crumb" id="pageCrumb">Dashboard</div>
        </div>
      </div>
    </div>
    <div id="storageBanner"></div>
    <div class="content" id="content"><div class="loading">লোড হচ্ছে...</div></div>
    <div class="app-footer no-print">© <span id="footerYear"></span> হজ্জ এজেন্সি সিস্টেম। সর্বস্বত্ব সংরক্ষিত।</div>
  </div>
</div>

<!-- Generic Form Modal -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <h2 id="formTitle">Form</h2>
    <div id="formFields"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="formCancelBtn">বাতিল</button>
      <button class="btn amber" id="formSaveBtn">সংরক্ষণ করুন</button>
    </div>
  </div>
</div>

<!-- Customer History Modal -->
<div class="overlay" id="historyOverlay">
  <div class="modal" style="max-width:700px;width:95%;">
    <h2 id="historyTitle">History</h2>
    <div id="historyBody"></div>
    <div class="modal-actions no-print">
      <button class="btn ghost" id="historyCloseBtn">বন্ধ করুন</button>
      <button class="btn amber" id="historyPrintBtn">🖨</button>
    </div>
  </div>
</div>

<!-- Pay Due Modal -->
<div class="overlay" id="payDueOverlay">
  <div class="modal" style="max-width:360px;">
    <h2 id="payDueTitle">Pay Due</h2>
    <div id="payDueBody"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="payDueCancelBtn">Cancel</button>
      <button class="btn amber" id="payDueSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Return Modal -->
<div class="overlay top" id="returnOverlay">
  <div class="modal" style="max-width:650px;width:90%;">
    <h2 id="returnTitle">New Return</h2>
    <div class="field-hint" id="returnLineInfo" style="margin-bottom:12px;"></div>
    <div class="field"><label id="returnQtyLabel">Return Qty</label><input type="number" id="returnQtyInput" min="1"></div>
    <div class="field"><label id="returnDateLabel">Date</label><input type="date" id="returnDateInput"></div>

/* ---------- Google Drive Backup ----------
   ফ্রি ব্যাকআপের জন্য Google Drive API ব্যবহার হয়। আপনার Google Cloud
   প্রজেক্টে (Firebase প্রজেক্টই আসলে একটা Google Cloud প্রজেক্ট) একটা
   OAuth Client ID বানিয়ে এখানে বসান। নিচে "GOOGLE_CLIENT_ID" এর জায়গায়
   বসান — না বসালে Backup/Restore বাটন কাজ করবে না। */
const googleClientId = "828265788753-3jihsgrb36s6nanln1e7v1lv7d02e3ov.apps.googleusercontent.com";
let gisTokenClient = null;
let gisAccessToken = null;
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

function initGoogleDrive(retriesLeft){
  try{
    retriesLeft = retriesLeft === undefined ? 20 : retriesLeft;
    const configured = googleClientId && googleClientId !== "YOUR_GOOGLE_CLIENT_ID";
    const row = document.getElementById('backupRow');
    if(!configured){
      if(row) row.style.display = 'none';
      return;
    }
    if(!window.google || !google.accounts || !google.accounts.oauth2){
      if(retriesLeft > 0) setTimeout(() => initGoogleDrive(retriesLeft-1), 250);
      return;
    }
    gisTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: googleClientId,
      scope: DRIVE_SCOPE,
      callback: ''
    });
    if(row) row.style.display = 'flex';
  }catch(e){
    console.error('Google Drive init failed (non-fatal)', e);
  }
}

function requestDriveToken(onReady){
  if(!gisTokenClient) return;
  gisTokenClient.callback = (resp) => {
    if(resp.error){ console.error('drive auth failed', resp); showToast(t('drive_auth_failed')); return; }
    gisAccessToken = resp.access_token;
    onReady();
  };
  gisTokenClient.requestAccessToken({ prompt: gisAccessToken ? '' : 'consent' });
}

async function backupToDrive(){
  requestDriveToken(async () => {
    try{
      const payload = JSON.stringify({
        exportedAt: new Date().toISOString(),
        customers: db.customers, suppliers: db.suppliers, products: db.products,
        purchases: db.purchases, sales: db.sales, expenses: db.expenses
      }, null, 2);
      const fileName = `${SHOP_NAME}-backup-${todayStr()}-${Date.now()}.json`;
      const metadata = { name: fileName, mimeType: 'application/json' };
      const boundary = 'maxbackupboundary';
      const body =
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n` +
        `--${boundary}--`;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + gisAccessToken,
          'Content-Type': `multipart/related; boundary="${boundary}"`
        },
        body
      });
      if(!res.ok) throw new Error('upload failed: ' + res.status);
      showToast(t('backup_success'));
    }catch(e){
      console.error('backup failed', e);
      showToast(t('backup_failed'));
    }
  });
}

async function restoreFromDrive(){
  requestDriveToken(async () => {
    try{
      const q = encodeURIComponent(`name contains '${SHOP_NAME}-backup-' and mimeType='application/json' and trashed=false`);
      const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime desc&fields=files(id,name,createdTime)`, {
        headers: { 'Authorization': 'Bearer ' + gisAccessToken }
      });
      const listData = await listRes.json();
      const files = listData.files || [];
      if(files.length===0){ alert(t('no_backups_found')); return; }
      const options = files.map((f,i)=>`${i+1}. ${f.name}`).join('\n');
      const choice = prompt(t('choose_backup_prompt') + '\n' + options, '1');
      const idx = Number(choice)-1;
      if(isNaN(idx) || idx<0 || idx>=files.length) return;
      const fileId = files[idx].id;
      const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { 'Authorization': 'Bearer ' + gisAccessToken }
      });
      const backupData = await fileRes.json();
      if(!confirm(t('confirm_restore'))) return;
      for(const [rid, rec] of Object.entries(backupData.customers||{})){ db.customers[rid]=rec; await safePut('customers', rid, rec); }
      for(const [rid, rec] of Object.entries(backupData.suppliers||{})){ db.suppliers[rid]=rec; await safePut('suppliers', rid, rec); }
      for(const [rid, rec] of Object.entries(backupData.products||{})){ db.products[rid]=rec; await safePut('products', rid, rec); }
      for(const rec of (backupData.purchases||[])) await safePut('purchases', rec.id, rec);
      for(const rec of (backupData.sales||[])) await safePut('sales', rec.id, rec);
      for(const rec of (backupData.expenses||[])) await safePut('expenses', rec.id, rec);
      await loadAll();
      showToast(t('restore_success'));
    }catch(e){
      console.error('restore failed', e);
      showToast(t('restore_failed'));
    }
  });
}

}

/* ---------- Firestore via plain REST API ----------
   The Firestore SDK uses a long-lived streaming connection (WebChannel) that
   some mobile networks/devices silently block, even though normal HTTPS
   requests (like Firebase Auth) go through fine. To sidestep that entirely,
   all Firestore reads/writes here use plain fetch() calls to the Firestore
   REST API instead of the SDK — the same simple request/response style Auth
   already uses successfully. */
async function firestoreRest(method, path, body){
  const user = currentAuthUser || (firebase.auth && firebase.auth().currentUser);
  if(!user) throw new Error('No authenticated user available for Firestore REST call');
  const token = await user.getIdToken();
  const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/${path}`;
  const res = await fetch(url, {
    method,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    const errText = await res.text().catch(()=>'');
    const err = new Error(`Firestore REST ${method} ${path} failed: ${res.status} ${errText}`);
    err.status = res.status;
    throw err;
  }
  if(res.status===204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function toFirestoreValue(v){
  if(v===null || v===undefined) return {nullValue: null};
  if(typeof v === 'string') return {stringValue: v};
  if(typeof v === 'boolean') return {booleanValue: v};
  if(typeof v === 'number') return Number.isInteger(v) ? {integerValue: String(v)} : {doubleValue: v};
  if(Array.isArray(v)) return {arrayValue: {values: v.map(toFirestoreValue)}};
  if(typeof v === 'object') return {mapValue: {fields: toFirestoreFields(v)}};
  return {stringValue: String(v)};
}
function toFirestoreFields(obj){
  const fields = {};
  for(const [k,val] of Object.entries(obj||{})) fields[k] = toFirestoreValue(val);
  return fields;
}
function fromFirestoreValue(v){
  if(!v) return null;
  if(v.nullValue !== undefined) return null;
  if(v.stringValue !== undefined) return v.stringValue;
  if(v.booleanValue !== undefined) return v.booleanValue;
  if(v.integerValue !== undefined) return Number(v.integerValue);
  if(v.doubleValue !== undefined) return v.doubleValue;
  if(v.arrayValue !== undefined) return (v.arrayValue.values||[]).map(fromFirestoreValue);
  if(v.mapValue !== undefined) return fromFirestoreFields(v.mapValue.fields||{});
  return null;
}
function fromFirestoreFields(fields){
  const obj = {};
  for(const [k,val] of Object.entries(fields||{})) obj[k] = fromFirestoreValue(val);
  return obj;
}

async function storageGet(key){
  if(useFirebase){
    try{
      const data = await withTimeout(firestoreRest('GET', `shopdata/${key}`), 15000);
      return data && data.fields && data.fields.value ? fromFirestoreValue(data.fields.value) : null;
    }catch(e){
      if(e.status===404) return null;
      throw e;
    }
  }
  return localStorage.getItem(key);
}
async function storageSet(key, value){
  if(useFirebase){
    await withTimeout(firestoreRest('PATCH', `shopdata/${key}`, { fields: { value: toFirestoreValue(value) } }), 15000);
  } else {
    localStorage.setItem(key, value);
  }
}

/* Per-record collection storage: each customer/product/sale etc. is its own
   document, so two people saving different records at the same time can
   never silently overwrite each other's data. */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

async function fetchCollection(name){
  if(useFirebase){
    const out = {};
    let pageToken;
    do{
      const qs = pageToken ? `?pageSize=300&pageToken=${encodeURIComponent(pageToken)}` : `?pageSize=300`;
      const data = await withTimeout(firestoreRest('GET', `${name}${qs}`), 15000);
      (data && data.documents || []).forEach(doc => {
        const id = doc.name.split('/').pop();
        out[id] = fromFirestoreFields(doc.fields||{});
      });
      pageToken = data && data.nextPageToken;
    } while(pageToken);
    return out;
  }
  const raw = localStorage.getItem('col_'+name);
  return raw ? JSON.parse(raw) : {};
}
async function putRecord(name, id, data){
  if(useFirebase){
    await withTimeout(firestoreRest('PATCH', `${name}/${id}`, { fields: toFirestoreFields(data) }), 15000);
  } else {
    const raw = localStorage.getItem('col_'+name);
    const obj = raw ? JSON.parse(raw) : {};
    obj[id] = data;
    localStorage.setItem('col_'+name, JSON.stringify(obj));
  }
}
async function removeRecord(name, id){
  if(useFirebase){
    await withTimeout(firestoreRest('DELETE', `${name}/${id}`), 15000);
  } else {
    const raw = localStorage.getItem('col_'+name);
    const obj = raw ? JSON.parse(raw) : {};
    delete obj[id];
    localStorage.setItem('col_'+name, JSON.stringify(obj));
  }
}
async function safePut(name, id, data){
  try{ await putRecord(name, id, data); }
  catch(e){ console.error('save failed', name, id, e); showToast(t('save_failed_toast')); }
}
async function safeRemove(name, id){
  try{ await removeRecord(name, id); }
  catch(e){ console.error('delete failed', name, id, e); showToast(t('save_failed_toast')); }
}

function showToast(msg){

  t.textContent = msg;

}

function saleReturnedQty(saleId){
  return db.returns.filter(r=>r.saleId===saleId && !r.cancelled).reduce((s,r)=>s+Number(r.qty),0);
}
function saleGrossProfit(sale){
  return (Number(sale.unitPrice)-Number(sale.unitCost||0))*Number(sale.qty) - Number(sale.discount||0);
}
function saleReturnedProfitAmount(sale){
  if(!sale || !Number(sale.qty)) return 0;
  const perUnitProfit = saleGrossProfit(sale) / Number(sale.qty);
  return perUnitProfit * saleReturnedQty(sale.id);
}
function saleNetProfit(sale){
  return saleGrossProfit(sale) - saleReturnedProfitAmount(sale);
}
function money(n){ return Number(n||0).toLocaleString('en-US', {maximumFractionDigits:2}); }
function formatDateDMY(dateStr){
  if(!dateStr) return '—';
  const parts = String(dateStr).slice(0,10).split('-');
  if(parts.length!==3) return dateStr;
  const [y,m,d] = parts;
  return `${d}/${m}/${y}`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function computeTotalBalance(){
  const fromStr = SUMMARY_START_DATE;
  const toStr = todayStr();
  const inRange = (dateStr) => dateStr>=fromStr && dateStr<=toStr;
  let dp = 0, de = 0;
  db.sales.forEach(s => { if(inRange(s.date) && !s.isOldEntry) dp += Number(s.initialPaid!==undefined ? s.initialPaid : s.paid); });
  db.installments.forEach(i => { if(inRange(i.date) && !i.isOldEntry) dp += Number(i.amount)+Number(i.discount||0); });
  db.expenses.forEach(e => { if(inRange(e.date) && !e.isOldEntry) de += Number(e.amount); });
  db.returns.forEach(r => { if(!r.cancelled && inRange(r.date)) de += Number(r.excessRefund||0); });
  return dp - de;
}

        <div style="background:#fff;border-radius:8px;padding:14px;border:1px solid var(--line);text-align:center;">
          <div style="font-size:20px;font-weight:700;color:#B4423A;font-family:monospace;">৳${money(todayExpense)}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">💸 আজকের খরচ</div>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1.6fr;gap:16px;margin-bottom:16px;">
      <div class="panel" style="margin-bottom:0;min-width:0;overflow:hidden;">
        <h3>${t('reports_trend')} <span style="font-size:11px;font-weight:400;color:var(--ink-soft);">গত ১৪ দিন</span></h3>
        ${trendHTML}
      </div>
      <div class="panel" style="margin-bottom:0;min-width:0;overflow:hidden;">
        <h3>${t('recent_sales_heading')}</h3>
        ${recentHTML}
      </div>
    </div>

    ${lowHTML}
  `;
}
