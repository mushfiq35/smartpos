function pad2(n){ return String(n).padStart(2,'0'); }
function toISODate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function getEarliestDate(){
  const isValidISODate = (d) => typeof d==='string' && /^\d{4}-\d{2}-\d{2}/.test(d);
  const allDates = [
    ...db.sales, ...db.purchases, ...db.expenses,
    ...(db.installments||[]), ...(db.returns||[]), ...(db.travelAdjustments||[]), ...(db.preRegBatches||[]), ...(db.preRegPilgrims||[]), ...(db.loanTransactions||[]), ...(db.creditTransactions||[])
  ].map(x=>x.date).filter(isValidISODate).sort();
  return allDates.length ? allDates[0] : todayStr();
}

function resolveRange(rangeKey, customFrom, customTo){
  const today = new Date();
  let from, to;
  if(rangeKey==='last14'){
    to = new Date(today); from = new Date(today); from.setDate(from.getDate()-13);
  } else if(rangeKey==='thisMonth'){
    from = new Date(today.getFullYear(), today.getMonth(), 1); to = today;
  } else if(rangeKey==='thisYear'){
    from = new Date(today.getFullYear(), 0, 1); to = today;
  } else if(rangeKey==='allTime'){
    from = new Date(getEarliestDate()); to = today;
  } else {
    from = customFrom ? new Date(customFrom) : new Date(today);
    to = customTo ? new Date(customTo) : new Date(today);
  }
  return { fromStr: toISODate(from), toStr: toISODate(to) };
}


/* ---------- Reporting-safe installment settlement recognition ----------
   Business rule:
   - Booking discount is already inside sale.total (net booking value).
   - Installment amount = real cash received.
   - Installment discount = later receivable waiver, NOT cash.
   - A legacy/corrupt installment must never settle more than the customer's
     real outstanding receivable at that point in time.
   This helper DOES NOT edit saved data; it only protects accounting reports.
*/
function buildRecognizedInstallmentMap(){
  const result = {};
  const customerIds = new Set([
    ...db.sales.map(s=>s.customerId).filter(Boolean),
    ...db.installments.map(i=>i.customerId).filter(Boolean),
    ...db.returns.map(r=>r.customerId).filter(Boolean)
  ]);

  customerIds.forEach(cid=>{
    const events = [];

    db.sales.filter(s=>s.customerId===cid).forEach(s=>{
      events.push({
        type:'booking', date:s.date||'', ts:Number(s.ts||0),
        amount: Math.max(0, Number(s.total||0) - Number(s.initialPaid!==undefined ? s.initialPaid : s.paid||0))
      });
    });

    db.installments.filter(i=>i.customerId===cid).forEach(i=>{
      events.push({
        type:'installment', date:i.date||'', ts:Number(i.ts||0), rec:i
      });
    });

    db.returns.filter(r=>r.customerId===cid && !r.cancelled).forEach(r=>{
      events.push({
        type:'return', date:r.date||'', ts:Number(r.ts||0),
        amount:Math.max(0,Number(r.dueAdjust||0))
      });
    });

    events.sort((a,b)=>{
      if(a.date!==b.date) return a.date<b.date ? -1 : 1;
      // Same date: booking must establish the receivable first.
      if(a.type==='booking' && b.type!=='booking') return -1;
      if(b.type==='booking' && a.type!=='booking') return 1;
      return Number(a.ts||0)-Number(b.ts||0);
    });

    let outstanding = 0;
    events.forEach(ev=>{
      if(ev.type==='booking'){
        outstanding += ev.amount;
        return;
      }
      if(ev.type==='return'){
        outstanding = Math.max(0, outstanding - ev.amount);
        return;
      }

      const rec = ev.rec;
      const rawCash = Math.max(0, Number(rec.amount||0));
      const rawDiscount = Math.max(0, Number(rec.discount||0));

      const cash = Math.min(rawCash, outstanding);
      const afterCash = Math.max(0, outstanding - cash);
      const discount = Math.min(rawDiscount, afterCash);

      outstanding = Math.max(0, outstanding - cash - discount);
      result[rec.id] = {
        cash,
        discount,
        rawCash,
        rawDiscount,
        ignoredCash: Math.max(0, rawCash-cash),
        ignoredDiscount: Math.max(0, rawDiscount-discount)
      };
    });
  });

  // Records without a customer cannot be reconciled against a receivable.
  db.installments.filter(i=>!i.customerId).forEach(i=>{
    result[i.id] = {
      cash:Math.max(0,Number(i.amount||0)),
      discount:Math.max(0,Number(i.discount||0)),
      rawCash:Math.max(0,Number(i.amount||0)),
      rawDiscount:Math.max(0,Number(i.discount||0)),
      ignoredCash:0, ignoredDiscount:0
    };
  });

  return result;
}

function aggregatePeriod(fromStr, toStr){
  const from = new Date(fromStr), to = new Date(toStr);
  const spanDays = Math.max(1, Math.round((to-from)/(24*3600*1000))+1);
  const groupByMonth = spanDays > 31;
  const buckets = {};
  if(!groupByMonth){
    for(let d=new Date(from); d<=to; d.setDate(d.getDate()+1)){
      buckets[toISODate(d)] = {s:0,d:0,p:0,e:0};
    }
  } else {
    let d = new Date(from.getFullYear(), from.getMonth(), 1);
    const last = new Date(to.getFullYear(), to.getMonth(), 1);
    while(d<=last){
      buckets[`${d.getFullYear()}-${pad2(d.getMonth()+1)}`] = {s:0,d:0,p:0,e:0};
      d.setMonth(d.getMonth()+1);
    }
  }

  const bucketKey = (dateStr) => groupByMonth ? dateStr.slice(0,7) : dateStr;
  const inRange = (dateStr) => !!dateStr && dateStr >= fromStr && dateStr <= toStr;
  const recognized = buildRecognizedInstallmentMap();

  // Booking Total = actual booked revenue after booking-time discount.
  // Do NOT subtract later installment discounts from this figure.
  db.sales.forEach(x => {
    if(inRange(x.date)){
      const k=bucketKey(x.date);
      if(buckets[k]) buckets[k].s += Number(x.total||0);
    }
  });

  // Later installment discount is a separate revenue/receivable waiver.
  // Only the portion that could genuinely settle outstanding due is recognized.
  let ignoredLegacyAdjustment = 0;
  db.installments.forEach(i => {
    if(!inRange(i.date) || i.isOldEntry) return;
    const k=bucketKey(i.date);
    if(!buckets[k]) return;
    const rec = recognized[i.id] || {discount:0,ignoredDiscount:0,ignoredCash:0};
    buckets[k].d += Number(rec.discount||0);
    ignoredLegacyAdjustment += Number(rec.ignoredDiscount||0) + Number(rec.ignoredCash||0);
  });

  // Purchase: committed purchase value.
  db.purchases.forEach(x => {
    if(inRange(x.date)){
      const k=bucketKey(x.date);
      if(buckets[k]) buckets[k].p += Number(x.total||0);
    }
  });

  db.expenses.forEach(x => {
    if(inRange(x.date)){
      const k=bucketKey(x.date);
      if(buckets[k]) buckets[k].e += Number(x.amount||0);
    }
  });
  [...(db.loanTransactions||[]),...(db.creditTransactions||[])].filter(x=>!x.reversed&&inRange(x.date)).forEach(x=>{
    const k=bucketKey(x.date);if(!buckets[k])return;
    buckets[k].e+=financeExpenseAmount(x);
  });

  // Cash purchase return reduces effective purchase cost.
  db.vendorPayments.forEach(vp => {
    if(!inRange(vp.date)) return;
    const k=bucketKey(vp.date);
    if(!buckets[k]) return;
    if(vp.type==='purchase_return' && vp.returnType==='cash'){
      buckets[k].p -= Number(vp.amount||0);
    }
  });

  const rows = Object.entries(buckets)
    .map(([k,v]) => ({
      d:k, s:v.s, disc:v.d, p:v.p, e:v.e,
      net:v.s-v.d-v.p-v.e
    }))
    .sort((a,b)=>b.d.localeCompare(a.d));

  const totals = rows.reduce(
    (a,r)=>({
      s:a.s+r.s, disc:a.disc+r.disc, p:a.p+r.p,
      e:a.e+r.e, net:a.net+r.net
    }),
    {s:0,disc:0,p:0,e:0,net:0}
  );

  return { rows, totals, groupByMonth, ignoredLegacyAdjustment };
}

function getAvailableYears(){
  const dates = [...db.sales, ...db.purchases].map(x=>x.date).filter(Boolean);
  const years = [...new Set(dates.map(d=>d.slice(0,4)))].sort((a,b)=>b.localeCompare(a));
  return years;
}
function monthName(m){
  try{
    return new Date(2000, m-1, 1).toLocaleString(currentLang==='bn' ? 'bn-BD' : 'en-US', {month:'long'});
  }catch(e){ return String(m); }
}
function matchesYearMonth(dateStr, year, month){
  if(!dateStr) return false;
  if(year!=='all' && dateStr.slice(0,4)!==year) return false;
  if(month!=='all' && Number(dateStr.slice(5,7))!==Number(month)) return false;
  return true;
}

let summaryRange = 'last14';
let summaryFrom = '';
let summaryTo = '';

function renderSummaryReport(body){
  body.innerHTML = `
    <div class="toolbar no-print">
      <select id="summaryRangeSelect">
        <option value="last14">${t('range_last14')}</option>
        <option value="thisMonth">${t('range_this_month')}</option>
        <option value="thisYear">${t('range_this_year')}</option>
        <option value="allTime">${t('range_all_time')}</option>
        <option value="custom">${t('range_custom')}</option>
      </select>
      <input type="date" id="summaryFromDate" min="${SUMMARY_START_DATE}" style="display:none;">
      <input type="date" id="summaryToDate" style="display:none;">
      <button class="btn ghost" id="summaryPrintBtn" style="margin-left:auto;">${t('print_report')}</button>
    </div>
    <div id="summaryBody"></div>
  `;
  const rangeSelect = document.getElementById('summaryRangeSelect');
  const fromInput = document.getElementById('summaryFromDate');
  const toInput = document.getElementById('summaryToDate');
  rangeSelect.value = summaryRange;
  fromInput.value = summaryFrom || SUMMARY_START_DATE;
  toInput.value = summaryTo || todayStr();
  fromInput.style.display = summaryRange==='custom' ? '' : 'none';
  toInput.style.display = summaryRange==='custom' ? '' : 'none';

  function refresh(){
    let { fromStr, toStr } = resolveRange(summaryRange, summaryFrom || fromInput.value, summaryTo || toInput.value);
    if(fromStr < SUMMARY_START_DATE) fromStr = SUMMARY_START_DATE;
    if(toStr < fromStr) toStr = fromStr;
    const from = new Date(fromStr), to = new Date(toStr);
    const buckets = {};
    for(let d=new Date(from); d<=to; d.setDate(d.getDate()+1)) buckets[toISODate(d)] = {dp:0, de:0};
    const bucketKey = (dateStr) => dateStr;
    const inRange = (dateStr) => dateStr>=fromStr && dateStr<=toStr;
    db.sales.forEach(s => { if(inRange(s.date) && !s.isOldEntry && (!s.customerId||db.customers[s.customerId])){ const k=bucketKey(s.date); if(buckets[k]) buckets[k].dp += Number(s.paid||0); } });
    db.installments.forEach(i => { if(inRange(i.date) && !i.isOldEntry && (!i.customerId||db.customers[i.customerId])){ const k=bucketKey(i.date); if(buckets[k]) buckets[k].dp += Number(i.amount||0); } });
    db.expenses.forEach(e => { if(inRange(e.date) && !e.isOldEntry){ const k=bucketKey(e.date); if(buckets[k]) buckets[k].de += Number(e.amount); } });
    db.returns.forEach(r => { if(!r.cancelled && inRange(r.date)){ const k=bucketKey(r.date); if(buckets[k]) buckets[k].de += Number(r.excessRefund||0); } });
    (db.preRegBatches||[]).forEach(b=>{if(inRange(b.date)){const k=bucketKey(b.date);if(buckets[k])buckets[k].dp+=Number(b.paidAmount||0);}});
    (db.travelAdjustments||[]).forEach(r=>{if(r.status==='completed'&&inRange(r.date)&&['cash','bank','mobile_banking'].includes(r.settlementMethod)){const k=bucketKey(r.date);if(buckets[k])buckets[k].de+=Number(r.netAmount||0);}});
    (db.loanTransactions||[]).filter(x=>!x.reversed&&!x.openingOnly&&inRange(x.date)).forEach(x=>{const k=bucketKey(x.date);if(!buckets[k])return;(['collection','borrowed_received','borrow_more'].includes(x.kind)?buckets[k].dp+=Number(x.total||0):buckets[k].de+=Number(x.total||0));});
    (db.creditTransactions||[]).filter(x=>!x.reversed&&inRange(x.date)).forEach(x=>{const k=bucketKey(x.date);if(!buckets[k])return;if(x.kind==='draw')buckets[k].dp+=Number(x.total||0);if(x.kind==='payment')buckets[k].de+=Number(x.total||0);});
    // Vendor payments: cash out → de, cash return → dp
    db.vendorPayments.forEach(vp => {
      if(!inRange(vp.date)) return;
      const k = bucketKey(vp.date);
      if(!buckets[k]) return;
      if(vp.type==='payment' || vp.type==='purchase_payment') buckets[k].de += Number(vp.amount||0);
      if(vp.type==='purchase_return' && vp.returnType==='cash') buckets[k].dp += Number(vp.amount||0);
    });
    let running = 0;
    const rows = Object.entries(buckets).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v]) => {
      running += v.dp - v.de;
      return { d:k, dp:v.dp, de:v.de, s:running };
    });
    const periodColLabel = t('col_date');
    const finalSummary = rows.length ? rows[rows.length-1].s : 0;
    document.getElementById('summaryBody').innerHTML = `
      <div class="stat-grid no-print" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px;">
        <div class="stat-card c4"><div class="val">৳${money(rows.reduce((s,r)=>s+r.dp,0))}</div><div class="lbl">${t('summary_dp')} (${t('totals_label')})</div></div>
        <div class="stat-card c7"><div class="val">৳${money(rows.reduce((s,r)=>s+r.de,0))}</div><div class="lbl">${t('summary_de')} (${t('totals_label')})</div></div>
        <div class="stat-card c8"><div class="val">৳${money(finalSummary)}</div><div class="lbl">${t('summary_final')}</div></div>
      </div>
      <div class="panel">
        <h3>${t('reports_summary_tab')}</h3>
        <table class="data">
          <thead><tr><th>${periodColLabel}</th><th>${t('summary_dp')}</th><th>${t('summary_de')}</th><th>${t('summary_s')}</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${formatDateDMY(r.d)}</td><td>৳${money(r.dp)}</td><td>৳${money(r.de)}</td><td style="font-weight:700;">৳${money(r.s)}</td></tr>`).join('')}
          </tbody>
          <tfoot>
            <tr style="font-weight:700;"><td>${t('totals_label')}</td><td>৳${money(rows.reduce((s,r)=>s+r.dp,0))}</td><td>৳${money(rows.reduce((s,r)=>s+r.de,0))}</td><td>৳${money(finalSummary)}</td></tr>
          </tfoot>
        </table>
      </div>
    `;
  }

  rangeSelect.addEventListener('change', () => {
    summaryRange = rangeSelect.value;
    fromInput.style.display = summaryRange==='custom' ? '' : 'none';
    toInput.style.display = summaryRange==='custom' ? '' : 'none';
    if(summaryRange==='custom'){ summaryFrom = fromInput.value; summaryTo = toInput.value; }
    refresh();
  });
  fromInput.addEventListener('change', () => { summaryFrom = fromInput.value; refresh(); });
  toInput.addEventListener('change', () => { summaryTo = toInput.value; refresh(); });
  document.getElementById('summaryPrintBtn').addEventListener('click', () => safePrintPage());
  refresh();
}

let instRptQuery = '';

function safePrint(){
  const leakedGrpStyle = document.getElementById('grpPrintStyle');
  if(leakedGrpStyle) leakedGrpStyle.textContent = '';
  window.print();
}

// Use this variant only for print buttons that live on a normal, full-page
// view (never inside an open modal/overlay themselves) — e.g. Reports tabs,
// Group Member Report. It clears any stray overlay left with the 'open'
// class (which would otherwise blank the whole page via
// `body:has(.overlay.open) .content{display:none}`). Never use this inside
// a modal's own print button — it would hide the modal being printed.
function safePrintPage(){
  const leakedGrpStyle = document.getElementById('grpPrintStyle');
  if(leakedGrpStyle) leakedGrpStyle.textContent = '';
  document.querySelectorAll('.overlay.open').forEach(el => el.classList.remove('open'));
  window.print();
}

function printIsolated(title, tableHtml){
  const oldFrame = document.getElementById('isolatedPrintFrame');
  if(oldFrame) oldFrame.remove();

  const iframe = document.createElement('iframe');
  iframe.id = 'isolatedPrintFrame';
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  iframe.style.visibility = 'hidden';
  document.body.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>${escapeHtml(title)}</title>
<style>
  @page{ margin:12mm; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;padding:16px;color:#222;}
  h2{margin:0 0 14px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:6px 8px;border-bottom:1px solid #ccc;text-align:left;}
  th{background:#f0f0f0;text-transform:uppercase;font-size:11px;}
  tfoot td{font-weight:700;border-top:2px solid #333;}
</style>
</head>
<body>
<h2>${escapeHtml(title)}</h2>
${tableHtml}
</body>
</html>`);
  doc.close();

  iframe.onload = () => {
    const frameWin = iframe.contentWindow;
    frameWin.focus();
    frameWin.print();
  };
  const cleanup = () => { setTimeout(() => { iframe.remove(); }, 500); };
  iframe.contentWindow.onafterprint = cleanup;
}

function printCustLedger(cid){
  const cust = cid ? db.customers[cid] : null;
  if(!cust) return;
  const sales = db.sales.filter(s=>s.customerId===cid && matchesYearMonth(s.date, custReportYear, custReportMonth)).sort((a,b)=>b.ts-a.ts);
  const payments = db.installments.filter(p=>p.customerId===cid && matchesYearMonth(p.date, custReportYear, custReportMonth)).sort((a,b)=>b.ts-a.ts);
  const totalBought = sales.reduce((s,x)=>s+Number(x.total)+Number(x.discount||0),0);
  const totalInitialPaid = sales.reduce((s,x)=>s+Number(x.initialPaid!==undefined?x.initialPaid:x.paid),0);
  const totalInstPaid = payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalPaid = totalInitialPaid + totalInstPaid;
  const installmentDiscount = payments.reduce((s,p)=>s+Number(p.discount||0),0);
  const totalProfit = sales.reduce((s,x)=>s+saleNetProfit(x),0) - installmentDiscount;

  const ledgerRaw = [
    ...customerOpeningLedgerRows(cid),
    ...sales.map(s=>({
      ts: s.ts, date: s.date, type: 'booking', qty: s.qty,
      label: (s.invoiceNo?'#'+s.invoiceNo+' — ':'')+escapeHtml(s.productName),
      total: Number(s.total) + Number(s.discount||0), discount: Number(s.discount||0),
      paid: Number(s.initialPaid!==undefined?s.initialPaid:s.paid),
      profit: saleNetProfit(s)
    })),
    ...payments.map(p=>({
      ts: p.ts, date: p.date, type: 'installment', qty: null,
      label: p.note && p.note!=='—' ? escapeHtml(p.note) : t('nav_installments'),
      total: 0, discount: Number(p.discount||0),
      paid: Number(p.amount),
      profit: null
    }))
  ].sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?-1:1;
    if(a.type!==b.type) return ({opening:0,booking:1,installment:2}[a.type]??9)-({opening:0,booking:1,installment:2}[b.type]??9);
    return a.ts-b.ts;
  });

  let runningDue = 0;
  const ledger = ledgerRaw.map(tx=>{
    if(tx.type==='opening') runningDue += tx.net;
    else if(tx.type==='booking') runningDue += (tx.total - tx.discount - tx.paid);
    else runningDue -= (tx.paid + tx.discount);
    return { ...tx, runningDue: Math.round(runningDue) };
  });

  const body = `
    <div style="margin-bottom:10px;"><strong>${escapeHtml(cust.name)}</strong><br>${escapeHtml(cust.phone||'')}${cust.address?' · '+escapeHtml(cust.address):''}</div>
    <table>
      <thead><tr><th>${t('col_date')}</th><th>বিবরণ</th><th>${t('col_qty')}</th><th>${t('col_total')}</th><th>${t('col_discount')}</th><th>${t('col_paid')}</th><th>${t('col_due')}</th><th>${t('col_profit')}</th></tr></thead>
      <tbody>${ledger.map(tx=>`<tr>
        <td>${formatDateDMY(tx.date)}</td>
        <td>${tx.label}</td>
        <td>${tx.qty!==null?tx.qty:'—'}</td>
        <td>${tx.type==='booking'||tx.type==='opening'?'৳'+money(tx.total):'—'}</td>
        <td>${tx.discount>0?'৳'+money(tx.discount):'—'}</td>
        <td>৳${money(tx.paid)}</td>
        <td>${tx.runningDue>0?'৳'+money(tx.runningDue):tx.runningDue<0?'<span style="color:var(--green)">Advance ৳'+money(Math.abs(tx.runningDue))+'</span>':'৳0'}</td>
        <td>${tx.profit!==null?'৳'+money(tx.profit):'—'}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr>
        <td colspan="3">${t('totals_label')}</td>
        <td>৳${money(totalBought)}</td>
        <td>৳${money(ledger.reduce((s,x)=>s+x.discount,0))}</td>
        <td>৳${money(totalPaid)}</td>
        <td>${calculateCustomerDueFromLedger(custId)>0?'৳'+money(calculateCustomerDueFromLedger(custId)):'৳0'}</td>
        <td>৳${money(totalProfit)}</td>
      </tr></tfoot>
    </table>
  `;
  printIsolated(cust.name, body);
}

  let custRptPage = 1;
  const CUST_RPT_PAGE_SIZE = 25;

  function renderCustList(){
    const q = reportsCustQuery.trim().toLowerCase();
    const allEntries = Object.entries(db.customers).filter(([id,c]) => !q || c.name.toLowerCase().includes(q) || String(c.displayId||'').includes(q) || (c.phone && c.phone.toLowerCase().includes(q)) || db.sales.filter(s=>s.customerId===id).some(s=>(s.voucherNo||'').toLowerCase().includes(q)) || (c.passport && c.passport.toLowerCase().includes(q)) || (c.tracking && c.tracking.toLowerCase().includes(q)));
    const listEl = document.getElementById('custReportList');

    const totalPages = Math.max(1, Math.ceil(allEntries.length / CUST_RPT_PAGE_SIZE));
    if(custRptPage > totalPages) custRptPage = 1;
    const entries = allEntries.slice((custRptPage-1)*CUST_RPT_PAGE_SIZE, custRptPage*CUST_RPT_PAGE_SIZE);

    // Totals
    const grandTotalBooked = allEntries.reduce((s,[id])=>s+db.sales.filter(x=>x.customerId===id).reduce((t,x)=>t+Number(x.total)+Number(x.discount||0),0),0);
    const grandTotalDue = allEntries.reduce((sum,[id])=>sum+calculateCustomerDueFromLedger(id),0);
    const grandTotalPaid = allEntries.reduce((sum,[id]) => sum + db.sales.filter(x=>x.customerId===id).reduce((t,x)=>t+Number(x.initialPaid!==undefined?x.initialPaid:x.paid),0) + db.installments.filter(i=>i.customerId===id).reduce((t,i)=>t+Number(i.amount||0),0), 0);
    const grandTotalProfit = allEntries.reduce((s,[id])=>s + db.sales.filter(x=>x.customerId===id).reduce((t,x)=>t+saleNetProfit(x),0) - db.installments.filter(i=>i.customerId===id).reduce((t,i)=>t+Number(i.discount||0),0),0);

    const rows = entries.map(([id,c])=>{
      const booked = db.sales.filter(x=>x.customerId===id).reduce((t,x)=>t+Number(x.total)+Number(x.discount||0),0);
      const paid = db.sales.filter(x=>x.customerId===id).reduce((t,x)=>t+Number(x.initialPaid!==undefined?x.initialPaid:x.paid),0) + db.installments.filter(i=>i.customerId===id).reduce((t,i)=>t+Number(i.amount||0),0);
      const profit = db.sales.filter(x=>x.customerId===id).reduce((t,x)=>t+saleNetProfit(x),0) - db.installments.filter(i=>i.customerId===id).reduce((t,i)=>t+Number(i.discount||0),0);

        +'<td>'+escapeHtml(c.phone||'—')+'</td>'

        +'<td>৳'+money(profit)+'</td>'
        +'<td class="actions-cell"><button class="icon-btn cust-pick-btn" data-id="'+id+'" title="'+t('view_title')+'">👁</button></td>'

        +(reportsSelectedCustId===id ? '<tr><td colspan="8" style="padding:0;border-bottom:none;"><div style="padding:14px 0;">'+buildCustDetailHtml(id)+'</div></td></tr>' : '');

    listEl.innerHTML =
      '<div style="overflow-x:auto;" class="'+(reportsSelectedCustId?'no-print':'')+'">'
      +'<table class="data">'
      +'<thead><tr><th>'+t('col_id')+'</th><th>'+t('col_name')+'</th><th>'+t('col_phone')+'</th><th>'+t('lbl_total_booking')+'</th><th>'+t('lbl_paid_col')+'</th><th>'+t('col_due_amt')+'</th><th>'+t('col_profit')+'</th><th></th></tr></thead>'

      +'<td colspan="3">'+t('totals_label')+' ('+allEntries.length+')</td>'

  function buildCustDetailHtml(cid){
    const cust = cid ? db.customers[cid] : null;
    if(!cust) return '';
    const sales = db.sales
      .filter(s=>s.customerId===cid && matchesYearMonth(s.date, custReportYear, custReportMonth))

    const payments = db.installments
      .filter(p=>p.customerId===cid && matchesYearMonth(p.date, custReportYear, custReportMonth))
      .sort((a,b)=>b.ts-a.ts);
    const totalBought = sales.reduce((s,x)=>s+Number(x.total)+Number(x.discount||0),0);
    const totalInitialPaid = sales.reduce((s,x)=>s+Number(x.initialPaid!==undefined?x.initialPaid:x.paid),0);
    const totalInstPaid = payments.reduce((s,p)=>s+Number(p.amount||0),0);
    const totalPaid = totalInitialPaid + totalInstPaid;
    const installmentDiscount = payments.reduce((s,p)=>s+Number(p.discount||0),0);
    const canonicalDue = calculateCustomerDueFromLedger(cid);
    const totalProfit = sales.reduce((s,x)=>s+saleNetProfit(x),0) - installmentDiscount;

    // একটাই ব্যাংক-স্টেটমেন্ট স্টাইল লেজার — বুকিং ও কিস্তি, তারিখ অনুযায়ী,
    // চলমান ব্যালেন্স নিজে হিসাব করে বসানো হচ্ছে (কোনো আগের সেভ করা "due" এর উপর নির্ভর করছি না)
    const ledgerRaw = [
      ...customerOpeningLedgerRows(cid),
      ...sales.map(s=>({
        ts: s.ts, date: s.date, type: 'booking', qty: s.qty,
        label: (s.invoiceNo?'#'+s.invoiceNo+' — ':'')+escapeHtml(s.productName),
        total: Number(s.total) + Number(s.discount||0), discount: Number(s.discount||0),
        paid: Number(s.initialPaid!==undefined?s.initialPaid:s.paid),
        profit: saleNetProfit(s)
      })),
      ...payments.map(p=>({
        ts: p.ts, date: p.date, type: 'installment', qty: null,
        label: p.note && p.note!=='—' ? escapeHtml(p.note) : t('nav_installments'),
        total: 0, discount: Number(p.discount||0),
        paid: Number(p.amount),
        profit: null
      }))
    ].sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?-1:1;
    if(a.type!==b.type) return ({opening:0,booking:1,installment:2}[a.type]??9)-({opening:0,booking:1,installment:2}[b.type]??9);
    return a.ts-b.ts;
  });

    let runningDue = 0;
    const ledger = ledgerRaw.map(tx=>{
      if(tx.type==='opening') runningDue += tx.net;
      else if(tx.type==='booking') runningDue += (tx.total - tx.discount - tx.paid);
      else runningDue -= (tx.paid + tx.discount);
      return { ...tx, runningDue: Math.round(runningDue) };
    });

    return `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
          <div><h3 style="margin:0;">${escapeHtml(cust.name)}</h3>
          <div class="field-hint">${escapeHtml(cust.phone||'')}${cust.address?' · '+escapeHtml(cust.address):''}</div></div>
          <button class="btn ghost no-print" onclick="printCustLedger('${cid}')">${t('print_report')}</button>
        </div>
        <div class="field-hint" style="margin:12px 0;">${t('history_summary')(totalBought, totalPaid, calculateCustomerDueFromLedger(cid))} · ${t('col_profit')}: ৳${money(totalProfit)}</div>

        <h3 style="margin:14px 0 8px;">🧾 লেনদেনের হিসাব</h3>
        ${ledger.length===0 ? `<div class="empty"><div class="big">${t('no_sales_yet')}</div></div>` : `
        <table class="data">
          <thead><tr><th>${t('col_date')}</th><th>বিবরণ</th><th>${t('col_qty')}</th><th>${t('col_total')}</th><th>${t('col_discount')}</th><th>${t('col_paid')}</th><th>${t('col_due')}</th><th>${t('col_profit')}</th></tr></thead>
          <tbody>${ledger.map(tx=>`<tr>
            <td>${formatDateDMY(tx.date)}</td>
            <td>${tx.label}</td>
            <td>${tx.qty!==null?tx.qty:'—'}</td>
            <td>${tx.type==='booking'||tx.type==='opening'?'৳'+money(tx.total):'—'}</td>
            <td>${tx.discount>0?'৳'+money(tx.discount):'—'}</td>
            <td>৳${money(tx.paid)}</td>
            <td>${tx.runningDue>0?'৳'+money(tx.runningDue):tx.runningDue<0?'<span style="color:var(--green)">Advance ৳'+money(Math.abs(tx.runningDue))+'</span>':'৳0'}</td>
            <td>${tx.profit!==null?'৳'+money(tx.profit):'—'}</td>
          </tr>`).join('')}</tbody>
          <tfoot><tr style="font-weight:700;background:var(--paper-card);">
            <td colspan="3">${t('totals_label')}</td>
            <td>৳${money(totalBought)}</td>
            <td>৳${money(ledger.reduce((s,x)=>s+x.discount,0))}</td>
            <td>৳${money(totalPaid)}</td>
            <td>${canonicalDue>0?'<span style="color:var(--red);">৳'+money(canonicalDue)+'</span>':'<span style="color:var(--green);">'+t('lbl_clear')+'</span>'}</td>
            <td>৳${money(totalProfit)}</td>
          </tr></tfoot>
        </table>`}

        <!-- Summary box -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;">
          <div style="background:var(--hajj-green-light);border-radius:8px;padding:12px;text-align:center;">
            <div style="font-size:18px;font-weight:700;color:var(--hajj-green);">৳${money(totalBought)}</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">${t('lbl_total_booking')}</div>
          </div>
          <div style="background:var(--green-bg);border-radius:8px;padding:12px;text-align:center;">
            <div style="font-size:18px;font-weight:700;color:var(--green);">৳${money(totalPaid)}</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">${t('lbl_paid_col')}</div>
          </div>
          <div style="background:${canonicalDue>0?'var(--red-bg)':'var(--green-bg)'};border-radius:8px;padding:12px;text-align:center;">
            <div style="font-size:18px;font-weight:700;color:${canonicalDue>0?'var(--red)':'var(--green)'};">৳${money(canonicalDue)}</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">${t('lbl_due_col')}</div>
          </div>
        </div>
      </div>
    `;
  }
  renderCustList();
}

function groupSalesForDisplay(rawItems){
  // rawItems: [id, saleRecord][] — merge records sharing the same invoiceId into one display row
  const seen = new Set();
  const out = [];
  rawItems.forEach(([id, item]) => {
    if(seen.has(id)) return;
    if(!item.invoiceId){
      out.push([id, item]);
      return;
    }
    const group = rawItems.filter(([,x]) => x.invoiceId===item.invoiceId);
    group.forEach(([gid]) => seen.add(gid));
    const names = group.map(([,x]) => x.productName).join(', ');
    const merged = {
      ...item,
      productName: names,
      qty: group.length===1 ? group[0][1].qty : t('items_count')(group.length),
      total: group.reduce((s,[,x])=>s+Number(x.total),0),
      discount: group.reduce((s,[,x])=>s+Number(x.discount||0),0),
      paid: group.reduce((s,[,x])=>s+Number(x.paid),0),
      due: group.reduce((s,[,x])=>s+Number(x.due),0),
      _groupIds: group.map(([gid])=>gid),
    };
    out.push([id, merged]);
  });
  return out;
}

      <button class="btn amber" id="pgAddBtn">${t(cfg.addLabelKey)}</button>
    </div>
    <div id="pgTableWrap"></div>
  `;

  function applyFilters(){
    const search = document.getElementById('pgSearch').value.trim().toLowerCase();
    const cat = isProducts ? document.getElementById('pgCatFilter').value : '';
    let filteredItems = items;
    if(cat) filteredItems = filteredItems.filter(([id,item]) => item.cat===cat);
    _pgState[tab] = 1; // search করলে page 1 এ ফিরে যাও
    renderTable(tab, filteredItems, search);
  }

  applyFilters();
  document.getElementById('pgSearch').addEventListener('input', applyFilters);
  if(isProducts) document.getElementById('pgCatFilter').addEventListener('change', applyFilters);
  document.getElementById('pgAddBtn').addEventListener('click', () => {
    if(tab==='sales') openMultiSale(); else openForm(tab, null);
  });
}

const PAGE_SIZE = 25;
const _pgState = {}; // tab → current page

function renderTable(tab, items, search){
  const cfg = CONFIG[tab];
  let filtered = items;
  if(search){
    let memberMatchIds = new Set();
    if(tab==='customers'){
      const q = search.replace(/^#/,'').trim();
      const matchingMembers = Object.entries(db.groupMembers).filter(([mid,m])=>String(m.memberNo)===q);
      matchingMembers.forEach(([mid])=>{
        Object.entries(db.groups).filter(([,g])=>g.memberId===mid).forEach(([gid,g])=>{
          normalizeHajjiIds(g.hajjiIds).forEach(hid=>memberMatchIds.add(hid));
          db.sales.filter(s=>s.groupId===gid).forEach(s=>{ if(s.customerId) memberMatchIds.add(s.customerId); });
        });
      });
    }
    filtered = items.filter(([id,item]) => JSON.stringify(item).toLowerCase().includes(search) || memberMatchIds.has(id));
  }
  const wrap = document.getElementById('pgTableWrap');
  if(filtered.length===0){
    wrap.innerHTML = '<div class="empty"><div class="big">'+t('no_data')+'</div>'+t('no_data_hint')+'</div>';
    _pgState[tab] = 1;
    return;
  }

  // pagination
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(!_pgState[tab] || _pgState[tab] > totalPages) _pgState[tab] = 1;
  const page = _pgState[tab];
  const start = (page-1)*PAGE_SIZE;
  const pageItems = filtered.slice(start, start+PAGE_SIZE);

  // table rows
  const rows = pageItems.map(function(entry){
    const id = entry[0]; const item = entry[1];
    const isLow = cfg.isLow && cfg.isLow(item);
    const isGroup = !!item._groupIds;
    const cells = cfg.columns.map(function(c){
      if(tab==='customers' && c.k==='due'){
        const balance=calculateCustomerBalanceFromLedger(id);
        return '<td>'+(balance>0?'<span class="pill red">৳'+money(balance)+'</span>':balance<0?'<span class="pill green">Advance ৳'+money(Math.abs(balance))+'</span>':'<span class="pill green">Clear</span>')+'</td>';
      }
      if(tab==='suppliers' && c.k==='due'){
        const balance=calculateSupplierBalanceFromLedger(id);
        return '<td>'+(balance>0?'<span class="pill red">৳'+money(balance)+'</span>':balance<0?'<span class="pill green">Advance ৳'+money(Math.abs(balance))+'</span>':'<span class="pill green">ক্লিয়ার</span>')+'</td>';
      }
      return '<td>'+(c.fmt ? c.fmt(item[c.k], item) : escapeHtml(item[c.k]==null?'—':item[c.k]))+'</td>';
    }).join('');
    const editBtn = !cfg.noEdit
      ? '<button class="icon-btn" title="'+t('edit_title')+'" data-action="edit" data-tab="'+tab+'" data-id="'+id+'" data-group="'+(isGroup?item.invoiceId:'')+'" data-isgroup="'+(isGroup?'1':'0')+'">✏️</button>'
      : '';
    const delBtn = '<button class="icon-btn" title="'+t('delete_title')+'" data-action="del" data-tab="'+tab+'" data-id="'+id+'" data-isgroup="'+(isGroup?'1':'0')+'">🗑️</button>';
    const extra = cfg.extraRowActions ? cfg.extraRowActions(id,item) : '';
    return '<tr class="'+(isLow?'low':'')+'">'+cells+'<td class="actions-cell">'+extra+editBtn+delBtn+'</td></tr>';
  }).join('');

  // pagination buttons
  function pgBtn(p, label, disabled, active){
    return '<button '+(disabled?'disabled ':'')+( active?'class="active" ':'')+' data-pgaction="'+tab+'" data-pgnum="'+p+'">'+label+'</button>';
  }
  let pgBtns = pgBtn(page-1,'&#8249;', page===1, false);
  const delta = 2;
  for(let p=1; p<=totalPages; p++){
    if(p===1 || p===totalPages || (p>=page-delta && p<=page+delta)){
      pgBtns += pgBtn(p, p, false, p===page);
    } else if(p===page-delta-1 || p===page+delta+1){
      pgBtns += '<span class="pg-info">…</span>';
    }
  }
  pgBtns += pgBtn(page+1,'&#8250;', page===totalPages, false);

  const info = '<span class="pg-info">'+(start+1)+'-'+Math.min(start+PAGE_SIZE,total)+' / '+total+'</span>';

  wrap.innerHTML = '<table class="data">'
    + '<thead><tr>'+cfg.columns.map(function(c){return '<th>'+t(c.hKey)+'</th>';}).join('')+'<th></th></tr></thead>'
    + '<tbody>'+rows+'</tbody>'
    + '</table>'
    + '<div class="pagination">'+pgBtns+info+'</div>';

  // event delegation for edit/delete buttons
  wrap.onclick = function(e){
    // pagination button
    const pgBtn2 = e.target.closest('[data-pgaction]');
    if(pgBtn2 && !pgBtn2.disabled){
      pgGo(pgBtn2.dataset.pgaction, Number(pgBtn2.dataset.pgnum));
      return;
    }
    // vendor statement
    const vndBtn = e.target.closest('[data-vndstmt]');
    if(vndBtn){ openVendorStatement(vndBtn.dataset.vndstmt); return; }
    // purchase return
    const purRet = e.target.closest('[data-purreturn]');
    if(purRet){ openPurchaseReturn(purRet.dataset.purreturn); return; }
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    const t2 = btn.dataset.tab;
    const id2 = btn.dataset.id;
    const isGroup = btn.dataset.isgroup === '1';
    const groupId = btn.dataset.group;
    if(action==='edit'){
      if(isGroup) openMultiSale(groupId); else openForm(t2, id2);
    } else if(action==='del'){
      if(isGroup) deleteInvoiceGroup(id2); else deleteItem(t2, id2);
    }
  };
  applyRoleUi();
}

function pgGo(tab, page){
  _pgState[tab] = page;
  const pgSearch = document.getElementById('pgSearch');
  const search = pgSearch ? pgSearch.value.trim().toLowerCase() : '';
  const cfg = CONFIG[tab];
  let items = cfg.isObj ? Object.entries(db[tab]) : db[tab].map(x=>[x.id,x]).reverse();
  if(tab==='sales') items = groupSalesForDisplay(items);
  const cat = document.getElementById('pgCatFilter') ? document.getElementById('pgCatFilter').value : '';
  if(cat) items = items.filter(([id,item]) => item.cat===cat);
  renderTable(tab, items, search);
  document.getElementById('pgTableWrap').scrollIntoView({behavior:'smooth', block:'start'});
}

let formCtx = null; // {tab, id}
function openForm(tab, id){

  if(!id&&!requirePermission('create_records'))return;
  const cfg = CONFIG[tab];
  formCtx = {tab, id};
  const item = id ? (cfg.isObj ? db[tab][id] : db[tab].find(x=>x.id===id)) : {};

  document.getElementById('formCancelBtn').textContent = t('cancel');
  document.getElementById('formSaveBtn').textContent = t('save');
  document.getElementById('formFields').innerHTML = cfg.fields.map(f => {
    const val = item[f.key] !== undefined ? item[f.key] : (f.default !== undefined ? f.default : '');
    if(f.type==='paymentMethod') return `<div class="field"><label>${t(f.labelKey)}</label><select data-key="${f.key}"><option value="cash" ${val==='cash'?'selected':''}>${t('payment_cash')}</option><option value="bank" ${val==='bank'?'selected':''}>${t('payment_bank')}</option><option value="mobile_banking" ${val==='mobile_banking'?'selected':''}>${t('payment_mobile_banking')}</option></select></div>`;
    if(f.type==='paymentAccount') return `<div class="field" data-payment-account-field><label>${t(f.labelKey)}</label><select data-key="${f.key}"></select></div>`;
    if(f.type==='select'){
      const srcObj = db[f.optionsFrom];
      const opts = Object.entries(srcObj).map(([oid,o]) => `<option value="${oid}" ${String(val)===oid?'selected':''}>${escapeHtml(o.name)}</option>`).join('');
      const selectHtml = `<select data-key="${f.key}">
        ${f.allowEmptyKey ? `<option value="">${t(f.allowEmptyKey)}</option>`:''}${opts}
      </select>`;
      if(f.quickAdd){
        return `<div class="field"><label>${t(f.labelKey)}</label>
          <div class="select-row">${selectHtml}<button type="button" class="qa-btn" title="+" onclick="openQuickAdd('${f.quickAdd}','${f.key}')">+</button></div>
        </div>`;
      }
      return `<div class="field"><label>${t(f.labelKey)}</label>${selectHtml}</div>`;
    }
    if(f.suggest){
      const collection = cfg.isObj ? Object.values(db[tab]) : db[tab];
      let suggestions = [...new Set(collection.map(it=>it[f.key]).filter(Boolean))];
      if(f.suggestFromCategories){
        const catNames = Object.values(db.categories).map(c=>c.name).filter(Boolean);
        suggestions = [...new Set([...catNames, ...suggestions])];
      }
      if(f.suggestFromPurchases){
        const purSuggestions = [...new Set(db.purchases.map(p=>p[f.suggestFromPurchases]).filter(Boolean))];
        suggestions = [...new Set([...purSuggestions, ...suggestions])];
      }
      const listId = `dl-${tab}-${f.key}`;
      return `<div class="field"><label>${t(f.labelKey)}</label>
        <input type="${f.type}" data-key="${f.key}" value="${escapeHtml(val)}" list="${listId}" autocomplete="off">
        <datalist id="${listId}">${suggestions.map(s=>`<option value="${escapeHtml(s)}">`).join('')}</datalist>
      </div>`;
    }
    if(f.hidden) return '';
    if(f.type==='checkbox'){
      return `<div class="field" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" data-key="${f.key}" ${val?'checked':''} style="width:auto;">
        <label style="margin:0;text-transform:none;font-size:13px;">${t(f.labelKey)}</label>
      </div>`;
    }
    return `<div class="field"><label>${t(f.labelKey)}</label><input type="${f.type}" data-key="${f.key}" value="${escapeHtml(val)}"></div>`;
  }).join('');
  const methodEl=document.querySelector('#formFields [data-key="paymentSystem"]');
  const accountEl=document.querySelector('#formFields [data-key="paymentAccountId"]');
  if(methodEl&&accountEl){const fill=()=>{accountEl.innerHTML=paymentAccountOptions(methodEl.value,item.paymentAccountId||'');accountEl.disabled=methodEl.value==='cash';const wrap=accountEl.closest('[data-payment-account-field]');if(wrap)wrap.style.display=methodEl.value==='cash'?'none':'block';};methodEl.onchange=fill;fill();}
  document.getElementById('formOverlay').classList.add('open');
}
document.getElementById('formCancelBtn').addEventListener('click', () => {
  document.getElementById('formOverlay').classList.remove('open'); formCtx=null;
});
setupOverlayBackdropClose('formOverlay', () => { formCtx=null; });

document.getElementById('formSaveBtn').addEventListener('click', async () => {
  if(!formCtx) return;
  const {tab, id} = formCtx;
  const cfg = CONFIG[tab];
  const values = {};
  let missingRequired = false;
  cfg.fields.forEach(f => {
    const el = document.querySelector(`#formFields [data-key="${f.key}"]`);
    if(!el){ values[f.key]=f.type==='checkbox'?false:(f.default!==undefined?f.default:''); return; }
    let v = f.type==='checkbox' ? el.checked : el.value;
    if(f.type==='number') v = Number(v)||0;
    if(f.required && (v===''||v===0&&f.type==='number'&&f.key!=='paid')) { /* soft check below */ }
    if(f.required && (v===''||v===null||v===undefined)) missingRequired = true;
    values[f.key] = v;
  });
  if(missingRequired){ alert(t('required_fields')); return; }
  if(values.paymentSystem && !validatePaymentAccount(values.paymentSystem,values.paymentAccountId)) return;

  await handleSave(tab, id, values);
  document.getElementById('formOverlay').classList.remove('open');
  formCtx = null;
  refreshCurrentView();
});

async function handleSave(tab, id, values){
  if(id&&!requirePermission('edit_records'))return;
  if(!id&&!requirePermission('create_records'))return;
  if(tab==='customers' || tab==='suppliers' || tab==='categories'){
    const key = id || uid();
    const existing = db[tab][key] || {};
    const record = {...existing, ...values};
    if(tab==='customers' || tab==='suppliers') record.due = existing.due || 0;
    if(tab==='customers' && !id && !record.displayId){
      record.displayId = nextCustomerDisplayId();
    }
    db[tab][key] = record;
    await safePut(tab, key, record);
  }
  else if(tab==='products'){
    const key = id || uid();
    const record = {...(db.products[key]||{}), ...values};
    db.products[key] = record;
    await safePut('products', key, record);
  }
  else if(tab==='purchases'){
    const supplier = db.suppliers[values.supplierId];
    const total = Number(values.qty) * Number(values.unitCost);
    const paidNow = Math.min(Number(values.paid||0), total);
    const dueAmt = total - paidNow;

    if(id){
      // ── EDIT: পুরানো effect reverse করো ──
      const existing = db.purchases.find(x=>x.id===id);
      if(existing && existing.supplierId){
        const oldSup = db.suppliers[existing.supplierId];
        if(oldSup){
          oldSup.due = Number(oldSup.due||0) - Number(existing.due||0);
          await safePut('suppliers', existing.supplierId, oldSup);
        }
        const oldVp = db.vendorPayments.find(vp=>vp.purchaseId===id && vp.type==='purchase_payment');
        if(oldVp){
          db.vendorPayments = db.vendorPayments.filter(vp=>vp.id!==oldVp.id);
          await safeRemove('vendorPayments', oldVp.id);
        }
      }
      const updatedRecord = { ...(existing||{}), supplierId:values.supplierId,
        supplierName:supplier?supplier.name:'—', sector:values.sector||'—',
        note:values.note||'', qty:Number(values.qty), unitCost:Number(values.unitCost),
        total, paid:paidNow, due:dueAmt, paymentSystem:values.paymentSystem||'cash', paymentAccountId:values.paymentAccountId||null, paymentAccountName:paymentAccountLabel(values.paymentAccountId), date:values.date };
      const eidx = db.purchases.findIndex(x=>x.id===id);
      if(eidx>=0) db.purchases[eidx] = updatedRecord;
      await safePut('purchases', id, updatedRecord);
      if(supplier){ supplier.due = Number(supplier.due||0) + dueAmt; await safePut('suppliers', values.supplierId, supplier); }
      if(paidNow>0){
        const vp = { id:uid(), supplierId:values.supplierId, supplierName:supplier?supplier.name:'—',
          type:'purchase_payment', amount:paidNow, purchaseId:id, note:'Payment', paymentSystem:values.paymentSystem||'cash', paymentAccountId:values.paymentAccountId||null, paymentAccountName:paymentAccountLabel(values.paymentAccountId), date:values.date, ts:Date.now() };
        db.vendorPayments.push(vp); await safePut('vendorPayments', vp.id, vp);
      }
    } else {
      // ── NEW purchase ──
      if(supplier){ supplier.due = Number(supplier.due||0) + dueAmt; await safePut('suppliers', values.supplierId, supplier); }
      const record = {
        id: uid(), supplierId: values.supplierId, supplierName: supplier?supplier.name:'—',
        sector: values.sector||'—', note: values.note||'',
        qty: Number(values.qty), unitCost: Number(values.unitCost),
        total, paid: paidNow, due: dueAmt, paymentSystem:values.paymentSystem||'cash', paymentAccountId:values.paymentAccountId||null, paymentAccountName:paymentAccountLabel(values.paymentAccountId), date: values.date, ts: Date.now()
      };
      db.purchases.push(record);
      await safePut('purchases', record.id, record);
      if(paidNow > 0){
        const vp = { id:uid(), supplierId:values.supplierId, supplierName:supplier?supplier.name:'—',
          type:'purchase_payment', amount:paidNow, purchaseId:record.id,
          note:'Initial payment for purchase', paymentSystem:values.paymentSystem||'cash', paymentAccountId:values.paymentAccountId||null, paymentAccountName:paymentAccountLabel(values.paymentAccountId), date:values.date, ts:Date.now() };
        db.vendorPayments.push(vp); await safePut('vendorPayments', vp.id, vp);
      }
    }
  }
  else if(tab==='sales'){
    let existing = null;
    const touchedCustomers = new Set();
    const touchedProducts = new Set();
    if(id){
      existing = db.sales.find(x=>x.id===id);
      if(existing){
        // reverse previous effects before applying the edited values
        const prevProduct = db.products[existing.productId];
        if(prevProduct){ prevProduct.qty = Number(prevProduct.qty) + Number(existing.qty); touchedProducts.add(existing.productId); }
        if(existing.customerId && db.customers[existing.customerId]){
          db.customers[existing.customerId].due = Math.max(0, Number(db.customers[existing.customerId].due||0) - Number(existing.due||0));
          touchedCustomers.add(existing.customerId);
        }
      }
    }
    const product = db.products[values.productId];
    if(!product){ alert(t('product_not_found')); return; }
    if(Number(values.qty) > Number(product.qty)){
      if(!confirm(t('low_stock_more'))) return;
    }
    const rawTotal = Number(values.qty) * Number(values.unitPrice);
    const discount = Number(values.discount)||0;
    const total = Math.max(0, rawTotal - discount);
    const paid = values.paid===''||values.paid===undefined ? total : Number(values.paid);
    const due = Math.max(0, total - paid);
    product.qty = Math.max(0, Number(product.qty) - Number(values.qty));
    touchedProducts.add(values.productId);
    let customerName = '';
    if(values.customerId){
      const cust = db.customers[values.customerId];
      if(cust){ customerName = cust.name; cust.due = Number(cust.due||0) + due; touchedCustomers.add(values.customerId); }
    }
    const record = {
      id: id || uid(), invoiceId: existing ? existing.invoiceId : null,
      invoiceNo: existing ? (existing.invoiceNo || nextInvoiceNo()) : nextInvoiceNo(),
      voucherNo: existing ? existing.voucherNo : '', voucherTag: existing ? existing.voucherTag : '',
      paymentSystem: values.paymentSystem||'cash', paymentAccountId:values.paymentAccountId||null, paymentAccountName:paymentAccountLabel(values.paymentAccountId), isOldEntry: existing ? existing.isOldEntry : false,
      customerId: values.customerId||null, customerName,
      productId: values.productId, productName: product.name,
      qty: Number(values.qty), unitPrice: Number(values.unitPrice), unitCost: Number(product.cost||0), discount,
      total, paid, due, initialPaid: existing ? (existing.initialPaid!==undefined ? existing.initialPaid : paid) : paid,
      date: values.date, ts: existing ? existing.ts : Date.now()
    };
    if(existing){
      const idx = db.sales.findIndex(x=>x.id===id);
      db.sales[idx] = record;
    } else {
      db.sales.push(record);
    }
    for(const pid of touchedProducts) await safePut('products', pid, db.products[pid]);
    await safePut('sales', record.id, record);
    for(const cid of touchedCustomers) await safePut('customers', cid, db.customers[cid]);

    const instCount = Number(values.installmentCount)||0;
    if(!existing && due>0 && instCount>=2){
      const perAmount = Math.floor(due / instCount);
      const items = [];
      for(let i=0;i<instCount;i++){
        const amt = (i===instCount-1) ? (due - perAmount*(instCount-1)) : perAmount;
        items.push({ idx: i+1, amount: amt, status:'pending', paidDate:null });
      }
      const plan = {
        id: uid(), saleId: record.id, customerId: values.customerId||null, customerName,
        productName: product.name, totalDue: due, count: instCount, perAmount,
        items, createdDate: values.date, ts: Date.now()
      };
      db.installmentPlans.push(plan);
      await safePut('installmentPlans', plan.id, plan);
    }
    else if(existing){
      // if this sale already has an installment plan, keep it in sync with any due change
      // (e.g. adding/increasing a discount on edit) by adjusting the last pending installment
      const plan = db.installmentPlans.find(p=>p.saleId===record.id);
      if(plan){
        const deltaDue = due - Number(existing.due||0);
        if(deltaDue !== 0){
          for(let i=plan.items.length-1;i>=0;i--){
            if(plan.items[i].status==='pending'){
              plan.items[i].amount = Math.max(0, Number(plan.items[i].amount) + deltaDue);
              break;
            }
          }
          plan.totalDue = Math.max(0, Number(plan.totalDue) + deltaDue);
          plan.customerName = customerName || plan.customerName;
          await safePut('installmentPlans', plan.id, plan);
        }
      }
    }
  }
  else if(tab==='expenses'){
    const record = { id: uid(), category: values.category, amount: Number(values.amount), paymentSystem:values.paymentSystem||'cash', paymentAccountId:values.paymentAccountId||null, paymentAccountName:paymentAccountLabel(values.paymentAccountId), note: values.note, date: values.date, isOldEntry: !!values.isOldEntry, ts: Date.now() };
    db.expenses.push(record);
    await safePut('expenses', record.id, record);
  }
}

async function deleteInvoiceGroup(repId){
  if(!requirePermission('delete_records'))return;
  const rep = db.sales.find(s=>s.id===repId);
  if(!rep) return;
  await new Promise(resolve=>{
    showDeleteConfirm(
      t('del_title_booking'),
      '"'+escapeHtml(rep.customerName||'')+'" Invoice #'+(rep.invoiceNo||'?')+t('del_msg_confirm'),
      resolve
    );
  });
  const groupIds = db.sales.filter(s=>s.invoiceId===rep.invoiceId).map(s=>s.id);
  for(const gid of groupIds){
    db.sales = db.sales.filter(s=>s.id!==gid);
    await safeRemove('sales', gid);
  }
  const plan = db.installmentPlans.find(p=>p.invoiceId===rep.invoiceId);
  if(plan){
    db.installmentPlans = db.installmentPlans.filter(p=>p.id!==plan.id);
    await safeRemove('installmentPlans', plan.id);
  }
  if(rep.groupMemberId && db.groupMembers[rep.groupMemberId]){
    const member = db.groupMembers[rep.groupMemberId];
    member.due = calculateGroupMemberDueFromLedger(rep.groupMemberId);
    await safePut('groupMembers', rep.groupMemberId, member);
  }
  renderNav(); renderPage();
}


async function deleteHajji(custId){
  if(!requirePermission('delete_records'))return;
  const cust = db.customers[custId];
  if(!cust) return;
  const custSalesCount = db.sales.filter(s=>s.customerId===custId).length;
  const custInstCount = db.installments.filter(i=>i.customerId===custId).length;
  const details = custSalesCount>0 ? custSalesCount+t('del_msg_sales')+(custInstCount>0?', '+custInstCount+t('del_msg_inst'):'') : t('del_msg_no_sales');
  await new Promise(resolve=>{
    showDeleteConfirm(
      t('del_title_hajji'),
      '"'+escapeHtml(cust.name)+'"'+t('del_msg_hajji_data')+' ('+details+')',
      resolve
    );
  });

  // ── sales (bookings) মুছো ────────────────────────────────────────────
  const custSales = db.sales.filter(s=>s.customerId===custId);
  for(const sale of custSales){
    db.sales = db.sales.filter(x=>x.id!==sale.id);
    await safeRemove('sales', sale.id);
  }

  // ── installments মুছো ────────────────────────────────────────────────
  const custInst = db.installments.filter(i=>i.customerId===custId);
  for(const inst of custInst){
    db.installments = db.installments.filter(x=>x.id!==inst.id);
    await safeRemove('installments', inst.id);
  }

  // ── installment plans মুছো ───────────────────────────────────────────
  const custPlans = db.installmentPlans.filter(p=>p.customerId===custId);
  for(const plan of custPlans){
    db.installmentPlans = db.installmentPlans.filter(x=>x.id!==plan.id);
    await safeRemove('installmentPlans', plan.id);
  }

  // ── returns মুছো ─────────────────────────────────────────────────────
  const custReturns = db.returns.filter(r=>r.customerId===custId);
  for(const ret of custReturns){
    db.returns = db.returns.filter(x=>x.id!==ret.id);
    await safeRemove('returns', ret.id);
  }

  const opening=openingBalanceRecord('customer',custId);
  if(opening){db.openingBalances=db.openingBalances.filter(x=>x.id!==opening.id);await safeRemove('openingBalances',opening.id);}

  // ── customer নিজে মুছো ───────────────────────────────────────────────
  delete db.customers[custId];
  await safeRemove('customers', custId);

  // ── যেকোনো লটের রোস্টার (hajjiIds) থেকেও এই হাজীর আইডি সরাও, না হলে
  //    ডিলিট হয়ে যাওয়া হাজীও লটের সংখ্যায় গণনায় থেকে যায় ──────────────
  for(const [gid, grp] of Object.entries(db.groups)){
    const ids = normalizeHajjiIds(grp.hajjiIds);
    if(ids.includes(custId)){
      grp.hajjiIds = ids.filter(hid=>hid!==custId);
      await safePut('groups', gid, grp);
    }
  }

  showToast(t('deleted_toast'));
  renderNav();
  renderPage();
}

async function deleteItem(tab, id){
  if(!requirePermission('delete_records'))return;
  if(tab==='customers'){ await deleteHajji(id); return; }
  const cfg = CONFIG[tab];
  const itemObj = cfg.isObj ? db[tab][id] : (db[tab]||[]).find(x=>x.id===id);
  const itemName = itemObj ? (itemObj.name||itemObj.customerName||itemObj.supplierName||itemObj.sector||itemObj.productName||t('del_title_generic')) : t('del_title_generic');
  await new Promise(resolve=>{
    showDeleteConfirm(
      t('del_title_generic'),
      '"'+escapeHtml(String(itemName))+'"'+t('del_msg_confirm'),
      resolve
    );
  });
  // Purchase delete হলে supplier.due reverse করো
  if(tab==='purchases'){
    const pur = db.purchases.find(x=>x.id===id);
    if(pur && pur.supplierId && db.suppliers[pur.supplierId]){
      db.suppliers[pur.supplierId].due = Number(db.suppliers[pur.supplierId].due||0) - Number(pur.due||0);
      await safePut('suppliers', pur.supplierId, db.suppliers[pur.supplierId]);
    }
    // Initial purchase payment record সরাও
    const oldVp = db.vendorPayments.find(vp=>vp.purchaseId===id && vp.type==='purchase_payment');
    if(oldVp){
      db.vendorPayments = db.vendorPayments.filter(vp=>vp.id!==oldVp.id);
      await safeRemove('vendorPayments', oldVp.id);
    }
  }
  if(tab==='suppliers'){
    const opening=openingBalanceRecord('supplier',id);if(opening){db.openingBalances=db.openingBalances.filter(x=>x.id!==opening.id);await safeRemove('openingBalances',opening.id);}
  }
  if(cfg.isObj) delete db[tab][id];
  else db[tab] = db[tab].filter(x=>x.id!==id);
  await safeRemove(tab, id);
  renderNav(); renderPage();
}

function customerOpeningLedgerRows(custId){
  const x=openingBalanceRecord('customer',custId);if(!x)return[];const net=openingBalanceNet('customer',custId);
  return [{ts:x.ts||0,date:x.date,type:'opening',qty:null,label:'OPEN — '+openingSideLabel(x)+(x.reference?' — '+escapeHtml(x.reference):''),total:net>0?net:0,discount:0,paid:net<0?Math.abs(net):0,profit:null,net}];
}
function calculateCustomerBalanceFromLedger(custId){
  const sales=db.sales.filter(s=>s.customerId===custId);
  const installments=db.installments.filter(i=>i.customerId===custId);
  const bookedNet=sales.reduce((n,s)=>n+Number(s.total||0),0);
  const initialPaid=sales.reduce((n,s)=>n+Number(s.initialPaid!==undefined?s.initialPaid:s.paid||0),0);
  const laterSettled=installments.reduce((n,i)=>n+Number(i.amount||0)+Number(i.discount||0),0);
  const returnAdjust=db.returns.filter(r=>!r.cancelled&&r.customerId===custId).reduce((n,r)=>n+Number(r.dueAdjust||0),0);
  const preRegDue=(db.preRegBatches||[]).filter(b=>b.ownerType==='customer'&&b.ownerId===custId).reduce((n,b)=>n+Math.max(0,Number(b.totalAmount||0)-Number(b.paidAmount||0)),0);
  return Math.round(openingBalanceNet('customer',custId)+bookedNet-initialPaid-laterSettled-returnAdjust+preRegDue);
}
function calculateCustomerDueFromLedger(custId){
  return Math.max(0,calculateCustomerBalanceFromLedger(custId));
}
function calculateCustomerAdvanceFromLedger(custId){
  return Math.max(0,-calculateCustomerBalanceFromLedger(custId));
}
function calculateSupplierBalanceFromLedger(supplierId){
  const purchaseTotal=db.purchases.filter(p=>p.supplierId===supplierId).reduce((n,p)=>n+Number(p.total||0),0);
  const settled=db.vendorPayments.filter(x=>x.supplierId===supplierId).reduce((n,x)=>n+((x.type==='payment'||x.type==='purchase_payment'||x.type==='purchase_return')?Number(x.amount||0):0),0);
  return Math.round(openingBalanceNet('supplier',supplierId)+purchaseTotal-settled);
}
function calculateGroupMemberBookingDueFromLedger(memberId){
  const sales = db.sales.filter(s=>s.groupMemberId===memberId);
  const installments = db.installments.filter(i=>i.groupMemberId===memberId);
  const bookedNet = sales.reduce((n,s)=>n+Number(s.total||0),0);
  const initialPaid = sales.reduce((n,s)=>n+Number(s.initialPaid!==undefined?s.initialPaid:s.paid||0),0);
  const laterSettled = installments.reduce((n,i)=>n+Number(i.amount||0)+Number(i.discount||0),0);
  const returnAdjust = db.returns.filter(r=>!r.cancelled&&r.groupMemberId===memberId).reduce((n,r)=>n+Number(r.dueAdjust||0),0);
  const preRegDue=(db.preRegBatches||[]).filter(b=>b.ownerType==='group_agent'&&b.ownerId===memberId).reduce((n,b)=>n+Math.max(0,Number(b.totalAmount||0)-Number(b.paidAmount||0)),0);
  return Math.max(0,Math.round(bookedNet-initialPaid-laterSettled-returnAdjust+preRegDue));
}
function calculateGroupMemberBalanceFromLedger(memberId){
  const bookingDue=calculateGroupMemberBookingDueFromLedger(memberId);
  const manualNet=db.agentLedger.filter(x=>x.memberId===memberId).reduce((n,x)=>n+(x.type==='debit'?Number(x.amount||0):-Number(x.amount||0)),0);
  return Math.round(openingBalanceNet('agent',memberId)+bookingDue+manualNet);
}
function calculateGroupMemberDueFromLedger(memberId){
  return Math.max(0,calculateGroupMemberBalanceFromLedger(memberId));
}
function openCustomerHistory(custId){
  const cust = db.customers[custId];

  const payments = db.installments.filter(i=>i.customerId===custId);

  const totalBought = sales.reduce((s,x)=>s+Number(x.total)+Number(x.discount||0),0);
  const totalInitialPaid = sales.reduce((s,x)=>s+Number(x.initialPaid!==undefined?x.initialPaid:x.paid),0);
  const totalInstPaid = payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalPaid = totalInitialPaid + totalInstPaid;

  const ledgerRaw = [
    ...customerOpeningLedgerRows(custId),

      ts: s.ts, date: s.date, type: 'booking', qty: s.qty,

  let runningDue = 0;

    else if(tx.type==='booking') runningDue += (tx.total - tx.discount - tx.paid);

    </div>
    ${ledger.length===0 ? `<div class="empty"><div class="big">${t('no_sales_yet')}</div></div>` : `
    <table class="data">
      <thead><tr><th>${t('col_date')}</th><th>বিবরণ</th><th>${t('col_qty')}</th><th>${t('col_total')}</th><th>${t('col_discount')}</th><th>${t('col_paid')}</th><th>${t('col_due')}</th></tr></thead>
      <tbody>${ledger.map(tx=>`<tr>
        <td>${formatDateDMY(tx.date)}</td>
        <td>${tx.label}</td>
        <td>${tx.qty!==null?tx.qty:'—'}</td>
        <td>${tx.type==='booking'||tx.type==='opening'?'৳'+money(tx.total):'—'}</td>
        <td>${tx.discount>0?'৳'+money(tx.discount):'—'}</td>
        <td>৳${money(tx.paid)}</td>
        <td>${tx.runningDue>0?'৳'+money(tx.runningDue):tx.runningDue<0?'<span style="color:var(--green)">Advance ৳'+money(Math.abs(tx.runningDue))+'</span>':'৳0'}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr style="font-weight:700;background:var(--paper-card);">
        <td colspan="3">${t('totals_label')}</td>
        <td>৳${money(totalBought)}</td>

        <td>৳${money(totalPaid)}</td>

async function markInstallmentPaid(planId, idx, selectedMethod, selectedAccount){
  const plan = db.installmentPlans.find(p=>p.id===planId);
  if(!plan) return;
  const item = plan.items.find(it=>it.idx===idx);
  if(!item || item.status==='paid') return;
  if(!selectedMethod){
    const old=document.getElementById('installmentPayMethodOverlay');if(old)old.remove();
    const html='<div class="overlay open" id="installmentPayMethodOverlay" style="z-index:190"><div class="modal" style="max-width:410px"><h2>'+t('inst_pay_btn')+' — ৳'+money(item.amount)+'</h2><div class="field"><label>'+t('f_payment_system')+'</label><select id="ipmMethod"><option value="cash">'+t('payment_cash')+'</option><option value="bank">'+t('payment_bank')+'</option><option value="mobile_banking">'+t('payment_mobile_banking')+'</option></select></div><div class="field" id="ipmAccountField"><label>'+t('f_payment_account')+'</label><select id="ipmAccount"></select></div><div class="modal-actions"><button class="btn ghost" id="ipmCancel">'+t('cancel')+'</button><button class="btn amber" id="ipmSave">'+t('confirm')+'</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend',html);const ov=document.getElementById('installmentPayMethodOverlay');
    document.getElementById('ipmMethod').onchange=()=>refreshPaymentAccountSelect('ipmMethod','ipmAccount');refreshPaymentAccountSelect('ipmMethod','ipmAccount');
    document.getElementById('ipmCancel').onclick=()=>ov.remove();document.getElementById('ipmSave').onclick=()=>{const method=document.getElementById('ipmMethod').value,account=document.getElementById('ipmAccount').value||null;if(!validatePaymentAccount(method,account))return;ov.remove();markInstallmentPaid(planId,idx,method,account);};return;
  }
  item.status = 'paid';
  item.paidDate = todayStr();
  await safePut('installmentPlans', plan.id, plan);

  // keep the sale record(s) own paid/due fields in sync with installment payments.
  // for multi-product invoices, distribute this installment amount across all
  // line items proportionally to their remaining due.
  const groupSales = plan.invoiceId
    ? db.sales.filter(s=>s.invoiceId===plan.invoiceId)
    : db.sales.filter(s=>s.id===plan.saleId);
  const groupDueTotal = groupSales.reduce((s,x)=>s+Number(x.due||0),0);
  let remainingToApply = Number(item.amount);
  groupSales.forEach((sale, i) => {
    const isLast = i===groupSales.length-1;
    const share = groupDueTotal>0 ? Number(sale.due||0)/groupDueTotal : (isLast?1:0);
    const applyAmt = isLast ? remainingToApply : Math.min(Number(sale.due||0), Math.round(Number(item.amount)*share));
    remainingToApply -= applyAmt;
    sale.paid = Number(sale.paid||0) + applyAmt;
    sale.due = Math.max(0, Number(sale.due||0) - applyAmt);
  });
  for(const sale of groupSales) await safePut('sales', sale.id, sale);

  if((plan.customerId && db.customers[plan.customerId]) || (plan.groupMemberId && db.groupMembers[plan.groupMemberId])){
    const cust = plan.customerId ? db.customers[plan.customerId] : null;
    const member = plan.groupMemberId ? db.groupMembers[plan.groupMemberId] : null;
    const previousDue = cust ? calculateCustomerDueFromLedger(plan.customerId) : calculateGroupMemberDueFromLedger(plan.groupMemberId);
    const instRecord = {
      id: uid(), receiptNo: nextReceiptNo(), customerId: plan.customerId, customerName: plan.customerName,
      buyerType: plan.buyerType||'customer', groupMemberId: plan.groupMemberId||null,
      groupMemberName: plan.groupMemberName||'',
      amount: Number(item.amount), discount: 0, previousDue, newDue: Math.max(0, previousDue-Number(item.amount)),
      paymentSystem:selectedMethod, paymentAccountId:selectedAccount||null, paymentAccountName:paymentAccountLabel(selectedAccount), note:t('grp_due_payment'),
      date: todayStr(), ts: Date.now(), planId: plan.id, installmentNo: idx
    };
    db.installments.push(instRecord);
    await safePut('installments', instRecord.id, instRecord);
    if(cust){
      cust.due = calculateCustomerDueFromLedger(plan.customerId);
      instRecord.newDue = cust.due;
      await safePut('customers', plan.customerId, cust);
    } else if(member){
      member.due = calculateGroupMemberDueFromLedger(plan.groupMemberId);
      instRecord.newDue = member.due;
      await safePut('groupMembers', plan.groupMemberId, member);
    }
    await safePut('installments', instRecord.id, instRecord);
    openInstallmentReceipt(instRecord);
  }
  renderPage();
  // refresh whichever view is currently showing this plan
  if(document.getElementById('saleViewOverlay').classList.contains('open')) openSaleView(plan.saleId);
  if(document.getElementById('instHistoryOverlay').classList.contains('open') && plan.customerId) openInstallmentHistory(plan.customerId);
  if(currentTab==='installments') renderInstallmentsPage();
}

function invoiceDueTotal(sale){
  const group = sale.invoiceId ? db.sales.filter(s=>s.invoiceId===sale.invoiceId) : [sale];
  return group.reduce((s,x)=>s+Number(x.due),0);
}
function updateReturnCalcInfo(){
  if(!returnCtx) return;
  const sale = db.sales.find(s=>s.id===returnCtx);
  if(!sale) return;
  const qty = Number(document.getElementById('returnQtyInput').value)||0;
  const perUnitValue = Number(sale.qty)>0 ? Number(sale.total)/Number(sale.qty) : 0;
  const returnValue = qty*perUnitValue;
  const dueAdjust = Math.min(returnValue, invoiceDueTotal(sale));
  const excessRefund = Math.max(0, returnValue - dueAdjust);
  document.getElementById('returnCalcInfo').innerHTML = `
    ${t('return_value')}: ৳${money(returnValue)}<br>
    ${t('return_due_adjust')}: ৳${money(dueAdjust)}<br>
    ${t('return_excess_refund')}: ৳${money(excessRefund)}
  `;
  document.getElementById('returnRefundPayFields').style.display=excessRefund>0?'block':'none';
}
document.getElementById('returnQtyInput').addEventListener('input', updateReturnCalcInfo);
document.getElementById('returnCancelBtn').addEventListener('click', () => {
  document.getElementById('returnOverlay').classList.remove('open');
  returnCtx = null;
});
setupOverlayBackdropClose('returnOverlay', () => { returnCtx = null; });

document.getElementById('returnConfirmBtn').addEventListener('click', async () => {
  if(!returnCtx) return;
  const sale = db.sales.find(s=>s.id===returnCtx);
  if(!sale) return;
  const qty = Number(document.getElementById('returnQtyInput').value)||0;
  const alreadyReturned = saleReturnedQty(returnCtx);
  const remaining = Number(sale.qty) - alreadyReturned;
  if(qty<=0 || qty>remaining){ alert(t('return_qty_invalid')); return; }
  const date = document.getElementById('returnDateInput').value || todayStr();
  const note = document.getElementById('returnNoteInput').value.trim();

  const perUnitValue = Number(sale.qty)>0 ? Number(sale.total)/Number(sale.qty) : 0;
  const returnValue = qty*perUnitValue;
  const groupSales = sale.invoiceId ? db.sales.filter(s=>s.invoiceId===sale.invoiceId) : [sale];
  const invoiceDue = groupSales.reduce((s,x)=>s+Number(x.due),0);
  const dueAdjust = Math.min(returnValue, invoiceDue);
  const excessRefund = Math.max(0, returnValue - dueAdjust);
  const paymentSystem=excessRefund>0?document.getElementById('returnPaymentSystem').value:null;
  const paymentAccountId=excessRefund>0?(document.getElementById('returnPaymentAccount').value||null):null;
  if(excessRefund>0&&!validatePaymentAccount(paymentSystem,paymentAccountId)) return;

  const product = db.products[sale.productId];
  if(product){ product.qty = Number(product.qty) + qty; await safePut('products', sale.productId, product); }

  // distribute the due reduction across the invoice: the returned line first, then other lines
  let remainingAdjust = dueAdjust;
  const adjustments = [];
  const ownReduce = Math.min(Number(sale.due), remainingAdjust);
  if(ownReduce>0){ sale.due = Number(sale.due) - ownReduce; remainingAdjust -= ownReduce; adjustments.push({saleId: sale.id, amount: ownReduce}); }
  await safePut('sales', sale.id, sale);
  for(const otherSale of groupSales){
    if(remainingAdjust<=0) break;
    if(otherSale.id===sale.id) continue;
    const reduce = Math.min(Number(otherSale.due), remainingAdjust);
    if(reduce>0){
      otherSale.due = Number(otherSale.due) - reduce;
      remainingAdjust -= reduce;
      adjustments.push({saleId: otherSale.id, amount: reduce});
      await safePut('sales', otherSale.id, otherSale);
    }
  }

  if(sale.customerId && db.customers[sale.customerId]){
    const cust = db.customers[sale.customerId];
    cust.due = Math.max(0, Number(cust.due) - dueAdjust);
    cust.refundOwed = Number(cust.refundOwed||0) + excessRefund;
    await safePut('customers', sale.customerId, cust);
  }

  const record = {
    id: uid(), returnNo: nextReturnNo(), saleId: sale.id, invoiceId: sale.invoiceId||null,
    productId: sale.productId, productName: sale.productName,
    customerId: sale.customerId||null, customerName: sale.customerName||'',
    buyerType: sale.buyerType||'customer', groupMemberId: sale.groupMemberId||null,
    groupMemberName: sale.groupMemberName||'',
    qty, unitValue: perUnitValue, value: returnValue, dueAdjust, excessRefund, adjustments,
    paymentSystem,paymentAccountId,paymentAccountName:paymentAccountLabel(paymentAccountId),
    date, note, cancelled:false, ts: Date.now()
  };
  db.returns.push(record);
  await safePut('returns', record.id, record);
  if(sale.groupMemberId && db.groupMembers[sale.groupMemberId]){
    const member = db.groupMembers[sale.groupMemberId];
    member.due = calculateGroupMemberDueFromLedger(sale.groupMemberId);
    await safePut('groupMembers', sale.groupMemberId, member);
  }

  document.getElementById('returnOverlay').classList.remove('open');
  returnCtx = null;
  renderNav();
  renderPage();
  if(document.getElementById('saleViewOverlay').classList.contains('open')) openSaleView(sale.id);
});

async function cancelReturn(returnId){
  const rec = db.returns.find(r=>r.id===returnId);
  if(!rec || rec.cancelled) return;
  if(!confirm(t('return_confirm_cancel'))) return;
  rec.cancelled = true;
  await safePut('returns', rec.id, rec);

  const product = db.products[rec.productId];
  if(product){ product.qty = Math.max(0, Number(product.qty) - rec.qty); await safePut('products', rec.productId, product); }

  const adjustments = rec.adjustments && rec.adjustments.length ? rec.adjustments : [{saleId: rec.saleId, amount: rec.dueAdjust}];
  for(const adj of adjustments){
    const s = db.sales.find(x=>x.id===adj.saleId);
    if(s){ s.due = Number(s.due) + Number(adj.amount); await safePut('sales', s.id, s); }
  }
  const sale = db.sales.find(s=>s.id===rec.saleId);
  if(sale && sale.customerId && db.customers[sale.customerId]){
    const cust = db.customers[sale.customerId];
    cust.due = Number(cust.due) + Number(rec.dueAdjust);
    cust.refundOwed = Math.max(0, Number(cust.refundOwed||0) - Number(rec.excessRefund));
    await safePut('customers', sale.customerId, cust);
  }
  if(sale && sale.groupMemberId && db.groupMembers[sale.groupMemberId]){
    const member = db.groupMembers[sale.groupMemberId];
    member.due = calculateGroupMemberDueFromLedger(sale.groupMemberId);
    await safePut('groupMembers', sale.groupMemberId, member);
  }
  renderNav();
  renderPage();
  if(document.getElementById('saleViewOverlay').classList.contains('open') && sale) openSaleView(sale.id);
}

async function deleteReturn(returnId){
  if(!requirePermission('delete_records'))return;
  const rec = db.returns.find(r=>r.id===returnId);
  if(!rec) return;
  await new Promise(resolve=>{
    showDeleteConfirm(
      t('del_title_return'),
      '"'+escapeHtml(rec.customerName||'')+'"'+t('del_msg_confirm'),
      resolve
    );
  });

  if(!rec.cancelled){
    // still active — reverse its stock/due effects first, same as cancelling
    const product = db.products[rec.productId];
    if(product){ product.qty = Math.max(0, Number(product.qty) - rec.qty); await safePut('products', rec.productId, product); }

    const adjustments = rec.adjustments && rec.adjustments.length ? rec.adjustments : [{saleId: rec.saleId, amount: rec.dueAdjust}];
    for(const adj of adjustments){
      const s = db.sales.find(x=>x.id===adj.saleId);
      if(s){ s.due = Number(s.due) + Number(adj.amount); await safePut('sales', s.id, s); }
    }
    const sale = db.sales.find(s=>s.id===rec.saleId);
    if(sale && sale.customerId && db.customers[sale.customerId]){
      const cust = db.customers[sale.customerId];
      cust.due = Number(cust.due) + Number(rec.dueAdjust);
      cust.refundOwed = Math.max(0, Number(cust.refundOwed||0) - Number(rec.excessRefund));
      await safePut('customers', sale.customerId, cust);
    }
  }

  db.returns = db.returns.filter(r=>r.id!==returnId);
  await safeRemove('returns', returnId);
  renderNav();
  renderPage();
  if(document.getElementById('saleViewOverlay').classList.contains('open')){
    const sale = db.sales.find(s=>s.id===rec.saleId);
    if(sale) openSaleView(sale.id);
  }
}

  const prevPayVal = paySel.value || 'cash';
  paySel.innerHTML = `
    <option value="cash">${t('payment_cash')}</option>
    <option value="bank">${t('payment_bank')}</option>
    <option value="mobile_banking">${t('payment_mobile_banking')}</option>
  `;
  paySel.value = prevPayVal;
  document.getElementById('msCancelBtn').textContent = t('cancel');
  document.getElementById('msSaveBtn').textContent = t('save');
  document.getElementById('msAddRowBtn').textContent = t('ms_add_row');

  document.getElementById('msCustomer').value = '';
  document.getElementById('msCustomerId').value = '';
  const custResultsEl = document.getElementById('msCustomerResults');
  if(custResultsEl){ custResultsEl.classList.remove('open'); custResultsEl.innerHTML=''; }
  // Group dropdown populate
  const gsEl = document.getElementById('msGroupSelect');
  if(gsEl){
    const grpOpts = Object.entries(db.groups).map(([gid,g])=>'<option value="'+gid+'">'+escapeHtml(g.name)+(g.memberName?' ('+escapeHtml(g.memberName)+')':'')+'</option>').join('');
    gsEl.innerHTML = '<option value="">'+t('grp_no_group')+'</option>'+grpOpts;
    gsEl.value = '';
  }
  const gmEl = document.getElementById('msGroupMemberSelect');
  if(gmEl){
    const memberOpts = Object.entries(db.groupMembers)
      .sort((a,b)=>Number(a[1].memberNo||0)-Number(b[1].memberNo||0))
      .map(([mid,m])=>`<option value="${mid}">${m.memberNo?'#'+escapeHtml(String(m.memberNo))+' — ':''}${escapeHtml(m.name||'')}</option>`).join('');
    gmEl.innerHTML = `<option value="">— ${t('select_group_agent')} —</option>${memberOpts}`;
    gmEl.value = '';
  }
  onMsBuyerTypeChange();

  document.getElementById('msRows').innerHTML = '';

  if(msEditInvoiceId){
    const groupSales = db.sales.filter(s=>s.invoiceId===msEditInvoiceId);
    if(groupSales.length===0){ msEditInvoiceId = null; }
    else{
      const plan = db.installmentPlans.find(p=>p.invoiceId===msEditInvoiceId);
      const hasPaidInstallments = plan && plan.items.some(it=>it.status==='paid');
      if(hasPaidInstallments){
        alert(t('inst_already_started'));
        msEditInvoiceId = null;
      } else {
        const first = groupSales[0];
        msEditInvoiceNo = first.invoiceNo || null;
        buyerTypeEl.value = (first.buyerType==='group_agent' || first.groupMemberId) ? 'group_agent' : 'customer';
        selectMsCustomer(first.customerId || '');
        if(gmEl) gmEl.value = first.groupMemberId || '';
        if(gsEl) gsEl.value = first.groupId || '';
        onMsBuyerTypeChange();
        document.getElementById('msDate').value = first.date;
        document.getElementById('msVoucher').value = first.voucherNo || '';
        document.getElementById('msVoucherTag').value = first.voucherTag || '';
        document.getElementById('msPaymentSystem').value = first.paymentSystem || 'cash';
        refreshPaymentAccountSelect('msPaymentSystem','msPaymentAccount',first.paymentAccountId||'');
        // msIsOldEntry always false (old entry hidden)
        document.getElementById('msPaid').value = groupSales.reduce((s,x)=>s+Number(x.paid),0);
        document.getElementById('msInstCount').value = plan ? plan.count : '';
        groupSales.forEach(sale => addMultiSaleRow(sale));
        document.getElementById('multiSaleOverlay').classList.add('open');
        return;
      }
    }
  }
  msEditInvoiceNo = null;
  document.getElementById('msPaid').value = 0;
  document.getElementById('msInstCount').value = '';
  document.getElementById('msDate').value = todayStr();
  document.getElementById('msVoucher').value = '';
  document.getElementById('msVoucherTag').value = '';
  document.getElementById('msPaymentSystem').value = 'cash';
  refreshPaymentAccountSelect('msPaymentSystem','msPaymentAccount');
  // msIsOldEntry always false
  addMultiSaleRow();
  document.getElementById('multiSaleOverlay').classList.add('open');
}
