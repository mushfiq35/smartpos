<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হজ্জ এজেন্সি ম্যানেজমেন্ট সিস্টেম</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" defer crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" defer crossorigin="anonymous"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ============================================================
   🎨 THEME CONFIG — এখানে ৫টা রং বদলালেই পুরো theme বদলে যাবে
   ============================================================

   C1 = Primary (sidebar, main buttons, stat cards)
   C2 = Primary Dark (sidebar gradient top, dark cards)
   C3 = Accent / Gold (highlight, active nav, CTA button)
   C4 = Background (page background)
   C5 = Surface (card/panel background)

   উদাহরণ (বর্তমান — সবুজ+সোনালি হজ্জ থিম):
   C1=#1B6B3A  C2=#0f3d20  C3=#C49A2F  C4=#F4F9F4  C5=#E8F4E8

   নীল থিমের জন্য:
   C1=#1a5fa8  C2=#0d3d75  C3=#f0a500  C4=#F0F6FF  C5=#E0EEFF

   লাল থিমের জন্য:
   C1=#b42020  C2=#7a1010  C3=#f0a500  C4=#FFF5F5  C5=#FFE8E8
   ============================================================ */

:root{
  --c1: #1B6B3A;   /* Primary */
  --c2: #0f3d20;   /* Primary Dark */
  --c3: #C49A2F;   /* Accent / Gold */
  --c4: #F4F9F4;   /* Background */
  --c5: #E8F4E8;   /* Surface / Card */

  /* ── নিচের কিছু বদলাবেন না ── */
  --c1-light: color-mix(in srgb, var(--c1) 20%, white);
  --c1-dark: color-mix(in srgb, var(--c1) 80%, black);
  --c3-light: color-mix(in srgb, var(--c3) 15%, white);

  --paper:var(--c4); --paper-card:var(--c5); --ink:#1A2E1A; --ink-soft:#4a6741;
  --line: color-mix(in srgb, var(--c1) 30%, white);
  --amber:var(--c1); --amber-deep:var(--c2);
  --green:var(--c1); --green-bg:var(--c5); --red:#B4423A; --red-bg:#F6E4E2;
  --blue:#2E6B8A; --blue-bg:#E2EEF2; --gold:var(--c3); --gold-bg:var(--c3-light);
  --hajj-green:var(--c1); --hajj-gold:var(--c3); --hajj-green-dark:var(--c2);
  --hajj-green-light:var(--c5); --hajj-gold-light:var(--c3-light);
  --sidebar-w:235px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;overflow-x:hidden;max-width:100%;width:100%;}
.app{display:flex;min-height:100vh;max-width:100%;overflow-x:hidden;width:100%;}

/* Sidebar */
.sidebar{
  width:var(--sidebar-w);background:linear-gradient(180deg,var(--c2) 0%,var(--c1) 100%);color:var(--paper);
  position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:40;
  transition:transform 0.25s ease;
}
.sidebar .logo{padding:20px 18px 14px;border-bottom:1px solid rgba(250,246,236,0.12);}
.sidebar .logo h1{font-family:'Roboto Slab',serif;font-size:19px;margin:0;color:var(--paper);}
.sidebar .logo p{margin:2px 0 0;font-size:11px;color:rgba(250,246,236,0.55);}
.newsale-btn{
  margin:14px 18px;padding:9px 0;text-align:center;background:var(--hajj-gold);color:#fff;
  border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;width:calc(100% - 36px);
}
.nav{padding:6px 10px 20px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;
  color:rgba(250,246,236,0.75);font-size:14px;font-weight:500;cursor:pointer;
  border-left:3px solid transparent;margin-bottom:2px;
}
.nav-item:hover{background:rgba(250,246,236,0.06);}
.nav-item.active{background:rgba(196,154,47,0.25);color:#fff;border-left-color:var(--hajj-gold);}
.nav-item .ic{font-size:16px;width:18px;text-align:center;}
.nav-item .badge{
  margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-family:'IBM Plex Mono';
  padding:1px 6px;border-radius:10px;
}

.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:35;}

/* Main */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;overflow-x:hidden;max-width:100%;box-sizing:border-box;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;border-bottom:1px solid var(--line);background:var(--paper);
  position:sticky;top:0;z-index:20;
}
.topbar .page-title{font-family:'Roboto Slab',serif;font-size:22px;font-weight:700;}
.topbar .crumb{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.hamburger{display:none;background:none;border:1px solid var(--line);border-radius:6px;width:36px;height:36px;font-size:16px;cursor:pointer;}
.content{padding:22px 24px 80px;overflow-x:hidden;}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{
  border-radius:10px;padding:16px 18px;color:#fff;box-shadow:0 1px 0 rgba(43,38,32,0.06);
}
.stat-card .val{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;line-height:1.1;}
.stat-card .lbl{font-size:12px;opacity:0.9;margin-top:4px;}
.stat-card.c1{background:var(--c1);} .stat-card.c2{background:#2E6B8A;}
.stat-card.c3{background:var(--c2);} .stat-card.c4{background:var(--c3);color:#1A2E1A;}
.stat-card.c5{background:var(--c1);} .stat-card.c6{background:#2E6B8A;}
.stat-card.c7{background:var(--red);} .stat-card.c8{background:#4a6741;}
.stat-card.hajj-gold{background:var(--hajj-gold);color:#1A2E1A;}
.stat-card.hajj-green{background:var(--hajj-green);}
.stat-card.hajj-dark{background:var(--hajj-green-dark);}
.stat-card.hajj-blue{background:#2E6B8A;}

/* Groups/Agent statement: large currency values must stay inside their cards. */
.agent-statement-panel{overflow-x:hidden;max-width:100%;min-width:0;}
.agent-statement-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;
  margin-bottom:18px;width:100%;max-width:100%;
}
.agent-statement-grid .stat-card{min-width:0;overflow:hidden;padding:15px 14px;}
.agent-statement-grid .stat-card .val{
  display:block;max-width:100%;font-size:clamp(17px,1.45vw,23px);
  letter-spacing:-0.045em;white-space:nowrap;overflow:hidden;text-overflow:clip;
}
.agent-statement-grid .stat-card .lbl{line-height:1.25;overflow-wrap:anywhere;}
.agent-statement-table-wrap{display:block;width:100%;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;}
.agent-statement-table-wrap table.data{min-width:820px;}
.agent-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;}
.agent-tab-btn{background:#fff;color:var(--ink);border:1px solid var(--line);}
.agent-tab-btn.active{background:var(--hajj-green);color:#fff;border-color:var(--hajj-green);}
.agent-quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.agent-balance-due{color:var(--red);font-weight:800;}
.agent-balance-advance{color:var(--green);font-weight:800;}
.agent-head-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:7px;margin-top:7px;background:var(--paper);}
.opening-side-receivable{color:var(--red);font-weight:700;}
.opening-side-advance{color:var(--green);font-weight:700;}
.asset-card-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px;}
.asset-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;overflow:hidden;}
.asset-card small{display:block;color:var(--ink-soft);margin-bottom:5px;}.asset-card strong{font-family:'IBM Plex Mono',monospace;font-size:19px;overflow-wrap:anywhere;}
@media(max-width:900px){.asset-card-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:480px){.asset-card-grid{grid-template-columns:1fr;}}

@media (max-width:1100px){
  .agent-statement-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media (max-width:760px){
  .agent-statement-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .agent-statement-grid .stat-card .val{font-size:18px !important;}
}
@media (max-width:420px){
  .agent-statement-grid{grid-template-columns:1fr;}
  .agent-statement-grid .stat-card .val{font-size:20px !important;}
}

.panel{background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;overflow-x:auto;}
.panel h3{font-family:'Roboto Slab',serif;margin:0 0 14px;font-size:16px;}
.erp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start;}
.erp-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0;}
.erp-card h3{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;}
.account-item{border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:10px;background:var(--paper);}
.account-item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.account-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;}
.account-metrics div{background:var(--paper-card);border-radius:6px;padding:7px;min-width:0;overflow:hidden;}
.account-metrics small{display:block;color:var(--ink-soft);font-size:10px;}.account-metrics strong{font-size:12px;overflow-wrap:anywhere;}
.ledger-type-receivable{color:var(--green);font-weight:700}.ledger-type-payable{color:var(--red);font-weight:700}
@media (max-width:850px){.erp-grid{grid-template-columns:1fr;}.account-metrics{grid-template-columns:1fr 1fr 1fr;}}
@media (max-width:440px){.account-metrics{grid-template-columns:1fr;}}

/* Toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.toolbar input, .toolbar select{
  font-family:'Inter';font-size:14px;padding:9px 12px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink);
}
.toolbar input[type="text"]{flex:1;min-width:160px;}
.btn{font-family:'Inter';font-weight:600;font-size:14px;padding:9px 16px;border-radius:6px;border:none;cursor:pointer;background:var(--ink);color:var(--paper);}
.btn.amber{background:var(--hajj-gold);color:#fff;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.small{padding:6px 10px;font-size:12px;}

/* Table */
#pgTableWrap{overflow-x:auto;}
#instPageList{overflow-x:auto;}
#returnsPageList{overflow-x:auto;}
#travelAdjustmentList{overflow-x:auto;}
#custReportList{overflow-x:auto;}
#suppReportList{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:14px;}
table.data th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line);}
table.data td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
table.data th{white-space:nowrap;}
table.data tr.low td{background:var(--red-bg);}
table.data tr:hover td{background:rgba(27,107,58,0.06);}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.pill.green{background:var(--green-bg);color:var(--green);}
.pill.red{background:var(--red-bg);color:var(--red);}
.pill.blue{background:var(--blue-bg);color:var(--blue);}
.pill.gold{background:var(--gold-bg);color:#765900;}
.adjustment-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px;}
.adjustment-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;overflow:hidden;}
.adjustment-card .ac-label{font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.adjustment-card .ac-value{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;margin-top:5px;overflow-wrap:anywhere;}
.form-section{border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:14px;background:rgba(255,255,255,.55);}
.form-section-title{font-family:'Roboto Slab',serif;font-size:14px;font-weight:700;margin:0 0 11px;color:var(--c2);}
.net-refund-box{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:8px;padding:12px 14px;background:var(--c2);color:#fff;margin-top:4px;}
.net-refund-box strong{font-family:'IBM Plex Mono',monospace;font-size:22px;}
.pre-reg-progress{height:8px;background:var(--line);border-radius:20px;overflow:hidden;min-width:100px;}
.pre-reg-progress span{display:block;height:100%;background:var(--c1);border-radius:20px;}
.pre-reg-batch-row{cursor:pointer;}.pre-reg-batch-row:hover td{background:rgba(27,107,58,.08)!important;}
.pre-reg-status-active{background:var(--green-bg);color:var(--green);}.pre-reg-status-pending{background:var(--gold-bg);color:#765900;}
.pre-reg-status-cancelled{background:var(--red-bg);color:var(--red);}.pre-reg-status-transferred{background:var(--blue-bg);color:var(--blue);}.pre-reg-status-package{background:var(--c2);color:#fff;}
.returns-workspace-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}.returns-workspace-tabs .active{background:var(--c1);color:#fff;border-color:var(--c1);}
.actions-cell{display:flex;gap:6px;flex-wrap:nowrap;white-space:nowrap;align-items:center;}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{border-color:var(--ink);}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:10px;}
.empty .big{font-family:'Roboto Slab',serif;font-size:18px;color:var(--ink);margin-bottom:6px;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(43,38,32,0.4);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--paper);border-radius:10px;padding:24px;width:100%;max-width:420px;border:1px solid var(--line);max-height:92vh;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;}
.modal h2{font-family:'Roboto Slab',serif;margin:0 0 16px;font-size:19px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em;}
.field input, .field select, .field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-family:'Inter';font-size:14px;background:#fff;color:var(--ink);}
.field-row{display:flex;gap:10px;flex-wrap:wrap;}
.field-row .field{flex:1;min-width:120px;}
.field-hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

.loading{text-align:center;padding:60px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.app-footer{
  text-align:center;padding:16px 24px 24px;font-size:12px;color:var(--ink-soft);
  border-top:1px solid var(--line);margin-top:20px;
}

/* Storage status banner */
.storage-banner{
  padding:10px 24px;font-size:13px;display:flex;align-items:center;gap:8px;
}
.storage-banner.warn{background:var(--gold-bg);color:var(--amber-deep);border-bottom:1px solid var(--line);}
.storage-banner.ok{background:var(--green-bg);color:var(--green);border-bottom:1px solid var(--line);}
.storage-banner a{color:inherit;font-weight:600;}

/* Toast */
.toast{
  position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;opacity:0;
  transition:opacity 0.3s ease;pointer-events:none;
}
.toast.show{opacity:1;}

/* Reports mini bars */
.rbar-row{display:grid;grid-template-columns:90px 1fr 90px;gap:10px;align-items:center;padding:6px 0;font-size:13px;}
.rbar-track{background:var(--line);border-radius:4px;height:10px;overflow:hidden;}
.rbar-fill{height:100%;background:var(--hajj-gold);}

@media (max-width:900px){
  .adjustment-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .rpt-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop.open{display:block;}
  .main{margin-left:0;}
  .hamburger{display:block;}
  .dash-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .dash-two-col{grid-template-columns:1fr !important;}
  .dash-summary-grid{grid-template-columns:repeat(2,1fr) !important;}
  .dash-banner-boxes{flex-direction:row;flex-wrap:wrap;}
}
@media (max-width:480px){.adjustment-grid{grid-template-columns:1fr;}}
@media (max-width:800px){
  .dash-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .dash-two-col{grid-template-columns:1fr !important;}
  .content{padding:16px 12px 60px;}
  .rpt-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
}
@media (max-width:600px){
  .dash-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .rpt-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .dash-two-col{grid-template-columns:1fr !important;}
  .stat-card .val{font-size:20px;}
  .content{padding:12px 10px 60px;}
}
@media (max-width:480px){
  .dash-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .rpt-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .dash-two-col{grid-template-columns:1fr !important;}
  .dash-banner{padding:14px 12px !important;}
  .dash-banner-title{font-size:16px !important;}
  .stat-card .val{font-size:18px;}
  .stat-card{padding:12px 10px !important;}
  .content{padding:12px 10px 60px !important;}
  .topbar{padding:0 10px !important;}
  .panel{padding:12px 10px !important;}
  table.data{font-size:11px;}
  table.data th, table.data td{padding:6px 4px !important;}
  .toolbar{flex-wrap:wrap;gap:6px !important;}
  .toolbar input, .toolbar select{font-size:13px;}
  .btn{padding:7px 10px;font-size:12px;}
  .topbar-title{font-size:16px !important;}
  .topbar-sub{font-size:11px !important;}
  .ov-two-col{grid-template-columns:1fr !important;}
  /* Group modals */
  .modal{padding:16px !important;border-radius:8px;}
  .modal h2{font-size:16px !important;}
  #grpHajjiOverlay .modal{max-width:100% !important;}
  #gmFormOverlay .modal, #grpFormOverlay .modal{max-width:100% !important;}
  /* Group list tables overflow */
  #gmBody, #grpBody, #grpRptBody{overflow-x:auto;}
  /* Hajji manager popup */
  #ghResults, #ghAssigned{max-height:150px !important;}
}
@media (max-width:440px){
  .dash-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .stat-card{padding:10px 8px !important;}
  .stat-card .val{font-size:16px !important;}
  .stat-card .lbl{font-size:10px !important;}
  .stat-card div:first-child{font-size:18px !important;}
  .content{padding:10px 8px 60px !important;}
  .panel{padding:10px 8px !important;}
}
@media (max-width:390px){
  .dash-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .dash-banner-title{font-size:15px !important;}
  .dash-banner{padding:12px 10px !important;}
  .stat-card .val{font-size:15px !important;}
  .stat-card{padding:8px !important;}
  .content{padding:8px 8px 60px !important;}
}
@media (max-width:375px){
  .dash-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .stat-card .val{font-size:14px !important;}
  .stat-card .lbl{font-size:9px !important;}
  .stat-card{padding:8px 6px !important;}
  .panel{padding:8px 6px !important;}
  .content{padding:6px 6px 60px !important;}
}
@media (max-width:360px){
  .dash-stat-grid{grid-template-columns:repeat(2,1fr) !important;}
  .stat-card .val{font-size:14px !important;}
  .stat-card .lbl{font-size:9px !important;}
  .dash-banner-title{font-size:14px !important;}
  .main{padding:6px 4px !important;}
  .content{padding:8px 6px 60px !important;}
  .panel{padding:8px 6px !important;}
}

function permissionsForUser(user){
  if(!user)return ROLE_PERMISSIONS.staff.slice();
  if(user.role==='super')return USER_PERMISSION_CATALOG.map(x=>x.key);
  const list=Array.isArray(user.permissions)?user.permissions.slice():(ROLE_PERMISSIONS[user.role]||[]).slice();

  // separate View and Create permissions without locking out existing users.
  if(list.includes('daily_ops')){if(!list.includes('view_daily'))list.push('view_daily');if(!list.includes('create_records'))list.push('create_records');}
  return list.filter(x=>USER_PERMISSION_CATALOG.some(p=>p.key===x));
}

   বসান — না বসালে Backup/Restore বাটন কাজ করবে না। */
const googleClientId = "828265788753-3jihsgrb36s6nanln1e7v1lv7d02e3ov.apps.googleusercontent.com";
let gisTokenClient = null;
let gisAccessToken = null;
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

function initGoogleDrive(retriesLeft){
  try{
    retriesLeft = retriesLeft === undefined ? 20 : retriesLeft;
    const configured = googleClientId && googleClientId !== "YOUR_GOOGLE_CLIENT_ID";
    const row = document.getElementById('backupRow');
    if(!configured){
      if(row) row.style.display = 'none';
      return;
    }
    if(!window.google || !google.accounts || !google.accounts.oauth2){
      if(retriesLeft > 0) setTimeout(() => initGoogleDrive(retriesLeft-1), 250);
      return;
    }
    gisTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: googleClientId,
      scope: DRIVE_SCOPE,
      callback: ''
    });
    if(row) row.style.display = 'flex';
  }catch(e){
    console.error('Google Drive init failed (non-fatal)', e);
  }
}

function requestDriveToken(onReady){
  if(!gisTokenClient) return;
  gisTokenClient.callback = (resp) => {
    if(resp.error){ console.error('drive auth failed', resp); showToast(t('drive_auth_failed')); return; }
    gisAccessToken = resp.access_token;
    onReady();
  };
  gisTokenClient.requestAccessToken({ prompt: gisAccessToken ? '' : 'consent' });
}

async function backupToDrive(){
  if(!isSuperUser()){alert('⛔ Backup শুধুমাত্র Super User করতে পারবেন।');return;}
  requestDriveToken(async () => {
    try{
      const payload = JSON.stringify({...db, exportedAt: new Date().toISOString()}, null, 2);
      const fileName = `${SHOP_NAME}-backup-${todayStr()}-${Date.now()}.json`;
      const metadata = { name: fileName, mimeType: 'application/json' };
      const boundary = 'maxbackupboundary';
      const body =
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n` +
        `--${boundary}--`;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + gisAccessToken,
          'Content-Type': `multipart/related; boundary="${boundary}"`
        },
        body
      });
      if(!res.ok) throw new Error('upload failed: ' + res.status);
      showToast(t('backup_success'));
    }catch(e){
      console.error('backup failed', e);
      showToast(t('backup_failed'));
    }
  });
}

async function restoreFromDrive(){
  if(!isSuperUser()){alert('⛔ Restore শুধুমাত্র Super User করতে পারবেন।');return;}
  requestDriveToken(async () => {
    try{
      const q = encodeURIComponent(`name contains '${SHOP_NAME}-backup-' and mimeType='application/json' and trashed=false`);
      const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime desc&fields=files(id,name,createdTime)`, {
        headers: { 'Authorization': 'Bearer ' + gisAccessToken }
      });
      const listData = await listRes.json();
      const files = listData.files || [];
      if(files.length===0){ alert(t('no_backups_found')); return; }
      const options = files.map((f,i)=>`${i+1}. ${f.name}`).join('\n');
      const choice = prompt(t('choose_backup_prompt') + '\n' + options, '1');
      const idx = Number(choice)-1;
      if(isNaN(idx) || idx<0 || idx>=files.length) return;
      const fileId = files[idx].id;
      const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { 'Authorization': 'Bearer ' + gisAccessToken }
      });
      const backupData = await fileRes.json();
      if(!confirm(t('confirm_restore'))) return;
      for(const key of ['appUsers','customers','suppliers','products','categories','groupMembers','groups','bankAccounts','mobileAccounts','paymentHeads','agentLedgerHeads','assets']) for(const [rid,rec] of Object.entries(backupData[key]||{})){db[key][rid]=rec;await safePut(key,rid,rec);}

      await loadAll();
      showToast(t('restore_success'));
    }catch(e){
      console.error('restore failed', e);
      showToast(t('restore_failed'));
    }
  });

/* ---------- Firestore via plain REST API ----------
   The Firestore SDK uses a long-lived streaming connection (WebChannel) that
   some mobile networks/devices silently block, even though normal HTTPS
   requests (like Firebase Auth) go through fine. To sidestep that entirely,
   all Firestore reads/writes here use plain fetch() calls to the Firestore
   REST API instead of the SDK — the same simple request/response style Auth
   already uses successfully. */
async function firestoreRest(method, path, body){
  const user = currentAuthUser || (firebase.auth && firebase.auth().currentUser);
  if(!user) throw new Error('No authenticated user available for Firestore REST call');
  const token = await user.getIdToken();
  const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/${path}`;
  const res = await fetch(url, {
    method,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    const errText = await res.text().catch(()=>'');
    const err = new Error(`Firestore REST ${method} ${path} failed: ${res.status} ${errText}`);
    err.status = res.status;
    throw err;
  }
  if(res.status===204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function toFirestoreValue(v){
  if(v===null || v===undefined) return {nullValue: null};
  if(typeof v === 'string') return {stringValue: v};
  if(typeof v === 'boolean') return {booleanValue: v};
  if(typeof v === 'number') return Number.isInteger(v) ? {integerValue: String(v)} : {doubleValue: v};
  if(Array.isArray(v)) return {arrayValue: {values: v.map(toFirestoreValue)}};
  if(typeof v === 'object') return {mapValue: {fields: toFirestoreFields(v)}};
  return {stringValue: String(v)};
}
function toFirestoreFields(obj){
  const fields = {};
  for(const [k,val] of Object.entries(obj||{})) fields[k] = toFirestoreValue(val);
  return fields;
}
function fromFirestoreValue(v){
  if(!v) return null;
  if(v.nullValue !== undefined) return null;
  if(v.stringValue !== undefined) return v.stringValue;
  if(v.booleanValue !== undefined) return v.booleanValue;
  if(v.integerValue !== undefined) return Number(v.integerValue);
  if(v.doubleValue !== undefined) return v.doubleValue;
  if(v.arrayValue !== undefined) return (v.arrayValue.values||[]).map(fromFirestoreValue);
  if(v.mapValue !== undefined) return fromFirestoreFields(v.mapValue.fields||{});
  return null;
}
function fromFirestoreFields(fields){
  const obj = {};
  for(const [k,val] of Object.entries(fields||{})) obj[k] = fromFirestoreValue(val);
  return obj;
}

async function storageGet(key){

}
async function storageSet(key, value){

  }
}

/* Per-record collection storage: each customer/product/sale etc. is its own
   document, so two people saving different records at the same time can
   never silently overwrite each other's data. */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

async function fetchCollection(name){
  if(useFirebase){
    const out = {};
    let pageToken;
    do{
      const qs = pageToken ? `?pageSize=300&pageToken=${encodeURIComponent(pageToken)}` : `?pageSize=300`;
      const data = await withTimeout(firestoreRest('GET', `${name}${qs}`), 15000);
      (data && data.documents || []).forEach(doc => {
        const id = doc.name.split('/').pop();
        out[id] = fromFirestoreFields(doc.fields||{});
      });
      pageToken = data && data.nextPageToken;
    } while(pageToken);
    return out;
  }
  const raw = localStorage.getItem('col_'+name);
  return raw ? JSON.parse(raw) : {};
}
async function putRecord(name, id, data){
  if(useFirebase){
    await withTimeout(firestoreRest('PATCH', `${name}/${id}`, { fields: toFirestoreFields(data) }), 15000);
  } else {
    const raw = localStorage.getItem('col_'+name);
    const obj = raw ? JSON.parse(raw) : {};
    obj[id] = data;
    localStorage.setItem('col_'+name, JSON.stringify(obj));
  }
}
async function removeRecord(name, id){
  if(useFirebase){
    await withTimeout(firestoreRest('DELETE', `${name}/${id}`), 15000);
  } else {
    const raw = localStorage.getItem('col_'+name);
    const obj = raw ? JSON.parse(raw) : {};
    delete obj[id];
    localStorage.setItem('col_'+name, JSON.stringify(obj));
  }
}
async function safePut(name, id, data){
  try{ await putRecord(name, id, data); }
  catch(e){ console.error('save failed', name, id, e); showToast(t('save_failed_toast')); }
}
async function safeRemove(name, id){
  try{ await removeRecord(name, id); }
  catch(e){ console.error('delete failed', name, id, e); showToast(t('save_failed_toast')); }
}

function showToast(msg){

}

/* Global safety net: if any JS error slips through, show it visibly
   instead of silently freezing the screen — so problems are caught
   immediately instead of looking like "nothing happens". */
window.addEventListener('error', function(e){
  console.error('Unhandled error:', e.error || e.message);
  try{
    const msg = (e.error && e.error.message) ? e.error.message : String(e.message||'Unknown error');
    showToast('⚠️ কিছু একটা সমস্যা হয়েছে: '+msg);
  }catch(_){}
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled promise rejection:', e.reason);
  try{
    const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason||'Unknown error');
    showToast('⚠️ কিছু একটা সমস্যা হয়েছে: '+msg);
  }catch(_){}
});

function setupOverlayBackdropClose(overlayId, onClose){
  const el = document.getElementById(overlayId);
  if(!el) return;
  let downOnBackdrop = false;
  el.addEventListener('mousedown', (e) => { downOnBackdrop = (e.target.id===overlayId); });
  el.addEventListener('touchstart', (e) => { downOnBackdrop = (e.target.id===overlayId); }, {passive:true});
  el.addEventListener('click', (e) => {

      el.classList.remove('open');

    }

  });

function saleGrossProfit(sale){
  // Package cost: current product cost ব্যবহার করো (edit এ update হয়)
  // Fallback: sale এ save করা unitCost
  const product = db.products[sale.productId];
  const currentCost = product ? Number(product.cost||0) : Number(sale.unitCost||0);
  return (Number(sale.unitPrice) - currentCost) * Number(sale.qty) - Number(sale.discount||0);
}
function saleReturnedProfitAmount(sale){
  if(!sale || !Number(sale.qty)) return 0;
  const perUnitProfit = saleGrossProfit(sale) / Number(sale.qty);
  return perUnitProfit * saleReturnedQty(sale.id);
}

function activeCreditTransactions(id){return (db.creditTransactions||[]).filter(x=>x.facilityId===id&&!x.reversed).sort((a,b)=>String(a.date).localeCompare(String(b.date))||Number(a.ts)-Number(b.ts));}
function loanOutstanding(id){const a=loanAccount(id);if(!a)return 0;return Math.max(0,activeLoanTransactions(id).reduce((n,x)=>n+Number(x.principalDelta||0),0));}
function creditOutstanding(id){const f=creditFacility(id);if(!f)return 0;return Math.max(0,Number(f.openingOutstanding||0)+activeCreditTransactions(id).reduce((n,x)=>n+Number(x.liabilityDelta||0),0));}

function financeExpenseAmount(x){return Number(x.interest||0)+Number(x.fee||0)+(x.kind==='charge'?Number(x.principal||0):0)+(x.kind==='interest'&&!Number(x.interest||0)?Number(x.principal||0):0)+(x.kind==='fee'&&!Number(x.fee||0)?Number(x.principal||0):0);}

async function loadAll(){
  let hadError = false;
  try{db.appUsers=await fetchCollection('appUsers');}catch(e){console.error('failed to load appUsers',e);db.appUsers={};hadError=true;}
  await ensurePrimarySuperUser();
  if(currentRole()==='inactive'){
    alert(currentLang==='bn'?'আপনার ERP access বন্ধ করা হয়েছে। Super User-এর সাথে যোগাযোগ করুন।':'Your ERP access has been disabled. Contact a Super User.');
    if(useFirebase) await firebase.auth().signOut();
    return;
  }
  const objTabs = [],arrTabs=[];
  if(hasPermission('view_daily')||hasPermission('view_reports')||hasPermission('view_ledger')||hasPermission('financial_setup')){
    objTabs.push('customers','suppliers','products','categories','groupMembers','groups','agentLedgerHeads');
    arrTabs.push('purchases','sales','expenses','installments','installmentPlans','returns','vendorPayments','agentLedger','travelAdjustments','preRegBatches','preRegPilgrims');
  }else{
    db.customers={};db.suppliers={};db.products={};db.categories={};db.groupMembers={};db.groups={};db.agentLedgerHeads={};
    db.purchases=[];db.sales=[];db.expenses=[];db.installments=[];db.installmentPlans=[];db.returns=[];db.vendorPayments=[];db.agentLedger=[];db.travelAdjustments=[];db.preRegBatches=[];db.preRegPilgrims=[];db.loanAccounts=[];db.loanTransactions=[];db.creditFacilities=[];db.creditTransactions=[];
  }
  if(hasPermission('manage_accounts'))objTabs.push('bankAccounts','mobileAccounts');
  else{db.bankAccounts={};db.mobileAccounts={};}
  if(hasPermission('financial_setup')){objTabs.push('assets');arrTabs.push('openingBalances','assetEvents','loanAccounts','loanTransactions','creditFacilities','creditTransactions');}
  else{db.assets={};db.openingBalances=[];db.assetEvents=[];db.loanAccounts=[];db.loanTransactions=[];db.creditFacilities=[];db.creditTransactions=[];}
  if(hasPermission('view_ledger')){objTabs.push('paymentHeads');arrTabs.push('paymentLedger');}
  else{db.paymentHeads={};db.paymentLedger=[];}
  for(const key of [...objTabs, ...arrTabs]){
    try{
      const obj = await fetchCollection(key);
      db[key] = objTabs.includes(key) ? obj : Object.values(obj);
    }catch(e){
      console.error('failed to load', key, e);

  }
  if(hadError) showToast(t('load_error_toast'));
  try{ logoData = await withTimeout(storageGet(K.logo), 8000); }catch(e){ logoData = null; }
  renderLangSwitch();
  renderLogo();
  renderBrandTexts();
  renderCurrentUserRoleCard();
  renderNav();
  renderPage();
}

function computeTotalBalance(){
  const fromStr = SUMMARY_START_DATE;
  const toStr = todayStr();
  const inRange = (dateStr) => dateStr>=fromStr && dateStr<=toStr;
  let dp = 0, de = 0;
  db.sales.forEach(s => { if(inRange(s.date) && !s.isOldEntry && (!s.customerId||db.customers[s.customerId])) dp += Number(s.paid||0); });
  db.installments.forEach(i => { if(inRange(i.date) && !i.isOldEntry && (!i.customerId||db.customers[i.customerId])) dp += Number(i.amount||0); });
  db.expenses.forEach(e => { if(inRange(e.date) && !e.isOldEntry) de += Number(e.amount); });
  db.returns.forEach(r => { if(!r.cancelled && inRange(r.date)) de += Number(r.excessRefund||0); });
  (db.preRegBatches||[]).forEach(b=>{if(inRange(b.date))dp+=Number(b.paidAmount||0);});
  (db.travelAdjustments||[]).forEach(r=>{if(r.status==='completed'&&inRange(r.date)&&['cash','bank','mobile_banking'].includes(r.settlementMethod))de+=Number(r.netAmount||0);});
  (db.loanTransactions||[]).filter(x=>!x.reversed&&!x.openingOnly&&inRange(x.date)).forEach(x=>{(['collection','borrowed_received','borrow_more'].includes(x.kind)?dp+=Number(x.total||0):de+=Number(x.total||0));});
  (db.creditTransactions||[]).filter(x=>!x.reversed&&inRange(x.date)).forEach(x=>{if(x.kind==='draw')dp+=Number(x.total||0);if(x.kind==='payment')de+=Number(x.total||0);});
  // Vendor payments: cash out (আমরা vendor কে দিলাম)
  db.vendorPayments.forEach(vp => {
    if(!inRange(vp.date)) return;
    if(vp.type==='payment' || vp.type==='purchase_payment') de += Number(vp.amount||0);
    if(vp.type==='purchase_return' && vp.returnType==='cash') dp += Number(vp.amount||0);
  });
  return dp - de;
}

/* ---------- Vendor / Purchase Ledger ---------- */

function purchaseReturnedQty(purchaseId){
  return db.vendorPayments
    .filter(vp=>vp.type==='purchase_return' && vp.purchaseId===purchaseId)
    .reduce((s,vp)=>s+Number(vp.qty||0), 0);
}

function openVendorStatement(supplierId){
  const supplier = db.suppliers[supplierId];
  if(!supplier) return;

  // সব transaction: purchases + vendorPayments
  const purchases = db.purchases.filter(p=>p.supplierId===supplierId).sort((a,b)=>a.ts-b.ts);
  const payments = db.vendorPayments.filter(vp=>vp.supplierId===supplierId).sort((a,b)=>a.ts-b.ts);

  // মোট হিসাব
  const totalPurchased = purchases.reduce((s,p)=>s+Number(p.total),0);
  const totalPaid = db.vendorPayments
    .filter(vp=>vp.supplierId===supplierId && (vp.type==='payment'||vp.type==='purchase_payment'))
    .reduce((s,vp)=>s+Number(vp.amount),0);
  const totalReturn = db.vendorPayments
    .filter(vp=>vp.supplierId===supplierId && vp.type==='purchase_return' && vp.returnType==='cash')
    .reduce((s,vp)=>s+Number(vp.amount||0),0);
  const due = calculateSupplierBalanceFromLedger(supplierId);
  const opening=openingBalanceRecord('supplier',supplierId),openingNet=openingBalanceNet('supplier',supplierId);

  // Unified timeline
  const timeline = [
    ...(opening?[{ts:opening.ts||0,date:opening.date,type:'opening',label:openingSideLabel(opening)+(opening.reference?' — '+escapeHtml(opening.reference):''),qty:'',amount:Math.abs(openingNet),debit:openingNet>0?openingNet:0,credit:openingNet<0?Math.abs(openingNet):0,id:opening.id}]:[]),
    ...purchases.map(p=>({ts:p.ts, date:p.date, type:'purchase', label:escapeHtml(p.sector||p.productName||'—'), qty:p.qty, amount:p.total, debit:p.total, credit:0, id:p.id})),
    ...payments.map(vp=>({ts:vp.ts, date:vp.date, type:vp.type, label:vp.note||'—', qty:vp.qty||'', amount:vp.amount||0,
      debit:0,
      credit: vp.type==='payment'||vp.type==='purchase_payment'||vp.type==='purchase_return' ? vp.amount : 0,
      id:vp.id}))
  ].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||Number(a.ts||0)-Number(b.ts||0));

  // Running balance
  let running = 0;
  const rows = timeline.map(function(tx){
    if(tx.type==='opening'){running+=openingNet;}
    else if(tx.type==='purchase'){ running += tx.amount; }
    else if(tx.type==='payment'||tx.type==='purchase_payment'){ running -= tx.amount; }
    else if(tx.type==='purchase_return'){
      if(tx.returnType==='cash') running -= tx.amount||0;
      else running -= tx.amount||0; // adjust also reduces
    }
    const typePill = tx.type==='opening'
      ? '<span class="pill" style="background:var(--gold);color:#fff;font-size:10px;">OPEN</span>'
      : tx.type==='purchase'
      ? '<span class="pill" style="background:#2E6B8A;color:#fff;font-size:10px;">'+t('vnd_type_purchase')+'</span>'
      : tx.type==='purchase_return'
        ? '<span class="pill red" style="font-size:10px;">'+t('vnd_type_return')+'</span>'
        : '<span class="pill green" style="font-size:10px;">'+t('vnd_type_payment')+'</span>';
    const debitCell = tx.debit>0 ? '<span style="color:var(--red);">৳'+money(tx.debit)+'</span>' : '—';
    const creditCell = tx.credit>0 ? '<span style="color:var(--green);">৳'+money(tx.credit)+'</span>' : '—';
    const balCell = running>0
      ? '<span style="color:var(--red);">৳'+money(running)+'</span>'
      : running<0
        ? '<span style="color:var(--green);">'+t('lbl_advance')+' ৳'+money(Math.abs(running))+'</span>'
        : '<span style="color:var(--green);">'+t('lbl_clear')+'</span>';
    const delBtn = (tx.type==='payment'||tx.type==='purchase_return')
      ? '<button class="icon-btn" data-vpdel="'+tx.id+'" title="Delete" style="font-size:11px;">🗑️</button>' : '';
    return '<tr>'
      +'<td style="font-size:12px;">'+formatDateDMY(tx.date)+'</td>'
      +'<td>'+typePill+'</td>'
      +'<td style="font-size:12px;">'+tx.label+(tx.qty?' ('+tx.qty+')':'')+'</td>'
      +'<td>'+debitCell+'</td>'
      +'<td>'+creditCell+'</td>'
      +'<td><strong>'+balCell+'</strong></td>'
      +'<td class="actions-cell no-print">'+delBtn+'</td>'
      +'</tr>';
  }).join('');

  const dueColor = due>0?'#B4423A':due<0?'#1B6B3A':'#4a6741';
  const dueLabel = due>0?t('vnd_due'):due<0?t('vnd_advance'):t('vnd_clear');

  const c = document.getElementById('content');
  c.innerHTML =
    '<div class="no-print" style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;">'
    +'<button class="btn" onclick="renderListPage(\'suppliers\')">← '+t('nav_suppliers')+'</button>'
    +'<button class="btn ghost" style="margin-left:auto;" onclick="safePrintPage()">'+t('print_report')+'</button>'
    +'</div>'

    +'<div class="panel" style="background:linear-gradient(135deg,#0f3d20,#1B6B3A);color:#fff;margin-bottom:16px;">'
    +'<div style="font-size:20px;font-weight:700;">🏢 '+escapeHtml(supplier.name)+'</div>'
    +(supplier.phone?'<div style="opacity:0.75;font-size:13px;margin-top:4px;">📞 '+escapeHtml(supplier.phone)+'</div>':'')
    +'<div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;">'
    +'<div style="background:rgba(255,255,255,0.12);border-radius:8px;padding:10px 16px;text-align:center;">'
    +'<div style="font-size:18px;font-weight:700;">৳'+money(totalPurchased)+'</div>'
    +'<div style="font-size:11px;opacity:0.8;">'+t('vnd_total_purchase')+'</div></div>'
    +'<div style="background:rgba(255,255,255,0.12);border-radius:8px;padding:10px 16px;text-align:center;">'
    +'<div style="font-size:18px;font-weight:700;">৳'+money(totalPaid+totalReturn)+'</div>'
    +'<div style="font-size:11px;opacity:0.8;">'+t('vnd_total_paid')+'</div></div>'
    +'<div style="background:'+(due>0?'rgba(180,66,58,0.6)':'rgba(27,107,58,0.5)')+';border-radius:8px;padding:10px 16px;text-align:center;">'
    +'<div style="font-size:18px;font-weight:700;">৳'+money(Math.abs(due))+'</div>'
    +'<div style="font-size:11px;opacity:0.8;">'+dueLabel+'</div></div>'
    +'</div></div>'

    +'<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;" class="no-print">'
    +'<button class="btn amber" onclick="openVendorPayForm(\''+supplierId+'\')">'+t('vnd_pay_btn')+'</button>'
    +'<button class="btn" style="border:1px solid var(--line);" onclick="openPurchaseReturnForVendor(\''+supplierId+'\')">'+t('vnd_return_btn')+'</button>'
    +'</div>'

    +'<div class="panel" style="overflow-x:auto;">'
    +'<h3>'+t('vnd_history')+'</h3>'
    +(timeline.length===0
      ? '<div class="empty">'+t('vnd_no_history')+'</div>'
      : '<table class="data"><thead><tr>'
        +'<th>'+t('col_date')+'</th><th>'+t('hdr_type')+'</th><th>'+t('hdr_desc')+'</th>'
        +'<th>'+t('col_debit')+'</th><th>'+t('col_credit')+'</th><th>'+t('hdr_balance')+'</th><th class="no-print"></th>'
        +'</tr></thead><tbody>'+rows+'</tbody></table>'
    )
    +'</div>';

  // Delete payment/return
  c.querySelector('.panel').onclick = async function(e){
    const delBtn = e.target.closest('[data-vpdel]');
    if(!delBtn) return;
    if(!requirePermission('delete_records'))return;
    if(!confirm(t('vnd_del_payment'))) return;
    const vpId = delBtn.dataset.vpdel;
    const vp = db.vendorPayments.find(x=>x.id===vpId);
    if(!vp) return;
    // Reverse effects
    if(vp.type==='payment'||vp.type==='purchase_payment'){
      supplier.due = Number(supplier.due||0) + Number(vp.amount);
      await safePut('suppliers', supplierId, supplier);
    } else if(vp.type==='purchase_return'){
      // Stock ফিরিয়ে দাও
      const prod = db.products[vp.productId];
      if(prod){ prod.qty = Number(prod.qty) + Number(vp.qty||0); await safePut('products', vp.productId, prod); }
      // due adjust
      supplier.due = Number(supplier.due||0) + Number(vp.amount||0);
      await safePut('suppliers', supplierId, supplier);
      // purchase due restore
      const pur = db.purchases.find(x=>x.id===vp.purchaseId);
      if(pur){ pur.due = Number(pur.due||0) + Number(vp.amount||0); await safePut('purchases', pur.id, pur); }
    }
    db.vendorPayments = db.vendorPayments.filter(x=>x.id!==vpId);
    await safeRemove('vendorPayments', vpId);
    showToast(t('deleted_toast'));
    openVendorStatement(supplierId);
  };
  applyRoleUi();
}

function openVendorPayForm(supplierId){
  if(!requirePermission('create_records'))return;
  const supplier = db.suppliers[supplierId];
  if(!supplier) return;
  const due = calculateSupplierBalanceFromLedger(supplierId);

  const html = '<div class="overlay open" id="vndPayOverlay" style="z-index:120;">'
    +'<div class="modal" style="max-width:400px;">'
    +'<h2>'+t('vnd_pay_title')+' — '+escapeHtml(supplier.name)+'</h2>'
    +(due>0?'<div style="background:var(--red-bg);border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:13px;">'+t('vnd_due')+': <strong>৳'+money(due)+'</strong></div>':'')
    +(due<=0?'<div style="background:var(--green-bg);border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:13px;">'+t('vnd_advance')+': <strong>৳'+money(Math.abs(due))+'</strong></div>':'')
    +'<div class="field"><label>'+t('vnd_pay_amount')+' <span style="color:var(--red)">*</span></label>'
    +'<input type="number" id="vndPayAmt" value="'+Math.max(0,due)+'" min="0" step="any"></div>'
    +'<div class="field"><label>'+t('f_payment_system')+'</label><select id="vndPayMethod"><option value="cash">'+t('payment_cash')+'</option><option value="bank">'+t('payment_bank')+'</option><option value="mobile_banking">'+t('payment_mobile_banking')+'</option></select></div>'
    +'<div class="field" id="vndPayAccountField"><label>'+t('f_payment_account')+'</label><select id="vndPayAccount"></select></div>'
    +'<div class="field"><label>'+t('col_date')+'</label>'
    +'<input type="date" id="vndPayDate" value="'+todayStr()+'"></div>'
    +'<div class="field"><label>'+t('vnd_pay_note')+'</label>'
    +'<input type="text" id="vndPayNote" placeholder="যেমন: বিকাশ, ব্যাংক ট্রান্সফার..."></div>'
    +'<div style="display:flex;gap:10px;margin-top:16px;">'
    +'<button class="btn" id="vndPayCancel">'+t('cancel')+'</button>'
    +'<button class="btn amber" id="vndPaySave">'+t('save')+'</button>'
    +'</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('vndPayMethod').onchange=()=>refreshPaymentAccountSelect('vndPayMethod','vndPayAccount');
  refreshPaymentAccountSelect('vndPayMethod','vndPayAccount');
  document.getElementById('vndPayCancel').onclick = ()=>document.getElementById('vndPayOverlay').remove();
  document.getElementById('vndPaySave').onclick = async function(){
    const amt = Number(document.getElementById('vndPayAmt').value);
    const date = document.getElementById('vndPayDate').value;
    const note = document.getElementById('vndPayNote').value.trim();
    if(!amt||amt<=0){ alert(t('qa_name_required')); return; }
    const paymentSystem=document.getElementById('vndPayMethod').value;
    const paymentAccountId=document.getElementById('vndPayAccount').value||null;
    if(!validatePaymentAccount(paymentSystem,paymentAccountId)) return;
    // Supplier due কমাও
    supplier.due = Number(supplier.due||0) - amt;
    await safePut('suppliers', supplierId, supplier);
    // Payment record
    const vp = { id:uid(), supplierId, supplierName:supplier.name, type:'payment',
      amount:amt, note:note||'Payment', paymentSystem,paymentAccountId,paymentAccountName:paymentAccountLabel(paymentAccountId),date, ts:Date.now() };
    db.vendorPayments.push(vp);
    await safePut('vendorPayments', vp.id, vp);
    supplier.due=calculateSupplierBalanceFromLedger(supplierId);await safePut('suppliers',supplierId,supplier);
    document.getElementById('vndPayOverlay').remove();
    showToast(t('saved_toast'));
    openVendorStatement(supplierId);
  };
}

function openPurchaseReturnForVendor(supplierId){

    +'<div style="display:flex;gap:10px;margin-top:16px;">'

    +'</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('vrPayMethod').onchange=()=>refreshPaymentAccountSelect('vrPayMethod','vrPayAccount');
  refreshPaymentAccountSelect('vrPayMethod','vrPayAccount');

  window.vrCalc = function(){
    const q = Number(document.getElementById('vrQty').value)||0;
    const u = Number(document.getElementById('vrUnit').value)||0;
    document.getElementById('vrTotal').textContent = t('lbl_return_total')+' ৳'+money(q*u);
  };

  document.getElementById('vrCancel').onclick = ()=>document.getElementById('vndReturnOverlay').remove();
  document.getElementById('vrSave').onclick = async function(){
    const qty = Number(document.getElementById('vrQty').value);
    const unit = Number(document.getElementById('vrUnit').value);
    const returnType = document.getElementById('vrType').value;
    const date = document.getElementById('vrDate').value;
    const note = document.getElementById('vrNote').value.trim();
    if(!qty||qty<=0||qty>remainingQty){ alert(t('f_pur_qty')+': 1-'+remainingQty); return; }
    const paymentSystem=returnType==='cash'?document.getElementById('vrPayMethod').value:null;
    const paymentAccountId=returnType==='cash'?(document.getElementById('vrPayAccount').value||null):null;
    if(returnType==='cash'&&!validatePaymentAccount(paymentSystem,paymentAccountId)) return;
    if(!confirm(t('vnd_return_confirm'))) return;

    const amount = qty * unit;

    // Stock কমাও
    const prod = db.products[purchase.productId];
    if(prod){ prod.qty = Math.max(0, Number(prod.qty) - qty); await safePut('products', purchase.productId, prod); }

    // Purchase due adjust করো
    purchase.due = Math.max(0, Number(purchase.due||0) - amount);
    await safePut('purchases', purchaseId, purchase);

    // Supplier due adjust
    if(returnType==='cash'){
      // Vendor নগদ ফেরত দিলো → আমাদের balance বাড়ে, vendor due কমে
      supplier.due = Number(supplier.due||0) - amount;
    } else {
      // পরের purchase এ adjust → vendor due কমে (advance হিসেবে)
      supplier.due = Number(supplier.due||0) - amount;
    }
    await safePut('suppliers', supplierId, supplier);

    // Return record
    const vp = { id:uid(), supplierId, supplierName:supplier.name,
      type:'purchase_return', returnType, purchaseId,
      productId:purchase.productId, productName:purchase.productName,
      qty, unitCost:unit, amount, note:note||'Purchase Return', paymentSystem,paymentAccountId,paymentAccountName:paymentAccountLabel(paymentAccountId),date, ts:Date.now() };
    db.vendorPayments.push(vp);
    await safePut('vendorPayments', vp.id, vp);

    document.getElementById('vndReturnOverlay').remove();
    showToast(t('saved_toast'));
    openVendorStatement(supplierId);
  };
}

async function deleteGroupMember(id){
  if(!requirePermission('delete_records'))return;
  const m = db.groupMembers[id];
  if(!m) return;
  if(db.sales.some(s=>s.groupMemberId===id) || db.installments.some(i=>i.groupMemberId===id) || db.installmentPlans.some(p=>p.groupMemberId===id) || db.agentLedger.some(x=>x.memberId===id) || openingBalanceRecord('agent',id)){
    alert(t('group_agent_has_bookings'));

  }
  showDeleteConfirm(
    t('del_title_member'),

  );

// grp.hajjiIds is meant to be an array, but Firestore can sometimes store/return
// it as a plain object with numeric keys (e.g. {0:'id1', 1:'id2'}) depending on
// how it was saved. Spreading that with [...x] throws "is not iterable" and
// silently breaks whichever lot/report was rendering. This normalizes either
// shape into a real array safely.
function normalizeHajjiIds(raw){
  let list;
  if(Array.isArray(raw)) list = raw;
  else if(raw && typeof raw === 'object') list = Object.values(raw);
  else list = [];
  // একজন হাজী ডিলিট হয়ে গেলেও কোনো লটের রোস্টারে তার পুরনো আইডি
  // থেকে যেতে পারে (বিশেষত পুরনো ডেটাতে) — এখানেই সেটা ছেঁকে বাদ দিচ্ছি,
  // যাতে হাজীর সংখ্যা সবসময় সত্যিকারের বিদ্যমান হাজীদেরই প্রতিফলিত করে
  return list.filter(hid => db.customers[hid]);
}

function yearFromDate(date){ return String(date||'').slice(0,4)||String(new Date().getFullYear()); }
function agentLedgerYears(memberId){
  const years=new Set([String(new Date().getFullYear())]);
  db.agentLedger.filter(x=>x.memberId===memberId).forEach(x=>years.add(String(x.accountingYear||yearFromDate(x.date))));
  db.sales.filter(x=>x.groupMemberId===memberId).forEach(x=>years.add(yearFromDate(x.date)));
  db.installments.filter(x=>x.groupMemberId===memberId).forEach(x=>years.add(yearFromDate(x.date)));
  const opening=openingBalanceRecord('agent',memberId);if(opening)years.add(yearFromDate(opening.date));
  Object.values(db.groups).filter(g=>g.memberId===memberId&&g.year).forEach(g=>years.add(String(g.year)));
  return [...years].filter(Boolean).sort((a,b)=>b.localeCompare(a));
}

function buildGroupAgentLedger(memberId,year){
  const member = db.groupMembers[memberId];
  if(!member) return {rows:[], summary:{}};
  const sales = db.sales.filter(s=>s.groupMemberId===memberId);
  const payments = db.installments.filter(i=>i.groupMemberId===memberId);
  const returns = db.returns.filter(r=>r.groupMemberId===memberId && !r.cancelled);
  const invoiceMap = new Map();
  sales.forEach(s=>{
    const key = s.invoiceId || s.id;
    if(!invoiceMap.has(key)) invoiceMap.set(key, []);
    invoiceMap.get(key).push(s);
  });
  const rows = [];
  const opening=openingBalanceRecord('agent',memberId);
  if(opening){const net=openingBalanceNet('agent',memberId);rows.push({date:opening.date,year:yearFromDate(opening.date),ts:Number(opening.ts||0),order:-5,ref:'OPEN',desc:openingSideLabel(opening),debit:net>0?net:0,credit:net<0?Math.abs(net):0,method:'—',context:opening.reference||'ERP Start',source:'opening'});}
  invoiceMap.forEach(items=>{
    const first = items[0];
    const debit = items.reduce((n,s)=>n+Number(s.total||0),0);
    const initialPaid = items.reduce((n,s)=>n+Number(s.initialPaid!==undefined?s.initialPaid:s.paid||0),0);
    const qty = items.reduce((n,s)=>n+Number(s.qty||0),0);
    const products = [...new Set(items.map(s=>s.productName).filter(Boolean))].join(', ');
    const ref = first.invoiceNo ? 'INV-'+first.invoiceNo : 'INV';
    const lot=db.groups[first.groupId]||{};
    rows.push({date:first.date,year:yearFromDate(first.date),ts:Number(first.ts||0),order:0,ref,desc:t('grp_booking_desc')+' — '+products+' × '+qty,debit,credit:0,method:'—',context:lot.name||first.customerName||'—',source:'booking',qty});
    if(initialPaid>0){
      const pk = paymentSystemKey(first.paymentSystem);
      rows.push({date:first.date,year:yearFromDate(first.date),ts:Number(first.ts||0),order:1,ref,desc:t('grp_initial_payment'),debit:0,credit:initialPaid,method:(pk?t(pk):'—')+(first.paymentAccountId?' — '+paymentAccountLabel(first.paymentAccountId):''),context:lot.name||first.customerName||'—',source:'initial',cashDirection:'in'});
    }
  });
  payments.forEach(p=>{
    const ref = p.receiptNo ? 'REC-'+p.receiptNo : 'REC';
    const pk = paymentSystemKey(p.paymentSystem);
    if(Number(p.amount||0)>0) rows.push({date:p.date,year:yearFromDate(p.date),ts:Number(p.ts||0),order:2,ref,desc:t('grp_due_payment')+(p.note?' — '+p.note:''),debit:0,credit:Number(p.amount||0),method:(pk?t(pk):'—')+(p.paymentAccountId?' — '+paymentAccountLabel(p.paymentAccountId):''),context:'Booking',source:'installment',cashDirection:'in'});
    if(Number(p.discount||0)>0) rows.push({date:p.date,year:yearFromDate(p.date),ts:Number(p.ts||0),order:3,ref,desc:t('grp_discount_desc')+(p.note?' — '+p.note:''),debit:0,credit:Number(p.discount||0),method:'—',context:'Booking',source:'discount'});
  });
  returns.forEach(r=>{
    if(Number(r.dueAdjust||0)>0) rows.push({date:r.date,year:yearFromDate(r.date),ts:Number(r.ts||0),order:4,ref:r.returnNo?'RET-'+r.returnNo:'RET',desc:t('grp_return_desc')+' — '+(r.productName||''),debit:0,credit:Number(r.dueAdjust||0),method:'—',context:(db.groups[r.groupId]||{}).name||'Booking',source:'return'});
  });
  (db.preRegBatches||[]).filter(b=>b.ownerType==='group_agent'&&b.ownerId===memberId).forEach(b=>{
    const ref='PRB-'+String(b.batchNo||0).padStart(4,'0'),context=[b.lotName,'Hajj '+(b.year||'')].filter(Boolean).join(' / '),method=paymentMethodLabel(b.paymentSystem)+(b.paymentAccountId?' — '+paymentAccountLabel(b.paymentAccountId):'');
    rows.push({date:b.date,year:String(b.year||yearFromDate(b.date)),ts:Number(b.ts||0),order:0.2,ref,desc:'Hajj Pre-registration — '+Number(b.qty||0)+' person',debit:Number(b.totalAmount||0),credit:0,method:'—',context,source:'pre_registration',qty:Number(b.qty||0)});
    if(Number(b.paidAmount||0)>0)rows.push({date:b.date,year:String(b.year||yearFromDate(b.date)),ts:Number(b.ts||0),order:0.3,ref,desc:'Pre-registration Deposit',debit:0,credit:Number(b.paidAmount||0),method,context,source:'pre_registration_payment',cashDirection:'in'});
  });
  (db.travelAdjustments||[]).filter(r=>(r.partyType==='group_agent'&&r.partyId===memberId)||r.sourceAgentId===memberId).forEach(r=>{
    if(r.status==='completed'&&Number(r.netAmount||0)>0){const base={date:r.date,year:String(r.hajjYear||yearFromDate(r.date)),ts:Number(r.ts||0),ref:'ADJ-'+String(r.adjustmentNo||0).padStart(4,'0'),context:r.reference||r.sourceLotName||'—'};rows.push({...base,order:4.5,desc:travelActionLabel(r.actionType)+' — refundable/transfer credit',debit:0,credit:Number(r.netAmount||0),method:r.settlementMethod||'—',source:'travel_adjustment'});if(r.settlementMethod!=='ledger_adjustment')rows.push({...base,order:4.6,desc:'Refund / transfer settled — '+travelServiceLabel(r.serviceType),debit:Number(r.netAmount||0),credit:0,method:r.paymentAccountId?paymentAccountLabel(r.paymentAccountId):(r.settlementMethod||'—'),source:'travel_settlement',cashDirection:['cash','bank','mobile_banking'].includes(r.settlementMethod)?'out':'none'});}
  });
  db.agentLedger.filter(x=>x.memberId===memberId).forEach(x=>{
    const method=x.cashDirection==='none'||!x.cashDirection?'—':paymentMethodLabel(x.paymentSystem||'cash')+(x.paymentAccountId?' — '+paymentAccountLabel(x.paymentAccountId):'');
    const context=[x.groupName||x.season,x.customerName].filter(Boolean).join(' / ')||'—';
    rows.push({date:x.date,year:String(x.accountingYear||yearFromDate(x.date)),ts:Number(x.ts||0),order:5,ref:x.entryNo||'AGT',desc:(x.headName||'Agent Entry')+(x.note?' — '+x.note:''),debit:x.type==='debit'?Number(x.amount||0):0,credit:x.type==='credit'?Number(x.amount||0):0,method,context,source:'agent_manual',recordId:x.id,cashDirection:x.cashDirection||'none'});
  });
  rows.sort((a,b)=>(String(a.date||'').localeCompare(String(b.date||''))) || (a.order-b.order) || (a.ts-b.ts));
  let balance = 0;
  rows.forEach(r=>{ balance += Number(r.debit||0)-Number(r.credit||0); r.balance=balance; });
  const isYearFilter=year&&year!=='all';
  const filtered=isYearFilter?rows.filter(r=>String(r.year)===String(year)):rows;
  const openingBalance=isYearFilter?rows.filter(r=>String(r.year)<String(year)).reduce((n,r)=>n+Number(r.debit||0)-Number(r.credit||0),0):0;
  let filteredBalance=openingBalance;filtered.forEach(r=>{filteredBalance+=Number(r.debit||0)-Number(r.credit||0);r.filteredBalance=filteredBalance;});
  const summary = {
    qty:filtered.filter(r=>r.source==='booking'||r.source==='pre_registration').reduce((n,r)=>n+Number(r.qty||0),0),
    booking:filtered.filter(r=>r.source==='booking'||r.source==='pre_registration').reduce((n,r)=>n+Number(r.debit||0),0),
    initialPaid:filtered.filter(r=>r.source==='initial'||r.source==='pre_registration_payment').reduce((n,r)=>n+Number(r.credit||0),0),
    laterPaid:filtered.filter(r=>r.source==='installment').reduce((n,r)=>n+Number(r.credit||0),0),
    discount:filtered.filter(r=>r.source==='discount').reduce((n,r)=>n+Number(r.credit||0),0),
    returns:filtered.filter(r=>r.source==='return').reduce((n,r)=>n+Number(r.credit||0),0),
    otherDebit:filtered.filter(r=>r.source==='agent_manual').reduce((n,r)=>n+Number(r.debit||0),0),
    otherCredit:filtered.filter(r=>r.source==='agent_manual').reduce((n,r)=>n+Number(r.credit||0),0),
    cashIn:filtered.filter(r=>r.cashDirection==='in').reduce((n,r)=>n+Number(r.debit||r.credit||0),0),
    cashOut:filtered.filter(r=>r.cashDirection==='out').reduce((n,r)=>n+Number(r.debit||r.credit||0),0),
    openingBalance,balance:filteredBalance,
    due:Math.max(0,filteredBalance),advance:Math.max(0,-filteredBalance)
  };
  const displayRows=isYearFilter&&openingBalance!==0?[{date:String(year)+'-01-01',year:String(year),ts:0,order:-1,ref:'OPEN',desc:'Opening Balance',debit:0,credit:0,method:'—',context:'Previous years',source:'opening',filteredBalance:openingBalance},...filtered]:filtered;
  return {rows:displayRows,summary};
}

function buildGroupLotsInfo(memberId){
  const lots = Object.entries(db.groups).filter(([,g])=>g.memberId===memberId);
  if(lots.length===0) return '';
  const lotPanels = lots.map(([gid,g])=>{
    const lotSales = db.sales.filter(s=>s.groupId===gid&&s.customerId);
    const ids = [...new Set([...normalizeHajjiIds(g.hajjiIds),...lotSales.map(s=>s.customerId).filter(Boolean)])];
    const customerRows = ids.map(cid=>{

function openGroupAgentPayment(memberId){
  if(!requirePermission('create_records'))return;
  const member = db.groupMembers[memberId];
  if(!member) return;
  const due = calculateGroupMemberBookingDueFromLedger(memberId);
  if(due<=0){ showToast(t('vnd_clear')); return; }
  const old = document.getElementById('groupAgentPaymentOverlay');
  if(old) old.remove();
  const html = '<div class="overlay open" id="groupAgentPaymentOverlay" style="z-index:180;">'
    +'<div class="modal" style="max-width:430px;">'
    +'<h2>'+t('grp_receive_payment')+' — '+escapeHtml(member.name)+'</h2>'
    +'<div class="field-hint" id="gapDueInfo" style="margin-bottom:12px;font-weight:700;">'+t('grp_current_due')+': ৳'+money(due)+'</div>'
    +'<div class="field"><label>'+t('grp_payment_amount')+'</label><input type="number" id="gapAmount" value="'+due+'" min="0"></div>'
    +'<div class="field"><label>'+t('pay_discount')+'</label><input type="number" id="gapDiscount" value="0" min="0"></div>'
    +'<div class="field"><label>'+t('grp_method')+'</label><select id="gapMethod"><option value="cash">'+t('payment_cash')+'</option><option value="bank">'+t('payment_bank')+'</option><option value="mobile_banking">'+t('payment_mobile_banking')+'</option></select></div>'
    +'<div class="field" id="gapAccountField"><label>'+t('f_payment_account')+'</label><select id="gapAccount"></select></div>'
    +'<div class="field"><label>'+t('f_date')+'</label><input type="date" id="gapDate" value="'+todayStr()+'"></div>'
    +'<div class="field"><label>'+t('f_note')+'</label><input type="text" id="gapNote" placeholder="'+escapeHtml(t('grp_due_payment'))+'"></div>'
    +'<div class="field-hint" id="gapResult"></div>'
    +'<div class="modal-actions"><button class="btn ghost" id="gapCancel">'+t('cancel')+'</button><button class="btn amber" id="gapSave">'+t('save')+'</button></div>'
    +'</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
  const overlay = document.getElementById('groupAgentPaymentOverlay');
  document.getElementById('gapMethod').onchange=()=>refreshPaymentAccountSelect('gapMethod','gapAccount');
  refreshPaymentAccountSelect('gapMethod','gapAccount');
  const update = ()=>{
    const paid = Number(document.getElementById('gapAmount').value)||0;
    const discount = Number(document.getElementById('gapDiscount').value)||0;
    document.getElementById('gapResult').textContent = t('pay_due_remaining')(Math.max(0,due-paid-discount));
  };
  document.getElementById('gapAmount').oninput=update;
  document.getElementById('gapDiscount').oninput=update;
  update();
  document.getElementById('gapCancel').onclick=()=>overlay.remove();
  overlay.addEventListener('click',e=>{if(e.target===overlay) overlay.remove();});
  document.getElementById('gapSave').onclick=async()=>{
    const paid = Number(document.getElementById('gapAmount').value)||0;
    const discount = Number(document.getElementById('gapDiscount').value)||0;
    if(paid<=0 && discount<=0) return;
    if(paid+discount>due){ alert(t('grp_payment_too_high')); return; }
    const payDate = document.getElementById('gapDate').value||todayStr();
    const paymentSystem = document.getElementById('gapMethod').value||'cash';
    const paymentAccountId = document.getElementById('gapAccount').value||null;
    if(paid>0&&!validatePaymentAccount(paymentSystem,paymentAccountId)) return;
    const note = document.getElementById('gapNote').value.trim();
    let toApply = paid+discount;
    const openSales = db.sales.filter(s=>s.groupMemberId===memberId&&Number(s.due)>0).sort((a,b)=>a.ts-b.ts);
    for(const sale of openSales){
      if(toApply<=0) break;
      const applyAmt = Math.min(Number(sale.due||0),toApply);
      sale.paid=Number(sale.paid||0)+applyAmt;
      sale.due=Math.max(0,Number(sale.due||0)-applyAmt);
      toApply-=applyAmt;
      await safePut('sales',sale.id,sale);
    }
    const rec={
      id:uid(),receiptNo:nextReceiptNo(),customerId:null,customerName:member.name,
      buyerType:'group_agent',groupMemberId:memberId,groupMemberName:member.name,
      amount:paid,discount,previousDue:due,newDue:Math.max(0,due-paid-discount),note,
      paymentSystem,paymentAccountId,paymentAccountName:paymentAccountLabel(paymentAccountId),date:payDate,ts:new Date(payDate).getTime()||Date.now()
    };
    db.installments.push(rec);
    await safePut('installments',rec.id,rec);
    member.due=calculateGroupMemberDueFromLedger(memberId);
    rec.newDue=member.due;
    await safePut('groupMembers',memberId,member);
    await safePut('installments',rec.id,rec);
    overlay.remove();
    showToast(t('grp_payment_saved'));
    openGroupMemberReport(memberId);
    openInstallmentReceipt(rec);
  };
}

function openGroupHajjiManager(groupId){
  if(!requirePermission('edit_records'))return;
  const grp = db.groups[groupId];
  if(!grp) return;

  // এই Lot এ আগে assign করা হাজীরা
  const assignedIds = new Set(normalizeHajjiIds(grp.hajjiIds).filter(Boolean));

  const html = '<div class="overlay open" id="grpHajjiOverlay" style="z-index:120;">'
    +'<div class="modal" style="max-width:560px;">'
    +'<h2>'+t('lbl_hajji_add')+escapeHtml(grp.name)+'</h2>'

    // search box
    +'<div class="field"><label>কাস্টমার খুঁজুন (নাম / পাসপোর্ট / ট্র্যাকিং / ফোন)</label>'
    +'<input type="text" id="ghSearch" placeholder="টাইপ করুন..." autocomplete="off">'
    +'</div>'

    // search results
    +'<div id="ghResults" style="max-height:min(220px,30vh);overflow-y:auto;border:1px solid var(--line);border-radius:6px;margin-bottom:14px;"></div>'

    // currently assigned
    +'<div style="font-weight:600;margin-bottom:8px;">'+t('grp_col_hajji')+' <span id="ghCount" style="font-size:12px;color:var(--ink-soft);"></span></div>'
    +'<div id="ghAssigned" style="max-height:min(180px,25vh);overflow-y:auto;border:1px solid var(--line);border-radius:6px;margin-bottom:14px;"></div>'

    +'<div style="display:flex;gap:10px;">'
    +'<button class="btn" id="ghCancel">'+t('cancel')+'</button>'
    +'<button class="btn" onclick="openQuickAddHajji(\''+groupId+'\')">'+t('add_customers')+'</button>'
    +'<button class="btn amber" id="ghSave">'+t('save')+'</button>'
    +'</div>'
    +'</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);

  let selected = new Set(assignedIds);

  function renderAssigned(){
    const el = document.getElementById('ghAssigned');
    const cnt = document.getElementById('ghCount');
    if(selected.size===0){
      el.innerHTML = '<div style="padding:12px;color:var(--ink-soft);text-align:center;">'+t('grp_no_members')+'</div>';
      cnt.textContent = '';
      return;
    }
    cnt.textContent = '('+selected.size+' জন)';
    el.innerHTML = [...selected].map(function(hid){
      const h = db.customers[hid];
      if(!h) return '';
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);">'
        +'<div><strong>'+escapeHtml(h.name)+'</strong>'
        +(h.passport?' <span style="font-size:11px;color:var(--ink-soft);">'+escapeHtml(h.passport)+'</span>':'')+'</div>'
        +'<button style="border:none;background:none;cursor:pointer;color:var(--red);font-size:16px;" data-ghremove="'+hid+'" title="'+t('delete_title')+'">✕</button>'
        +'</div>';
    }).join('');
    el.onclick = function(e){
      const btn = e.target.closest('[data-ghremove]');
      if(btn){ selected.delete(btn.dataset.ghremove); renderAssigned(); renderSearch(document.getElementById('ghSearch').value); }
    };
  }

  function renderSearch(q){
    const el = document.getElementById('ghResults');
    if(!q){ el.innerHTML = '<div style="padding:10px 12px;color:var(--ink-soft);font-size:13px;">'+t('grp_rpt_search')+'</div>'; return; }
    const ql = q.trim().toLowerCase();
    const matches = Object.entries(db.customers).filter(function([hid,h]){
      return !selected.has(hid) && (
        h.name.toLowerCase().includes(ql)
        || (h.passport&&h.passport.toLowerCase().includes(ql))
        || (h.tracking&&h.tracking.toLowerCase().includes(ql))
        || (h.phone&&h.phone.toLowerCase().includes(ql))
      );
    }).slice(0,10);
    if(matches.length===0){
      el.innerHTML = '<div style="padding:10px 12px;color:var(--ink-soft);font-size:13px;">কোনো কাস্টমার পাওয়া যায়নি</div>'; return;
    }
    el.innerHTML = matches.map(function([hid,h]){
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;" data-ghpick="'+hid+'">'
        +'<div><strong>'+escapeHtml(h.name)+'</strong>'
        +(h.passport?' · <span style="font-size:11px;color:var(--ink-soft);">'+escapeHtml(h.passport)+'</span>':'')
        +(h.phone?' · <span style="font-size:11px;color:var(--ink-soft);">'+escapeHtml(h.phone)+'</span>':'')
        +'</div>'
        +'<button class="btn" style="padding:4px 10px;font-size:12px;" data-ghpick="'+hid+'">+ যোগ</button>'
        +'</div>';
    }).join('');
    el.onclick = function(e){
      const btn = e.target.closest('[data-ghpick]');
      if(btn){ selected.add(btn.dataset.ghpick); document.getElementById('ghSearch').value=''; renderSearch(''); renderAssigned(); }
    };
  }

  renderAssigned();
  renderSearch('');

  document.getElementById('ghSearch').addEventListener('input', function(e){ renderSearch(e.target.value); });
  document.getElementById('ghCancel').onclick = function(){ document.getElementById('grpHajjiOverlay').remove(); };
  document.getElementById('ghSave').onclick = async function(){
    grp.hajjiIds = [...selected];
    db.groups[groupId] = grp;
    await safePut('groups', groupId, grp);
    document.getElementById('grpHajjiOverlay').remove();
    showToast(t('saved_toast'));
    if(currentTab==='groups') renderGroupsPage(); else refreshCurrentView();
  };
}

function openQuickAddHajji(groupId){
  // overlay বন্ধ করো, QuickAdd খুলুন, সংরক্ষণের পর group এ assign করুন
  const overlay = document.getElementById('grpHajjiOverlay');
  if(overlay) overlay.remove();
  openQuickAdd('customers', null, function(newId){
    // নতুন হাজী তৈরির পর আবার hajji manager খুলুন
    if(newId && db.groups[groupId]){
      const grp = db.groups[groupId];
      grp.hajjiIds = [...new Set([...normalizeHajjiIds(grp.hajjiIds), newId])];
      safePut('groups', groupId, grp);
    }
    openGroupHajjiManager(groupId);
  });
}

async function createFirebaseLogin(email,password){
  if(!password||!useFirebase) return 'role_only';
  let secondary=firebase.apps.find(a=>a.name==='ERPUserCreator');
  if(!secondary) secondary=firebase.initializeApp(firebaseConfig,'ERPUserCreator');
  const auth=secondary.auth();
  try{
    try{await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);}catch(_){ }
    await auth.createUserWithEmailAndPassword(email,password);
    await auth.signOut();
    return 'created';
  }catch(err){
    try{await auth.signOut();}catch(_){ }
    if(err&&err.code==='auth/email-already-in-use') return 'existing';
    throw err;
  }
}

function allPaymentLedgerRows(){
  const out=[],sales={};
  db.sales.forEach(s=>{const amount=Number(s.initialPaid!==undefined?s.initialPaid:s.paid||0);if(amount<=0)return;const key=s.invoiceId||s.id;if(!sales[key])sales[key]={id:key,date:s.date,ts:s.ts,entryNo:'INV-'+(s.invoiceNo||''),type:'receivable',headName:s.groupMemberId?'Agent Booking Receipt':'Customer Booking Receipt',amount:0,paymentSystem:s.paymentSystem||'cash',paymentAccountId:s.paymentAccountId||null,reference:s.customerName||s.groupMemberName||'Walk-in',source:'booking'};sales[key].amount+=amount;});Object.values(sales).forEach(x=>out.push(x));

  db.expenses.forEach(x=>out.push({id:x.id,date:x.date,ts:x.ts,entryNo:'EXP-'+String(x.id).slice(-5),type:'payable',headName:'Expense — '+(x.category||''),amount:Number(x.amount||0),paymentSystem:x.paymentSystem||'cash',paymentAccountId:x.paymentAccountId||null,reference:x.note||'',source:'expense'}));
  db.returns.forEach(x=>{if(!x.cancelled&&Number(x.excessRefund)>0)out.push({id:x.id,date:x.date,ts:x.ts,entryNo:'RET-'+(x.returnNo||''),type:'payable',headName:'Customer Booking Refund',amount:Number(x.excessRefund),paymentSystem:x.paymentSystem||'cash',paymentAccountId:x.paymentAccountId||null,reference:x.customerName||'',source:'return'});});
  db.agentLedger.forEach(x=>{if(x.cashDirection!=='in'&&x.cashDirection!=='out')return;out.push({id:x.id,date:x.date,ts:x.ts,entryNo:x.entryNo||'AGT',type:x.cashDirection==='in'?'receivable':'payable',headName:'Agent — '+(x.headName||'Ledger Entry'),amount:Number(x.amount||0),paymentSystem:x.paymentSystem||'cash',paymentAccountId:x.paymentAccountId||null,reference:(x.memberName||'')+(x.reference?' — '+x.reference:''),source:'agent_ledger'});});
  db.paymentLedger.forEach(x=>out.push({...x,source:'manual'}));
  return out.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||Number(a.ts||0)-Number(b.ts||0));
}
