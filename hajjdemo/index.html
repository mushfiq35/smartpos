  msRows.push(rowId);
  const rowHtml = `
    <div class="ms-row" id="row-${rowId}" ${existingSale ? `data-saleid="${existingSale.id}"` : ''}>
      <div class="field">
        <label>${t('f_product_select')}</label>
        <div class="select-row" style="position:relative;">
          <input type="text" id="ms-product-${rowId}" autocomplete="off" placeholder="${t('search_placeholder')}" oninput="onMsProductSearch('${rowId}')" onfocus="onMsProductSearch('${rowId}')">
          <input type="hidden" id="ms-productid-${rowId}" value="${existingSale?existingSale.productId:''}">
          <button type="button" class="qa-btn" onclick="openQuickAdd('products','ms-product-${rowId}')">+</button>
          <div class="ms-product-results" id="ms-product-results-${rowId}"></div>
        </div>
      </div>
      <div class="field"><label>${t('f_qty')}</label><input type="number" id="ms-qty-${rowId}" value="${existingSale?existingSale.qty:1}" oninput="recalcMultiSaleTotal()"></div>
      <div class="field"><label>${t('f_unit_price')}</label><input type="number" id="ms-price-${rowId}" value="${existingSale?existingSale.unitPrice:0}" oninput="recalcMultiSaleTotal()"></div>
      <div class="field"><label>${t('f_discount')}</label><input type="number" id="ms-discount-${rowId}" value="${existingSale?(existingSale.discount||0):0}" oninput="recalcMultiSaleTotal()"></div>
      <button type="button" class="ms-remove" onclick="removeMultiSaleRow('${rowId}')">🗑</button>
    </div>
  `;
  document.getElementById('msRows').insertAdjacentHTML('beforeend', rowHtml);
  if(existingSale){
    const product = db.products[existingSale.productId];
    document.getElementById(`ms-product-${rowId}`).value = product ? product.name : '';
  }
  recalcMultiSaleTotal();
}

function removeMultiSaleRow(rowId){
  if(msRows.length<=1) return; // keep at least one row
  msRows = msRows.filter(r=>r!==rowId);
  const el = document.getElementById('row-'+rowId);
  if(el) el.remove();
  recalcMultiSaleTotal();
}

function onMsCustomerSearch(){
  const input = document.getElementById('msCustomer');
  const resultsEl = document.getElementById('msCustomerResults');
  if(!input || !resultsEl) return;
  const q = input.value.trim().toLowerCase();
  let entries = Object.entries(db.customers);
  // A customer may be new to the selected Lot. Keep the full customer list
  // available; saving the booking will attach the customer to that Lot.
  const matches = q
    ? entries.filter(([cid,c]) => c.name.toLowerCase().includes(q) || (c.phone||'').toLowerCase().includes(q) || String(c.displayId||'').includes(q) || (c.passport&&c.passport.toLowerCase().includes(q))).slice(0,10)
    : entries.slice(0,10);
  if(matches.length===0){ resultsEl.classList.remove('open'); resultsEl.innerHTML=''; return; }
  resultsEl.innerHTML = matches.map(([cid,c]) => `<div class="ms-product-result-item" onclick="selectMsCustomer('${cid}')">${escapeHtml(c.name)} <span style="color:var(--ink-soft);font-size:11px;">${c.phone?escapeHtml(c.phone):''}${calculateCustomerDueFromLedger(cid)>0?' · ৳'+money(calculateCustomerDueFromLedger(cid)):''}</span></div>`).join('');
  resultsEl.classList.add('open');
}

function recalcMultiSaleTotal(){
  let grand = 0;
  msRows.forEach(rowId => {
    const qtyEl = document.getElementById(`ms-qty-${rowId}`);
    const priceEl = document.getElementById(`ms-price-${rowId}`);
    const discEl = document.getElementById(`ms-discount-${rowId}`);
    if(!qtyEl || !priceEl) return;
    const qty = Number(qtyEl.value)||0;
    const price = Number(priceEl.value)||0;
    const disc = discEl ? (Number(discEl.value)||0) : 0;
    grand += Math.max(0, qty*price - disc);
  });
  document.getElementById('msGrandValue').textContent = '৳' + money(grand);
  return grand;
}

document.getElementById('msSaveBtn').addEventListener('click', async () => {
  if(msEditInvoiceId&&!requirePermission('edit_records'))return;
  if(!msEditInvoiceId&&!requirePermission('create_records'))return;
  const buyerType = document.getElementById('msBuyerType').value === 'group_agent' ? 'group_agent' : 'customer';
  const groupMemberId = buyerType==='group_agent' ? (document.getElementById('msGroupMemberSelect').value || null) : null;
  const groupMember = groupMemberId ? db.groupMembers[groupMemberId] : null;
  if(buyerType==='group_agent' && !groupMember){ alert(t('group_agent_required')); return; }
  const customerId = buyerType==='customer' ? (document.getElementById('msCustomerId').value || null) : null;
  const cust = customerId ? db.customers[customerId] : null;
  const selectedLotId = buyerType==='customer' && document.getElementById('msGroupSelect') ? (document.getElementById('msGroupSelect').value||null) : null;
  const selectedLot = selectedLotId ? db.groups[selectedLotId] : null;
  const referrerMember = selectedLot && selectedLot.memberId ? db.groupMembers[selectedLot.memberId] : null;
  if(selectedLotId && !cust){ alert(t('required_fields')); return; }
  const customerName = buyerType==='group_agent' ? groupMember.name : (cust ? cust.name : '');
  const date = document.getElementById('msDate').value || todayStr();
  const voucherNo = document.getElementById('msVoucher').value.trim();
  const voucherTag = document.getElementById('msVoucherTag').value.trim();
  const paymentSystem = document.getElementById('msPaymentSystem').value;
  const paymentAccountId = document.getElementById('msPaymentAccount').value||null;
  const isOldEntry = false; // Old entry always false — field hidden
  const instCount = Number(document.getElementById('msInstCount').value)||0;

  const rowsData = [];
  for(const rowId of msRows){
    const pid = document.getElementById(`ms-productid-${rowId}`).value;
    if(!pid) continue;
    const product = db.products[pid];
    if(!product) continue;
    const qty = Number(document.getElementById(`ms-qty-${rowId}`).value)||0;
    const price = Number(document.getElementById(`ms-price-${rowId}`).value)||0;
    const disc = Number(document.getElementById(`ms-discount-${rowId}`).value)||0;
    if(qty<=0) continue;
    if(qty > Number(product.qty)){
      if(!confirm(t('low_stock_more'))) return;
    }
    rowsData.push({ pid, product, qty, price, disc, rowTotal: Math.max(0, qty*price - disc) });
  }
  if(rowsData.length===0){ alert(t('product_not_found')); return; }

  // if editing, first reverse the old invoice's stock/due effects
  let previousGroupMemberId = null;
  if(msEditInvoiceId){
    const oldSales = db.sales.filter(s=>s.invoiceId===msEditInvoiceId);
    previousGroupMemberId = oldSales[0] ? (oldSales[0].groupMemberId||null) : null;
    const oldDueTotal = oldSales.reduce((s,x)=>s+Number(x.due||0),0);
    for(const old of oldSales){
      const p = db.products[old.productId];
      if(p){ p.qty = Number(p.qty) + Number(old.qty); await safePut('products', old.productId, p); }
      db.sales = db.sales.filter(s=>s.id!==old.id);
      await safeRemove('sales', old.id);
    }
    const oldPlan = db.installmentPlans.find(p=>p.invoiceId===msEditInvoiceId);
    if(oldPlan){
      db.installmentPlans = db.installmentPlans.filter(p=>p.id!==oldPlan.id);
      await safeRemove('installmentPlans', oldPlan.id);
    }
    if(oldSales[0] && oldSales[0].customerId && db.customers[oldSales[0].customerId]){
      const oldCust = db.customers[oldSales[0].customerId];
      oldCust.due = Math.max(0, Number(oldCust.due) - oldDueTotal);
      await safePut('customers', oldSales[0].customerId, oldCust);
    }
  }

  const grandTotal = rowsData.reduce((s,r)=>s+r.rowTotal,0);
  const paidInput = document.getElementById('msPaid').value;
  const overallPaid = paidInput===''? grandTotal : Math.min(grandTotal, Number(paidInput)||0);
  if(overallPaid>0&&!validatePaymentAccount(paymentSystem,paymentAccountId)) return;
  const overallDue = Math.max(0, grandTotal - overallPaid);

  // Every booking created by this builder gets an invoiceId, including a
  // single-package booking. This keeps Customers and Groups/Agent bookings on
  // the same edit/view/delete path without losing the selected buyer type.
  const invoiceId = msEditInvoiceId || uid();
  const invoiceNo = msEditInvoiceNo || nextInvoiceNo();
  const saleRecords = [];
  let remainingPaid = overallPaid;
  let remainingDue = overallDue;

  rowsData.forEach((r, i) => {
    const isLast = i===rowsData.length-1;
    const share = grandTotal>0 ? r.rowTotal/grandTotal : 0;
    const rowPaid = isLast ? remainingPaid : Math.min(r.rowTotal, Math.round(overallPaid*share));
    const rowDue = isLast ? remainingDue : Math.max(0, r.rowTotal - rowPaid);
    remainingPaid -= rowPaid;
    remainingDue -= rowDue;
    const saleId = uid();
    const msGroupId = selectedLotId || '';
    const msGroupObj = selectedLot;
    const record = {
      id: saleId, invoiceId, invoiceNo, voucherNo, voucherTag, paymentSystem, paymentAccountId, paymentAccountName:paymentAccountLabel(paymentAccountId), isOldEntry, customerId, customerName,
      buyerType, groupMemberId, groupMemberName: groupMember ? groupMember.name : '',
      referrerMemberId: buyerType==='customer'&&msGroupObj ? (msGroupObj.memberId||null) : null,
      referrerMemberName: buyerType==='customer'&&referrerMember ? referrerMember.name : '',
      productId: r.pid, productName: r.product.name,
      qty: r.qty, unitPrice: r.price, unitCost: Number(r.product.cost||0), discount: r.disc,
      total: r.rowTotal, paid: rowPaid, due: rowDue, initialPaid: rowPaid, date, ts: Date.now(),
      groupId: msGroupId || null, groupName: msGroupObj ? msGroupObj.name : ''
    };
    saleRecords.push(record);
    r.product.qty = Math.max(0, Number(r.product.qty) - r.qty);
  });

  await Promise.all(rowsData.map(r => safePut('products', r.pid, r.product)));
  saleRecords.forEach(rec => db.sales.push(rec));
  await Promise.all(saleRecords.map(rec => safePut('sales', rec.id, rec)));
  if(customerId && cust){
    cust.due = calculateCustomerDueFromLedger(customerId);
    await safePut('customers', customerId, cust);
  }
  if(customerId && selectedLot){
    selectedLot.hajjiIds = [...new Set([...normalizeHajjiIds(selectedLot.hajjiIds), customerId])];
    await safePut('groups', selectedLotId, selectedLot);
  }
  const memberIdsToRefresh = [...new Set([previousGroupMemberId, groupMemberId].filter(Boolean))];
  for(const mid of memberIdsToRefresh){
    const member = db.groupMembers[mid];
    if(member){ member.due = calculateGroupMemberDueFromLedger(mid); await safePut('groupMembers', mid, member); }
  }

  if(overallDue>0 && instCount>=2){
    const perAmount = Math.floor(overallDue / instCount);
    const items = [];
    for(let i=0;i<instCount;i++){
      const amt = (i===instCount-1) ? (overallDue - perAmount*(instCount-1)) : perAmount;
      items.push({ idx: i+1, amount: amt, status:'pending', paidDate:null });
    }
    const productNames = rowsData.map(r=>r.product.name).join(', ');
    const plan = {
      id: uid(), saleId: saleRecords[0].id, invoiceId, customerId, customerName,
      buyerType, groupMemberId, groupMemberName: groupMember ? groupMember.name : '',
      groupId:selectedLotId||null, groupName:selectedLot?selectedLot.name:'',
      referrerMemberId:selectedLot?(selectedLot.memberId||null):null,
      referrerMemberName:referrerMember?referrerMember.name:'',
      productName: productNames, totalDue: overallDue, count: instCount, perAmount,
      items, createdDate: date, ts: Date.now()
    };
    db.installmentPlans.push(plan);
    await safePut('installmentPlans', plan.id, plan);
  }

  document.getElementById('multiSaleOverlay').classList.remove('open');
  msEditInvoiceId = null;
  msEditInvoiceNo = null;
  renderNav();
  renderPage();
  if(saleRecords.length && typeof openSaleView==='function') openSaleView(saleRecords[0].id);
});

  if(!cust) return;
  const paid = Number(document.getElementById('duePaidInput').value)||0;
  const discount = Number(document.getElementById('dueDiscountInput').value)||0;
  const remaining = Math.max(0, Number(cust.due) - (paid+discount));
  document.getElementById('dueResultInfo').textContent = t('pay_due_remaining')(remaining);
}

  document.getElementById('dueOverlay').classList.remove('open');
  dueCtx = null;
});
setupOverlayBackdropClose('dueOverlay', () => { dueCtx = null; });
document.getElementById('dueConfirmBtn').addEventListener('click', async () => {
  if(!dueCtx) return;
  const cust = db.customers[dueCtx];
  if(!cust) return;
  const paid = Number(document.getElementById('duePaidInput').value)||0;
  const discount = Number(document.getElementById('dueDiscountInput').value)||0;
  const payDate = document.getElementById('dueDateInput').value || todayStr();
  const note = document.getElementById('dueNoteInput').value.trim();
  const isOldEntry = false; // Old entry always false
  const instPaymentSystem = document.getElementById('duePaymentSystem').value || 'cash';
  const paymentAccountId = document.getElementById('duePaymentAccount').value||null;
  if(paid<=0 && discount<=0) return;
  if(paid>0&&!validatePaymentAccount(instPaymentSystem,paymentAccountId)) return;
  const previousDue = Number(cust.due);
  if(paid + discount > previousDue){
    alert(currentLang==='bn' ? 'পরিশোধ + ছাড় বর্তমান বকেয়ার চেয়ে বেশি হতে পারবে না।' : 'Payment + discount cannot exceed the current due.');
    return;
  }
  const newDue = Math.max(0, previousDue - (paid+discount));
  cust.due = newDue;
  await safePut('customers', dueCtx, cust);

  // distribute this payment across the customer's outstanding sales (oldest first)
  // so each sale's own paid/due fields stay accurate too
  let toApply = paid + discount; // both cash and waiver settle receivable; cash reports count only `paid`
  const openSales = db.sales.filter(s=>s.customerId===dueCtx && Number(s.due)>0).sort((a,b)=>a.ts-b.ts);
  const salesToUpdate = [];
  for(const sale of openSales){
    if(toApply<=0) break;
    const applyAmt = Math.min(Number(sale.due), toApply);
    sale.paid = Number(sale.paid||0) + applyAmt;
    sale.due = Math.max(0, Number(sale.due) - applyAmt);
    toApply -= applyAmt;
    salesToUpdate.push(sale);
  }
  await Promise.all(salesToUpdate.map(sale => safePut('sales', sale.id, sale)));

  const instRecord = {
    id: uid(), receiptNo: nextReceiptNo(), customerId: dueCtx, customerName: cust.name,
    amount: paid, discount, previousDue, newDue, note, isOldEntry,
    paymentSystem: instPaymentSystem, paymentAccountId, paymentAccountName:paymentAccountLabel(paymentAccountId),
    date: payDate, ts: new Date(payDate).getTime() || Date.now()
  };
  db.installments.push(instRecord);
  await safePut('installments', instRecord.id, instRecord);
  cust.due = calculateCustomerDueFromLedger(dueCtx);
  await safePut('customers', dueCtx, cust);
  document.getElementById('dueOverlay').classList.remove('open');
  dueCtx = null;
  renderPage();
  openInstallmentReceipt(instRecord);
});

function openInstallmentReceipt(rec){
  const custRecord = rec.customerId ? db.customers[rec.customerId] : null;
  const memberRecord = rec.groupMemberId ? db.groupMembers[rec.groupMemberId] : null;
  document.getElementById('instReceiptTitle').textContent = t('installment_receipt_title') + (rec.receiptNo ? ' #'+rec.receiptNo : '');

function openInstallmentEdit(instId, custId){
  if(!requirePermission('edit_records'))return;
  const rec = db.installments.find(x=>x.id===instId);
  if(!rec) return;
  const html = '<div class="overlay open" id="instEditOverlay" style="z-index:200;">'
    +'<div class="modal" style="max-width:400px;">'
    +'<h2>'+t('edit_title')+' — '+t('nav_installments')+'</h2>'
    +'<div class="field"><label>'+t('inst_col_amount')+' *</label>'
    +'<input type="number" id="ieAmt" value="'+rec.amount+'" min="0" step="any"></div>'
    +'<div class="field"><label>'+t('inst_col_discount')+'</label>'
    +'<input type="number" id="ieDisc" value="'+(rec.discount||0)+'" min="0" step="any"></div>'
    +'<div class="field"><label>'+t('col_date')+'</label>'
    +'<input type="date" id="ieDate" value="'+rec.date+'"></div>'
    +'<div class="field"><label>'+t('f_note')+'</label>'
    +'<input type="text" id="ieNote" value="'+escapeHtml(rec.note||'')+'"></div>'
    +'<div style="display:flex;gap:10px;margin-top:16px;">'
    +'<button class="btn" id="ieCancel">'+t('cancel')+'</button>'
    +'<button class="btn amber" id="ieSave">'+t('save')+'</button>'
    +'</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('ieCancel').onclick = ()=> document.getElementById('instEditOverlay').remove();
  document.getElementById('ieSave').onclick = async function(){
    const newAmt = Number(document.getElementById('ieAmt').value);
    const newDisc = Number(document.getElementById('ieDisc').value||0);
    const newDate = document.getElementById('ieDate').value;
    const newNote = document.getElementById('ieNote').value.trim();
    if(newAmt < 0){ alert(t('inst_col_amount')); return; }
    const oldTotal = Number(rec.amount) + Number(rec.discount||0);
    const newTotal = newAmt + newDisc;
    const custForLimit = db.customers[rec.customerId];
    const maxSettlement = oldTotal + Number(custForLimit ? custForLimit.due||0 : 0);
    if(newTotal > maxSettlement){
      alert(currentLang==='bn' ? 'পরিশোধ + ছাড় বর্তমান বকেয়ার চেয়ে বেশি হতে পারবে না।' : 'Payment + discount cannot exceed the available due.');
      return;
    }
    const diff = newTotal - oldTotal;
    // customer.due
    const cust2 = db.customers[rec.customerId];
    if(cust2){ cust2.due = Math.max(0, Number(cust2.due||0) - diff); await safePut('customers', rec.customerId, cust2); }
    // sale.due
    let remaining = Math.abs(diff);
    if(diff > 0){
      const openSales = db.sales.filter(s=>s.customerId===rec.customerId && Number(s.due)>0).sort((a,b)=>a.ts-b.ts);
      for(const sale of openSales){
        if(remaining<=0) break;
        const applyAmt = Math.min(Number(sale.due), remaining);
        sale.paid = Number(sale.paid||0) + applyAmt;
        sale.due = Math.max(0, Number(sale.due) - applyAmt);
        remaining -= applyAmt;
        await safePut('sales', sale.id, sale);
      }
    } else if(diff < 0){
      const paidSales = db.sales.filter(s=>s.customerId===rec.customerId && Number(s.paid||0)>0).sort((a,b)=>b.ts-a.ts);
      for(const sale of paidSales){
        if(remaining<=0) break;
        const rev = Math.min(Number(sale.paid||0), remaining);
        sale.paid = Math.max(0, Number(sale.paid||0) - rev);
        sale.due = Number(sale.due||0) + rev;
        remaining -= rev;
        await safePut('sales', sale.id, sale);
      }
    }
    // record update
    rec.amount = newAmt; rec.discount = newDisc; rec.date = newDate; rec.note = newNote;
    rec.newDue = Math.max(0, Number(rec.previousDue) - newTotal);
    await safePut('installments', rec.id, rec);
    const idx = db.installments.findIndex(x=>x.id===rec.id);
    if(idx>=0) db.installments[idx] = rec;
    document.getElementById('instEditOverlay').remove();
    showToast(t('saved_toast'));
    openInstallmentHistory(custId);
  };
}

function openInstallmentHistory(custId){
  const cust = db.customers[custId];
  if(!cust) return;
  cust.due = calculateCustomerDueFromLedger(custId);
  const list = db.installments.filter(x=>x.customerId===custId).sort((a,b)=>b.ts-a.ts);
  const totalPaid = list.reduce((s,x)=>s+Number(x.amount||0),0);
  const plans = db.installmentPlans.filter(p=>p.customerId===custId).sort((a,b)=>b.ts-a.ts);
  document.getElementById('instHistoryTitle').textContent = cust.name + ' — ' + t('installment_history_title');
  document.getElementById('instHistoryCloseBtn').textContent = t('close');
  document.getElementById('instHistoryPrintBtn').textContent = t('print_report');
  document.getElementById('instHistoryBody').innerHTML = `
    <div class="field-hint" style="margin-bottom:6px;font-weight:700;color:var(--ink);">
      ${escapeHtml(cust.name)}${cust.phone ? ' · ' + t('col_phone') + ': ' + escapeHtml(cust.phone) : ''}
    </div>
    <div class="field-hint" style="margin-bottom:10px;">${t('inst_total_paid')}: ৳${money(totalPaid)} · ${t('col_due')}: ৳${money(calculateCustomerDueFromLedger(custId))}</div>
    ${plans.length>0 ? plans.map(p=>`
      <div class="panel">
        <div style="font-weight:700;margin-bottom:6px;">${escapeHtml(p.productName||'')} — ${t('inst_plan_summary')(p.count, p.perAmount)}</div>
        ${renderInstallmentPlanHtml(p)}
      </div>`).join('') : ''}
    ${list.length===0 ? `<div class="empty"><div class="big">${t('inst_no_history')}</div></div>` : `
    <table class="data">
      <thead><tr><th>${t('inst_col_date')}</th><th>${t('inst_col_previous_due')}</th><th>${t('inst_col_amount')}</th><th>${t('inst_col_discount')}</th><th>${t('inst_col_new_due')}</th><th>${t('f_note')}</th><th class="no-print"></th></tr></thead>
      <tbody>${list.map(r=>`<tr>
        <td>${formatDateDMY(r.date)}</td><td>৳${money(r.previousDue)}</td><td>৳${money(r.amount)}</td>
        <td>${Number(r.discount)>0?'৳'+money(r.discount):'—'}</td><td>৳${money(r.newDue)}</td><td>${escapeHtml(r.note||'—')}</td>
        <td class="actions-cell no-print">
          <button class="icon-btn inst-edit-btn" data-id="${r.id}" title="${t('edit_title')}">✏️</button>
          <button class="icon-btn inst-del-btn" data-id="${r.id}" title="${t('delete_title')}">🗑️</button>
        </td></tr>`).join('')}</tbody>
    </table>`}
  `;
  document.getElementById('instHistoryOverlay').classList.add('open');
  document.getElementById('instHistoryBody').querySelectorAll('.inst-edit-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> openInstallmentEdit(btn.dataset.id, custId));
  });
  document.getElementById('instHistoryBody').querySelectorAll('.inst-del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!requirePermission('delete_records'))return;
      if(!confirm(t('delete_confirm'))) return;
      const rec = db.installments.find(x=>x.id===btn.dataset.id);
      if(!rec) return;
      const delTotal = Number(rec.amount) + Number(rec.discount||0);
      const cust2 = db.customers[rec.customerId];
      if(cust2){ cust2.due = Number(cust2.due||0) + delTotal; await safePut('customers', rec.customerId, cust2); }
      // sale.due reverse
      let delRem = delTotal;
      const paidSales = db.sales.filter(s=>s.customerId===rec.customerId && Number(s.paid||0)>0).sort((a,b)=>b.ts-a.ts);
      for(const sale of paidSales){
        if(delRem<=0) break;
        const rev = Math.min(Number(sale.paid||0), delRem);
        sale.paid = Math.max(0, Number(sale.paid||0) - rev);
        sale.due = Number(sale.due||0) + rev;
        delRem -= rev;
        await safePut('sales', sale.id, sale);
      }
      db.installments = db.installments.filter(x=>x.id!==rec.id);
      await safeRemove('installments', rec.id);
      showToast(t('deleted_toast'));
      openInstallmentHistory(custId);
    });
  });
  applyRoleUi();
}

  document.getElementById('instHistoryOverlay').classList.remove('open');
});

let roleMonitorTimer=null;
function startRoleMonitor(){
  if(roleMonitorTimer)clearInterval(roleMonitorTimer);
  if(!useFirebase)return;
  roleMonitorTimer=setInterval(async()=>{
    if(!currentAuthUser)return;
    try{
      db.appUsers=await fetchCollection('appUsers');
      if(currentRole()==='inactive'){alert('Your ERP access has been disabled by a Super User.');await firebase.auth().signOut();return;}
      renderNav();
      if(!canAccessTab(currentTab)){currentTab='dashboard';renderPage();}
    }catch(err){console.warn('Role refresh failed',err);}
  },45000);
}

    msgEl.style.color = '#1B6B3A';

    document.getElementById('forgotSendBtn').textContent = 'Sent ✓';
  } catch(err) {
    msgEl.style.color = '#c0392b';
    msgEl.textContent = err.code==='auth/user-not-found' ? 'No account found with this email.'
      : err.code==='auth/invalid-email' ? 'Invalid email address.'

    document.getElementById('forgotSendBtn').disabled = false;
    document.getElementById('forgotSendBtn').textContent = 'Send Reset Link';

async function clearAllData(){
  if(!isPrimarySuperUser()){ alert('⛔ শুধুমাত্র Primary Super User ('+PRIMARY_SUPER_EMAIL+') Reset করতে পারবেন।'); return; }
  const step1 = confirm(t('clear_all_confirm1'));
  if(!step1) return;
  const typed = prompt(t('clear_all_confirm2'));
  if(typed !== t('clear_all_confirm_word')) { alert(t('clear_all_aborted')); return; }

  const collections = ['customers','suppliers','products','categories','groupMembers','groups','purchases','sales','expenses','installments','installmentPlans','returns','vendorPayments','travelAdjustments','preRegBatches','preRegPilgrims','loanAccounts','loanTransactions','creditFacilities','creditTransactions','bankAccounts','mobileAccounts','paymentHeads','paymentLedger','agentLedgerHeads','agentLedger','openingBalances','assets','assetEvents'];
  for(const name of collections){
    const items = db[name];
    const ids = Array.isArray(items) ? items.map(x=>x.id) : Object.keys(items);
    for(const id of ids){ await safeRemove(name, id); }
  }
  db.customers = {}; db.suppliers = {}; db.products = {}; db.categories={}; db.groupMembers={}; db.groups={};
  db.bankAccounts={}; db.mobileAccounts={}; db.paymentHeads={}; db.agentLedgerHeads={}; db.assets={};
  db.purchases = []; db.sales = []; db.expenses = [];
  db.installments = []; db.installmentPlans = []; db.returns = []; db.vendorPayments=[]; db.travelAdjustments=[]; db.preRegBatches=[]; db.preRegPilgrims=[]; db.loanAccounts=[]; db.loanTransactions=[]; db.creditFacilities=[]; db.creditTransactions=[]; db.paymentLedger=[]; db.agentLedger=[]; db.openingBalances=[]; db.assetEvents=[];
  try{ await storageSet(K.logo, null); }catch(e){}
  logoData = null;

  renderNav();
  renderPage();
  renderLogo();
  showToast(t('clear_all_done'));
}

function safeShowAppOrLogin(){
  if(useFirebase && !currentAuthUser){
    showLoginScreen();
  } else {
    showApp();
    loadAll();
  }
}

window.addEventListener('error', (ev) => {
  console.error('uncaught error', ev.error || ev.message);
  const appRoot = document.getElementById('appRoot');
  const loginScreen = document.getElementById('loginScreen');
  const stillBlank = appRoot && appRoot.style.display === 'none' && loginScreen && !loginScreen.classList.contains('open');
  if(stillBlank){
    console.warn('Recovering from blank screen after uncaught error');
    try{ safeShowAppOrLogin(); }catch(e){ /* nothing more we can do */ }
  }
});
window.addEventListener('unhandledrejection', (ev) => {
  console.error('unhandled promise rejection', ev.reason);
});

function bootstrapApp(){
  try{
    initStorage();
    initGoogleDrive();
    renderLangSwitch();
    renderBrandTexts();
    if(useFirebase && window.firebase && firebase.auth){
      firebase.auth().onAuthStateChanged(user => {
        currentAuthUser = user;
        try{
          if(user){ showApp(); startRoleMonitor(); loadAll(); }
          else { if(roleMonitorTimer){clearInterval(roleMonitorTimer);roleMonitorTimer=null;} showLoginScreen(); }
        }catch(innerErr){
          console.error('post-auth render failed', innerErr);
          safeShowAppOrLogin();
        }
      }, (authErr) => {
        console.error('auth state listener error', authErr);
        currentAuthUser = null;
        showLoginScreen();
      });
    } else {
      // No Firebase configured — can't gate access without a backend, so just show the app.
      showApp();
      loadAll();
    }
  }catch(e){
    console.error('bootstrap failed', e);
    try{ safeShowAppOrLogin(); }catch(e2){ console.error('fallback also failed', e2); }
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', () => { bootstrapApp(); });
} else {
  bootstrapApp();
}
